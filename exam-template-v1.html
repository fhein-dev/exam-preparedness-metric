 organization's documented lowest security configuration is flagged. An administrator who wants to change a firewall rule on it first submits a stakeholder's formal ask for review. Which pairing is correct?", ["The minimum is the payload; the first step of the change is deployment, governed by patch management", "The minimum is the record; the first step of the change is audit, governed by classification", "The minimum is the state; the first step of the change is verification, governed by records retention", "The minimum is the baseline; the first step of the change is a request for change, governed by configuration management"], 3, "A baseline is the documented lowest level of security configuration allowed. A request for change is the first stage of change management, and configuration management ensures that only authorized and validated changes are made to a system.", 5], ["An outside firm examines access logs, approval forms, and settings to judge whether the company actually follows its access policy. Which activity is this, and why is its independence important?", ["Audit, an independent review of records and activities to assess the adequacy of controls", "Security operations monitoring, a continuous review of events by the response team", "Logging, a collection of user activities by an administrator who owns the system", "Configuration management, an approval process for changes made by the system owner"], 0, "An audit is an independent review and examination of records and activities to assess the adequacy of system controls and compliance with policies. Independence makes the findings more credible than a self-review by the team being checked.", 5], ["A student compares Linux, Unix, and iOS. Which statement is accurate according to the glossary?", ["Linux is Apple's mobile operating system; Unix is open source; iOS is used in software development", "Linux is open source; Unix is used in software development; iOS is Apple's operating system for mobile devices", "Linux, Unix, and iOS are all applications that run on top of a web server", "Linux is used in software development; Unix is Apple's operating system; iOS is open source"], 1, "Linux is an open-source operating system with legally available source code, Unix is an operating system used in software development, and iOS is Apple's operating system for mobile devices.", 5], ["A technician explains that when a laptop starts, one program loads first, its main component stays in memory, and applications such as a web server rely on it for user interface and file management. Which term fits?", ["Protocol, which controls communication between two systems", "Operating system, whose kernel resides in memory at all times", "Application server, which hosts applications to user workstations", "Firmware token, which authenticates the device to the network"], 1, "The operating system is the software master control application that runs the computer. It is the first program loaded, its kernel resides in memory, and it sets standards for application programs and handles most user interface and file management operations.", 5], ["A developer says software is just fixed code that never changes after installation. Which correction best matches the glossary?", ["Software is only the stored data that applications read from a disk during processing", "Software is only code that has been compiled and cannot ever be patched after release", "Software is only the physical components that run programs inside a computer system", "Software is programs and associated data that may be dynamically written or modified during execution"], 3, "Software is defined as computer programs and associated data that may be dynamically written or modified during execution, which is why patches and runtime changes are possible.", 5], ["Before shutting down a compromised server, a forensic analyst records exactly what is running at 2:02 in the afternoon. Which term describes what was captured?", ["Record, evidence of activities performed or results achieved", "Baseline, the documented lowest security configuration allowed", "State, the condition of an entity at a point in time", "Event, an observable occurrence in a network or system"], 2, "State is the condition an entity is in at a point in time. An event is an occurrence, records are evidence of activities, and a baseline is a minimum configuration. The captured snapshot describes the server's condition at that instant.", 5], ["A help desk uses a virtual assistant that understands typed questions and walks users through password resets in a way that imitates a human agent. Which glossary term names this capability, and how does it differ from a bot?", ["Artificial intelligence, the ability to simulate human intelligence; a bot is malicious remotely controlled code", "Artificial intelligence, a protocol for resolving questions; a bot is a type of server", "Artificial intelligence, malicious code controlled remotely; a bot is the ability to simulate human behavior", "Machine automation, a script that follows fixed steps; a bot is a physical robot"], 0, "Artificial intelligence is the ability of computers and robots to simulate human intelligence and behavior. In the glossary, a bot is malicious code that acts like a remotely controlled robot for an attacker, so the two terms are unrelated.", 5], ["A company labels one folder 'Public' and another 'Confidential,' and applies stronger storage and handling controls to the second because disclosure would cause far more harm. What is the purpose of this labeling?", ["To prove that an action cannot be denied later, which is non-repudiation", "To rank systems by how much the mission depends on them, which is criticality", "To record the owner's opinion of a document's importance, which is sensitivity alone", "To match protection to the degree of harm from unauthorized disclosure, which is classification"], 3, "Classification identifies the degree of harm that could result if an information asset were divulged and focuses first on confidentiality, based on data sensitivity. Criticality concerns mission dependence, and non-repudiation concerns proving actions.", 5], ["After an attack, management requires that every change to affected servers be authorized, validated, recorded, and verified. An administrator also rolls out missing operating system revisions across all hosts. Which pairing names the two disciplines?", ["Records retention for the changes; patch management for the revisions", "Configuration management for the changes; records retention for the revisions", "Configuration management for the changes; patch management for the revisions", "Patch management for the changes; configuration management for the revisions"], 2, "Configuration management ensures only authorized and validated changes are made, and patch management is the systematic deployment and verification of code revisions such as patches, hotfixes, and service packs.", 5], ["Which scenario shows artificial intelligence as the glossary defines it?", ["A program that spreads between computers without any action by the users who own those computers", "A program that analyzes questions and replies in a way that simulates human intelligence and behavior", "A device that filters incoming traffic between two networks according to rules set by the administrator", "A procedure that restores services after an outage in an order set by the business impact analysis"], 1, "Artificial intelligence is the ability of computers and robots to simulate human intelligence and behavior. The other options describe a worm, a firewall, and a disaster recovery procedure.", 5], ["A company protects a bulk archive with one shared key that it sends to the recipient through a secure channel. Separately, it publishes a key that anyone may use to send it protected messages. Which pairing is correct?", ["Archive: symmetric encryption; published key: symmetric encryption", "Archive: symmetric encryption; published key: asymmetric encryption", "Archive: asymmetric encryption; published key: symmetric encryption", "Archive: hashing; published key: asymmetric encryption"], 1, "Symmetric encryption uses the same key to encrypt and decrypt, so it must be shared secretly. Asymmetric encryption uses one key to encrypt and a different key to decrypt, which allows a public key to be published for anyone to use safely.", 5], ["A company's own administrators review their access logs and conclude controls are fine. A manager asks what an audit adds. Which answer matches the glossary?", ["An audit is a process that ensures only authorized changes are made to a system under management", "An audit is an independent review and examination of records and activities to assess the adequacy of controls", "An audit is a collection of user activities stored in a record for later use by the administrators", "An audit is a continuous watch of network events by a central team to resolve issues before disruption"], 1, "An audit is an independent review and examination of records and activities to assess the adequacy of system controls and ensure compliance. Independence is what distinguishes it from the owners checking themselves, a monitoring function, logging, or configuration management.", 5], ["A technician wants to allow a nonstandard setting on a server. Which sequence respects configuration management?", ["Ask a coworker to approve verbally, apply the setting, and skip validation in order to save time", "Apply the setting during a quiet period and update the records so the difference is not visible to others", "Apply the setting first, submit a request afterward, and then lower the baseline to match the new setting", "Submit a request for change, obtain authorization, apply and validate the change, and keep the server at or above its baseline"], 3, "Configuration management ensures the only changes made to a system are authorized and validated, and the request for change is the first stage of change management. The baseline is the documented lowest level of security configuration allowed, so changes should not lower it without approval.", 5], ["Which statement correctly differentiates a checksum from a message digest?", ["A checksum is created only by the receiver, while a message digest is created only by the sender", "A checksum encrypts the data with a shared key, while a message digest compresses the data to a fixed size", "A checksum proves who created the data, while a message digest hides the data from unauthorized readers", "A checksum compares sums of digits to detect errors, while a message digest changes completely if one bit changes"], 3, "A checksum is a digit representing the sum of the correct digits in data, compared later to detect errors. A message digest uniquely identifies data and has the property that changing a single bit produces a completely different digest. Neither proves authorship or hides data.", 5], ["Which data is most vulnerable from a confidentiality perspective?", ["A message in its natural, readable format", "A message converted into an unreadable form for its intended recipients", "A message altered into a secret by an encryption process", "A message protected so only holders of the correct key can read it"], 0, "Plaintext is a message or data in its natural, readable format and is extremely vulnerable from a confidentiality perspective. Ciphertext is the altered form of a message that is unreadable except to intended recipients.", 5], ["A document is stamped 'Restricted' on every page to show the protection level it requires. Which statement best describes what the stamp represents?", ["The document is a record, kept as evidence that an activity was performed by someone in the organization", "The document is a baseline, showing the lowest security configuration allowed for the organization's servers", "The document is a checksum, a digit compared later to detect errors in data after it has been stored", "The document is classified or sensitive information, marked with its classification level in documentary form"], 3, "Classified or sensitive information is information determined to require protection against unauthorized disclosure and marked to indicate its status and classification level when in documentary form.", 5], ["Who normally assigns sensitivity to information, and for what purpose?", ["The owner assigns it, to denote the information's need for protection", "The incident response team assigns it, to rank systems for recovery", "The system administrator assigns it, to decide which patches are needed", "The auditor assigns it, to test whether controls have been applied correctly"], 0, "Sensitivity is a measure of the importance assigned to information by its owner, for the purpose of denoting its need for protection. Classification then focuses on harm from disclosure, and recovery order depends on criticality.", 5], ["Which activity belongs to a cryptanalyst?", ["Operating the key management procedures of an encryption system for an organization's daily work", "Designing a new cipher to disguise the content of messages so that outsiders cannot understand them", "Verifying digital signatures on documents received from partners before accepting them as authentic", "Studying mathematical techniques to defeat a cipher or looking for weaknesses in how it is implemented"], 3, "A cryptanalyst performs cryptanalysis, the study of mathematical techniques for attempting to defeat cryptographic techniques and information systems security, including finding errors in an implementation. Designing methods to protect messages is cryptography.", 5], ["Which statement correctly contrasts data loss prevention with monitoring of outgoing traffic?", ["Data loss prevention can detect and prevent unauthorized use and transmission, while outgoing traffic monitoring observes traffic leaving the network", "Data loss prevention only reviews records after incidents, while outgoing monitoring prevents those incidents beforehand", "Data loss prevention only observes outgoing traffic, while outgoing monitoring blocks transmissions that it finds suspicious", "Data loss prevention only records user activities, while outgoing monitoring prevents unauthorized use of the information"], 0, "Data loss prevention is a set of system capabilities designed to detect and prevent the unauthorized use and transmission of information. Egress monitoring is monitoring of outgoing network traffic, which observes rather than necessarily prevents.", 5], ["A recipient holds the ciphertext and the correct key. Which operation recovers the original message, and what else is it called?", ["Encryption, which is also used interchangeably with deciphering", "Decryption, which is also used interchangeably with deciphering", "Decryption, which is also used interchangeably with enciphering", "Encryption, which is also used interchangeably with encapsulation"], 1, "Decryption converts ciphertext back into plaintext using the cryptographic algorithm and the appropriate key, and is used interchangeably with deciphering. Encryption is the opposite process and is sometimes called enciphering.", 5], ["Which statement best describes what it means to encrypt?", ["To protect private information by putting it into a form that only people with permission can read", "To bundle data and methods together so that the internal workings are hidden from other programs", "To record user activities in a log so that an independent party can review them later", "To erase data from magnetic media so that it cannot be reconstructed by any means"], 0, "To encrypt is to protect private information by converting it into a form that only authorized people can read, which is the act of encryption. Bundling data is encapsulation, recording activity is logging, and erasing magnetic media is degaussing.", 5], ["Which result indicates that degaussing was properly performed on a tape?", ["The tape contains an encrypted copy of the data for later restoration", "The tape contains a checksum showing that no errors occurred during erasure", "There is insufficient magnetic remanence to reconstruct the data on the tape", "The tape has been marked with a classification level for its previous contents"], 2, "Degaussing is a technique of erasing data on disk or tape that, when performed properly, ensures there is insufficient magnetic remanence to reconstruct the data. Remanence is the residual information left after clearing.", 5], ["Which problem can a digital signature solve that a plain message digest cannot?", ["Showing that a single bit of the data has changed since it was created", "Showing that the data was compressed to a smaller size for faster delivery", "Showing that the data has been kept in a secure location for a set interval", "Showing who created the data and preventing the signer from later denying it"], 3, "A digital signature provides origin authentication, data integrity, and signer non-repudiation. A message digest only identifies data and reveals changes, which a signature also does, but it does not bind the data to a signer.", 5], ["Which element is part of an encryption system but is not the algorithm itself?", ["The decryption of ciphertext back into plaintext for the recipient", "The procedures for generating, storing, and replacing keys", "The plaintext message that the algorithm converts into ciphertext", "The study of mathematical techniques used to defeat the algorithm"], 1, "An encryption system is the total set of algorithms, processes, hardware, software, and procedures that together provide an encryption and decryption capability. Key handling procedures are part of the system beyond the algorithm.", 5], ["Which statement correctly pairs each operating system with its description?", ["Linux: open source with available source code; iOS: Apple's mobile operating system; Unix: used in software development", "Linux: an operating system used in software development; iOS: a web server; Unix: a mobile device application", "Linux: Apple's mobile operating system; iOS: open source with available source code; Unix: used in software development work", "Linux: used in software development; iOS: open source with available source code; Unix: Apple's mobile operating system"], 0, "Linux is open source, making its source code legally available to end users. iOS is an operating system manufactured by Apple Inc. for mobile devices, and Unix is an operating system used in software development.", 5], ["Which statement is correct about log anomalies?", ["A log anomaly is the destruction of log entries once the retention interval has passed on", "A log anomaly is an irregularity found while studying log entries that could be an event of interest", "A log anomaly is a record of the evidence of activities performed by a system in operation", "A log anomaly is the collection and storage of user activities in a log kept by the system"], 1, "A log anomaly is a system irregularity identified when studying log entries, which could represent events of interest for further surveillance. Logging is the collection and storage of user activities, and records retention governs how long evidence is kept.", 5], ["Which statement about the operating system is accurate?", ["It is a set of rules that controls communication between systems over a network", "It is the last program loaded at start-up, and its kernel is loaded only when applications request services", "It is the first program loaded at start-up, and its main component, the kernel, resides in memory at all times", "It is a hosted application that provides World Wide Web services to many browsers"], 2, "The operating system is the software master control application that runs the computer. It is the first program loaded when the computer is turned on, its kernel resides in memory at all times, and it sets standards for application programs that run on it.", 5], ["Which statement correctly distinguishes a patch from patch management?", ["A patch is the systematic process of deploying revisions to systems; patch management is a component that modifies another without changing its version number", "A patch modifies another component without changing its version number; patch management is the systematic notification, identification, deployment, installation, and verification of revisions", "A patch is an independent review of records and activities; patch management is the practice of destroying old revisions after review", "A patch is a documented lowest configuration of a system; patch management is the process of enforcing that configuration on each server"], 1, "A patch is a software component that directly modifies files or device settings of another component without changing the version number. Patch management is the systematic notification, identification, deployment, installation, and verification of revisions such as patches, hotfixes, and service packs.", 5], ["Which is a record as the glossary defines the term, and which statement describes how long records are kept?", ["A policy stating management's intent to protect information; records are destroyed immediately after they have been used once", "A signed test report showing that a control worked as intended; records are kept as long as necessary and then destroyed", "A tool that scans a network for connected devices; records are kept until the next audit takes place at the company", "A firewall rule that allows web traffic to a public server; records are kept permanently once they are created by anyone"], 1, "Records are recordings of evidence of activities performed or results achieved, such as forms, reports, and test results. Records retention is the practice of retaining records as long as necessary and then destroying them after the appropriate interval.", 5], ["Which activity belongs to a security operations center?", ["Monitoring, detecting, and analyzing events on the network to prevent and resolve issues before business disruption", "Retaining and destroying records according to a schedule that has been set by the organization's policy", "Approving requests for change before they are deployed to production systems by the information technology staff", "Setting the organization's roles and policies for security decisions at the level of the board or its committees"], 0, "A security operations center is a centralized organizational function fulfilled by an information security team that monitors, detects, and analyzes events on the network or system to prevent and resolve issues before they result in business disruptions.", 5], ["Two snapshots of the same server, taken before and after an update, differ in what is installed and running. Which term names what is different between them?", ["Its record, the evidence of an activity performed", "Its event, an observable occurrence in the system", "Its state, the condition of the entity at a point in time", "Its baseline, the lowest configuration allowed by a standard"], 2, "State is the condition an entity is in at a point in time, so two snapshots at different times capture different states. A baseline is a minimum standard, an event is an occurrence, and a record is evidence.", 5], ["Which statement is true of classification?", ["It measures how much the mission depends on a system for the success of the business function", "It records the owner's opinion about the importance of a document for the purpose of its protection", "It identifies the degree of harm disclosure to an unauthorized party might cause and focuses first on confidentiality", "It documents how long records must be kept before they are destroyed under the retention practice"], 2, "Classification identifies the degree of harm to the organization, its stakeholders, or others if an information asset is divulged to an unauthorized party, and focuses first and foremost on confidentiality based on data sensitivity. Mission dependence is criticality, and owner importance is sensitivity.", 5], ["Which control would reveal that a server has drifted below its documented lowest security configuration?", ["Checking the server's digital signature against a published digest from the vendor's download page", "Counting how many users have accounts on the server and comparing the count to last quarter", "Comparing the server's settings with the baseline as part of configuration management", "Reviewing the retention schedule for records about the server that have been collected by the team"], 2, "The baseline is the documented lowest level of security configuration allowed, and configuration management ensures the only changes made are authorized and validated. Comparing settings with the baseline shows drift. Retention schedules, signatures, and account counts do not measure configuration.", 5]]};
const SETS={master:{n:"Master application set",d:"155 hard application scenarios covering the full glossary and all five domains",q:MASTER,exam:true},exam:{n:"Simulated exam",d:"100 questions at domain weights, with a domain breakdown at the end",q:EXAM,exam:true},hardexam:{n:"Simulated exam, harder",d:"100 tougher questions at domain weights, with a domain breakdown at the end",q:HARDEXAM,exam:true},dq1:{n:"Domain 1 quiz",dq:true,exam:true,q:DQ[1]},dq2:{n:"Domain 2 quiz",dq:true,exam:true,q:DQ[2]},dq3:{n:"Domain 3 quiz",dq:true,exam:true,q:DQ[3]},dq4:{n:"Domain 4 quiz",dq:true,exam:true,q:DQ[4]},dq5:{n:"Domain 5 quiz",dq:true,exam:true,q:DQ[5]}};
const GLOSS=[["Adequate Security", "Security commensurate with the risk and the magnitude of harm resulting from the loss, misuse or unauthorized access to or modification of information. Source: Office of Management and Budget Circular A-130", "A small clinic and a national bank both hold customer data, but the bank's breach would cause far more harm. 'Adequate' therefore means the bank must invest in stronger controls than the clinic, because protection is scaled to risk and potential harm, not to a one-size-fits-all checklist.", 1], ["Administrative Controls", "Controls implemented through policy and procedures. Examples include access control processes and requiring multiple personnel to conduct a specific operation. Administrative controls in modern environments are often enforced in conjunction with physical and/or technical controls, such as an access-granting policy for new users that requires login and approval by the hiring manager.", "A company writes a policy that new employees get system access only after the hiring manager approves. The policy is administrative; the identity system that refuses to create the account without that approval is the technical control enforcing it.", 1], ["Adverse Events", "Events with a negative consequence, such as system crashes, network packet floods, unauthorized use of system privileges, defacement of a web page or execution of malicious code that destroys data.", "Overnight, the company website is defaced and a server crashes. Both are adverse events because they cause harm. Whether either is also a formal incident depends on whether it jeopardizes confidentiality, integrity, or availability.", 2], ["Application Programming Interface", "A set of routines, standards, protocols, and tools for building software applications to access a web-based software application or web tool.", "A food-delivery app needs to charge cards. Instead of building payment processing itself, it calls the payment provider's application programming interface, sending a request in the documented format and receiving a result. The application programming interface defines exactly how the two programs may talk to each other.", 4], ["Application Server", "A computer responsible for hosting applications to user workstations. National Institute of Standards and Technology Special Publication 800-82 Revision 2", "Employees open an accounting program from their desktops, but the program actually runs on a central machine in the data center. That central machine is the application server; users' computers only display and interact with it.", 4], ["Artificial Intelligence", "The ability of computers and robots to simulate human intelligence and behavior.", "A help desk uses a virtual assistant that understands typed questions and walks users through password resets. The software imitates how a human agent would reason and respond, which is what the glossary means by artificial intelligence (not to be confused with malicious 'bots').", 5], ["Asset", "Anything of value that is owned by an organization. Assets include both tangible items such as information systems and physical property and intangible assets such as intellectual property.", "A software firm's asset list includes laptops and a building, but also its source code and brand reputation. Leaving out the source code would hide its most valuable asset, so risk assessments start by listing both tangible and intangible assets.", 1], ["Asymmetric Encryption", "An algorithm that uses one key to encrypt and a different key to decrypt the input plaintext.", "Maya wants to send Sam a confidential file. She encrypts it with Sam's public key. Only Sam's matching private key can decrypt it, so Maya never needs to share a secret with him in advance.", 5], ["Audit", "Independent review and examination of records and activities to assess the adequacy of system controls, to ensure compliance with established policies and operational procedures. National Institute of Standards and Technology Special Publication 1800-15B", "An outside firm examines access logs, approval forms, and configurations to see whether the company really follows its access policy. Because the reviewers are independent, their findings are more credible than a self-check by the information technology team.", 5], ["Authentication", "The act of identifying or verifying the eligibility of a station, originator, or individual to access specific categories of information. Typically, a measure designed to protect against fraudulent transmissions by establishing the validity of a transmission, message, station or originator.", "A user enters a password and approves a prompt on their phone. The system is verifying that the person is who they claim to be. Authentication comes before authorization, which decides what that verified person may do.", 1], ["Authorization", "The right or a permission that is granted to a system entity to access a system resource. National Institute of Standards and Technology 800-82 Revision 2", "After logging in, a payroll clerk can open payroll files but the 'Admin' menu is hidden. The system has authenticated the clerk and then applied authorization: this identity has permission for payroll, not for administration.", 3], ["Availability", "Ensuring timely and reliable access to and use of information by authorized users.", "An online store's checkout fails for three hours because a server crashed. No data was stolen or altered, but customers couldn't reach the service when needed, so availability was lost. Redundant servers and backups protect it.", 1], ["Baseline", "A documented, lowest level of security configuration allowed by a standard or organization.", "A company's server baseline requires disabled default accounts, current patches, and logging enabled. A new server that lacks logging fails the baseline check and can't go into production until it meets the minimum.", 5], ["Biometric", "Biological characteristics of an individual, such as a fingerprint, hand geometry, voice, or iris patterns.", "A research lab unlocks its door with an iris scan. The system verifies something the person is rather than something they know or carry, which also means it can't be lent to a coworker the way a badge can.", 1], ["Bit", "The most essential representation of data (zero or one) at Layer 1 of the Open Systems Interconnection model.", "When a network cable carries a signal, the electrical or light pulses represent individual bits. A network technician who tests the cable is working at Layer 1, below packets and frames.", 4], ["Bot", "Malicious code that acts like a remotely controlled “robot” for an attacker, with other Trojan and worm capabilities.", "An employee's laptop is infected and quietly joins thousands of other infected machines. The attacker later commands them all to flood a victim's website. Each infected laptop is a bot, controlled remotely without the owner knowing.", 4], ["Breach", "The loss of control, compromise, unauthorized disclosure, unauthorized acquisition or any similar occurrence where: a person other than an authorized user accesses or potentially accesses personally identifiable information; or an authorized user accesses personally identifiable information for other than an authorized purpose. Source: National Institute of Standards and Technology Special Publication 800-53 Revision 5", "A hospital employee browses the records of a famous patient out of curiosity. Although the employee is authorized to use the system, the purpose isn't authorized, so this can be a breach of personally identifiable information.", 2], ["Broadcast", "Broadcast transmission is a one-to-many (one-to-everyone) form of sending internet traffic.", "A device on a local network announces itself to every other device at once instead of contacting a single recipient. That one-to-everyone transmission is a broadcast, which is why very large flat networks can suffer from excess broadcast traffic.", 4], ["Business Continuity", "Actions, processes and tools for ensuring an organization can continue critical operations during a contingency.", "During a long power outage, a call center moves agents to a secondary site and uses paper forms to keep taking orders. These actions keep critical operations running, which is business continuity, even while information technology systems are still being restored.", 2], ["Business Continuity Plan", "The documentation of a predetermined set of instructions or procedures that describe how an organization’s mission/business processes will be sustained during and after a significant disruption.", "Before any disaster, a company writes down who works where, which processes run manually, and how customers are told. When a flood closes the main office, staff follow that written business continuity plan instead of improvising.", 2], ["Business Impact Analysis", "An analysis of an information system’s requirements, functions, and interdependencies used to characterize system contingency requirements and priorities in the event of a significant disruption. National Institute of Standards and Technology Special Publication 800-34 Revision 1", "A retailer maps its systems and finds that order processing depends on the payment gateway and database, while the intranet is less urgent. The business impact analysis ranks order processing first for recovery, which then guides the disaster recovery plan.", 2], ["Byte", "The byte is a unit of digital information that most commonly consists of eight bits.", "A file field that holds 16 bits can store two bytes of data. Understanding bytes helps when sizes of files, packets, or storage are described.", 4], ["Checksum", "A digit representing the sum of the correct digits in a piece of stored or transmitted digital data, against which later comparisons can be made to detect errors in the data.", "A backup program computes a checksum for a file before copying and again afterward. If the values differ, the copy was corrupted. Note that a checksum detects errors but does not by itself keep data secret or prove who created it.", 5], ["Ciphertext", "The altered form of a plaintext message so it is unreadable for anyone except the intended recipients. In other words, it has been turned into a secret.", "A laptop is lost, but its drive was encrypted. Anyone who opens the files sees only unreadable ciphertext, so the data remains confidential without the proper key.", 5], ["Classification", "Classification identifies the degree of harm to the organization, its stakeholders or others that might result if an information asset is divulged to an unauthorized person, process or organization. In short, classification is focused first and foremost on maintaining the confidentiality of the data, based on the data sensitivity.", "A firm labels its marketing flyers Public and its merger plans Confidential. Because disclosure of the merger plans would cause far more harm, they receive tighter access, storage, and handling controls.", 5], ["Classified or Sensitive Information", "Information that has been determined to require protection against unauthorized disclosure and is marked to indicate its classified status and classification level when in documentary form.", "A government agency stamps a report 'Secret' on each page. The marking tells every handler the required level of protection and who may read it, so no one has to guess how sensitive it is.", 5], ["Cloud Computing", "A model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (for example, networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction. National Institute of Standards and Technology 800-145", "A startup launches new servers in minutes through a provider's web portal and shuts them down when demand drops, paying only for use. The shared pool, on-demand access, and fast provisioning are the cloud model.", 4], ["Community Cloud", "A system in which the cloud infrastructure is provisioned for exclusive use by a specific community of consumers from organizations that have shared concerns (for example, mission, security requirements, policy and compliance considerations). It may be owned, managed and operated by one or more of the organizations in the community, a third party or some combination of them, and it may exist on or off premises. National Institute of Standards and Technology 800-145", "Three regional hospitals with identical privacy regulations build a shared cloud for patient scheduling. Only the three can use it, and its design reflects their common compliance needs, making it a community cloud.", 4], ["Confidentiality", "The characteristic of data or information when it is not made available or disclosed to unauthorized persons or processes. National Institute of Standards and Technology 800-66", "A company encrypts customer records and limits who can read them. If a stranger obtains the database but cannot read it, confidentiality has been preserved even though the theft happened.", 1], ["Configuration Management", "A process and discipline used to ensure that the only changes made to a system are those that have been authorized and validated.", "A server suddenly behaves differently because someone changed a setting without approval. Under configuration management, every change requires a request, approval, and record, so the unapproved change is detected and reversed.", 5], ["Crime Prevention through Environmental Design", "An architectural approach to the design of buildings and spaces that emphasizes passive features to reduce the likelihood of criminal activity.", "A company redesigns its parking lot with bright lighting, clear sight lines, and trimmed shrubs so attackers have nowhere to hide. No guard is needed to make the space less attractive to criminals; the design itself does the work.", 3], ["Criticality", "A measure of the degree to which an organization depends on the information or information system for the success of a mission or of a business function. National Institute of Standards and Technology Special Publication 800-60 Volume 1, Revision 1", "A company's order platform generates all its revenue, while a staff newsletter site generates none. The order platform has high criticality, so it is restored first after an outage.", 2], ["Cryptanalyst", "One who performs cryptanalysis, which is the study of mathematical techniques for attempting to defeat cryptographic techniques and/or information systems security. This includes the process of looking for errors or weaknesses in the implementation of an algorithm or of the algorithm itself.", "A researcher analyzes a new encryption library and finds that it generates predictable keys. By identifying the implementation flaw, the cryptanalyst helps developers fix it before attackers exploit it.", 5], ["Cryptography", "The study or applications of methods to secure or protect the meaning and content of messages, files, or other information, usually by disguise, obscuration, or other transformations of that content and meaning.", "A messaging app scrambles every message so only the recipient can read it. The methods used to scramble and unscramble it are cryptography; breaking those methods is cryptanalysis.", 5], ["Data Integrity", "The property that data has not been altered in an unauthorized manner. Data integrity covers data in storage, during processing and while in transit. Source: National Institute of Standards and Technology Special Publication 800-27 Revision A", "An attacker intercepts a bank transfer and changes the amount. Because data was modified in transit without authorization, data integrity was violated even though the message stayed secret.", 1], ["Data Loss Prevention", "System capabilities designed to detect and prevent the unauthorized use and transmission of information.", "An employee tries to email a spreadsheet full of customer card numbers to a personal account. The company's data loss prevention tool recognizes the sensitive content and blocks the message, rather than only logging it.", 5], ["Decryption", "The reverse process from encryption. It is the process of converting a ciphertext message back into plaintext through the use of the cryptographic algorithm and the appropriate key for decryption (which is the same for symmetric encryption, but different for asymmetric encryption). This term is also used interchangeably with “deciphering.”", "After receiving an encrypted file, Sam uses his private key to turn the ciphertext back into readable plaintext. That reversal is decryption.", 5], ["De-encapsulation", "The opposite process of encapsulation, in which bundles of data are unpacked or revealed.", "When a message arrives at a computer, each network layer removes its own header in turn until the original data reaches the application. This unwrapping is de-encapsulation.", 4], ["Defense in Depth", "Information security strategy integrating people, technology, and operations capabilities to establish variable barriers across multiple layers and missions of the organization. Source: National Institute of Standards and Technology Special Publication 800-53 Revision 4", "A company doesn't rely on a firewall alone. It adds endpoint protection, multi-factor authentication, staff training, and monitoring so that if one control fails, others still protect the asset.", 4], ["Degaussing", "A technique of erasing data on disk or tape (including video tapes) that, when performed properly, ensures that there is insufficient magnetic remanence to reconstruct data.", "Before returning leased magnetic backup tapes, a firm passes them through a powerful degausser. The magnetic field wipes the data so thoroughly that it can't be rebuilt, which protects confidentiality after disposal.", 5], ["Denial-of-Service", "The prevention of authorized access to resources or the delaying of time-critical operations. (Time-critical may be milliseconds or it may be hours, depending upon the service provided.) Source: National Institute of Standards and Technology Special Publication 800-27 Revision A", "A flood of requests overwhelms a ticket seller's website on the day concert tickets go on sale. Genuine customers can't buy tickets even though nothing was stolen, which is a denial of service attack on availability.", 4], ["Digital Signature", "The result of a cryptographic transformation of data which, when properly implemented, provides the services of origin authentication, data integrity, and signer non-repudiation. National Institute of Standards and Technology Special Publication 800-12 Revision 1", "A supplier signs a contract with a digital signature. The buyer can verify who signed it, confirm it wasn't altered afterward, and the supplier can't credibly deny signing later.", 5], ["Disaster Recovery", "In information systems terms, the activities necessary to restore information technology and communications services to an organization during and after an outage, disruption or disturbance of any kind or scale.", "After a fire destroys a server room, the information technology team rebuilds servers, restores data from backups, and reconnects the network. Those restoration steps are disaster recovery, while keeping the business running meanwhile is business continuity.", 2], ["Disaster Recovery Plan", "The processes, policies and procedures related to preparing for recovery or continuation of an organization's critical business functions, technology infrastructure, systems and applications after the organization experiences a disaster. A disaster is when an organization’s critical business function(s) cannot be performed at a acceptable level within a predetermined period following a disruption.", "Anticipating floods, a company documents which systems to restore first, where backups are, and who does what. When a flood hits, technicians follow the disaster recovery plan in the order set by the business impact analysis.", 2], ["Discretionary Access Control", "A certain amount of access control is left to the discretion of the object’s owner, or anyone else who is authorized to control the object’s access. The owner can determine who should have access rights to an object and what those rights should be. National Institute of Standards and Technology Special Publication 800-192", "A project lead creates a shared folder and decides which teammates may read or edit it. Because the owner chooses who gets access, this is discretionary access control.", 3], ["Domain Name Service", "This acronym can be applied to three interrelated elements: a service, a physical server and a network protocol.", "When you type a website's name, a Domain Name Service translates it into an Internet Protocol address using Domain Name Service servers and the Domain Name Service protocol. The same three-part meaning explains why people say 'the Domain Name Service is down' for different reasons.", 4], ["Egress Monitoring", "Monitoring of outgoing network traffic.", "A security team notices an unusual 40 gigabytes upload from a finance workstation to an unknown address at 2 in the morning Because they monitor outgoing traffic, they spot possible data theft that inbound monitoring alone would miss.", 4], ["Encapsulation", "Enforcement of data hiding and code hiding during all phases of software development and operational use. Bundling together data and methods is the process of encapsulation; its opposite process may be called unpacking, revealing, or using other terms. Also used to refer to taking any set of data and packaging it or hiding it in another data structure, as is common in network protocols and encryption.", "When an email travels across a network, each layer adds its own header around the data, like placing a letter in successively larger envelopes. That wrapping is encapsulation.", 4], ["Encrypt", "To protect private information by putting it into a form that can only be read by people who have permission to do so.", "A user chooses to encrypt a document before saving it to the cloud. Anyone without permission who opens the file sees only scrambled characters.", 5], ["Encryption", "The process and act of converting the message from its plaintext to ciphertext. Sometimes it is also referred to as enciphering. The two terms are sometimes used interchangeably in literature and have similar meanings.", "A messaging app converts each outgoing message into ciphertext on the sender's phone and converts it back on the recipient's phone. The conversion step is encryption.", 5], ["Encryption System", "The total set of algorithms, processes, hardware, software and procedures that taken together provide an encryption and decryption capability.", "A company with a strong cipher but sloppy key storage has a weak encryption system. Security depends on the whole system, including key management procedures, not just the algorithm.", 5], ["Event", "Any observable occurrence in a network or system. Source: National Institute of Standards and Technology Special Publication 800-61 Revision 2", "A user logs in, a file is saved, and a firewall blocks a scan. All are events; most are routine, and only some will later be judged adverse events or incidents.", 2], ["Exploit", "A particular attack. It is named this way because these attacks exploit system vulnerabilities.", "A published script targets an unpatched flaw in a web server to run attacker commands. The flaw is the vulnerability; the script that abuses it is the exploit.", 4], ["File Transfer Protocol", "The internet protocol (and program) used to transfer files between hosts.", "An administrator uploads website files to a hosting server using File Transfer Protocol. Because plain File Transfer Protocol does not encrypt by default, a security-minded team might replace it with a protected alternative.", 4], ["Firewalls", "Devices that enforce administrative security policies by filtering incoming traffic based on a set of rules.", "A company's firewall allows web traffic to its public server but blocks all other inbound connections. The rule set is how the firewall turns written security policy into enforcement.", 4], ["Fragment Attack", "In a fragment attack, an attacker fragments traffic in such a way that a system is unable to put data packets back together.", "An attacker sends deliberately mangled fragments of a message so the target can't reassemble them. The system wastes resources or fails, even though no single fragment looks harmful.", 4], ["General Data Protection Regulation", "In 2016, the European Union passed comprehensive legislation that addresses personal privacy, deeming it an individual human right.", "A United States retailer sells to customers in Germany. Because General Data Protection Regulation treats personal privacy as an individual right, the retailer must handle those customers' personal data according to European Union rules even though it is based elsewhere.", 1], ["Governance", "The process of how an organization is managed; usually includes all aspects of how decisions are made for that organization, such as policies, roles and procedures.", "The board decides who is accountable for security, which policies exist, and who approves exceptions. Those decision-making structures are governance, as distinct from day-to-day operations.", 1], ["Impact", "The magnitude of harm that could be caused by a threat’s exercise of a vulnerability.", "If an attacker exploits a flaw in a payroll system, the harm could be stolen salaries, legal fines, and lost trust. The size of that harm is the impact, which is higher for valuable, sensitive systems.", 1], ["Incident", "An event that actually or potentially jeopardizes the confidentiality, integrity or availability of an information system or the information the system processes, stores or transmits.", "A single failed login is just an event. Ransomware running on a file server is a incident because it jeopardizes the availability and integrity of data.", 2], ["Incident Handling or Incident Response", "The process of detecting and analyzing incidents to limit the incident's effect.", "A security operations center analyst spots suspicious outbound traffic, confirms it is real, isolates the host, and documents findings. That sequence of detecting, analyzing, and limiting the damage is incident response.", 2], ["Incident Response Plan", "The documentation of a predetermined set of instructions or procedures to detect, respond to and limit consequences of a malicious cyberattack against an organization’s information systems(s). Source: National Institute of Standards and Technology Special Publication 800-34 Revision 1", "A company preparing for ransomware writes down who declares a incident, how to isolate machines, and who talks to customers. When an attack happens, the team follows the incident response plan instead of improvising.", 2], ["Information Security Risk", "The potential adverse impacts to an organization’s operations (including its mission, functions and image and reputation), assets, individuals, other organizations, and even the nation, which results from the possibility of unauthorized access, use, disclosure, disruption, modification or destruction of information and/or information systems.", "A power utility's control system could be disrupted by attackers. The potential harm goes beyond the company to customers and even national safety, which is why risk is defined so broadly.", 1], ["Infrastructure as a Service", "The provider of the core computing, storage and network hardware and software that is the foundation upon which organizations can build and then deploy applications. Infrastructure as a Service is popular in the data center where software and servers are purchased as a fully outsourced service and usually billed on usage and how much of the resource is used.", "A startup rents virtual servers and storage from a cloud provider, installs its own operating system and applications, and pays only for what it uses. The provider manages the hardware; the customer manages everything above it.", 4], ["Ingress Monitoring", "Monitoring of incoming network traffic.", "A security team watches inbound traffic and notices thousands of connection attempts probing every port on its web server. The monitoring of incoming traffic reveals a scan in progress.", 4], ["Insider Threat", "An entity with authorized access that has the potential to harm an information system through destruction, disclosure, modification of data, and/or denial of service. National Institute of Standards and Technology Special Publication 800-32", "A system administrator who is about to resign copies confidential files to a personal drive. Because the person already has legitimate access, perimeter defenses don't stop them, which is what makes insider threats distinctive.", 3], ["Institute of Electrical and Electronics Engineers", "Institute of Electrical and Electronics Engineers is a professional organization that sets standards for telecommunications, computer engineering and similar disciplines.", "A vendor says its wireless equipment follows an Institute of Electrical and Electronics Engineers standard. That tells buyers the product conforms to an openly defined specification developed by an engineering body.", 4], ["Integrity", "The property of information whereby it is recorded, used and maintained in a way that ensures its completeness, accuracy, internal consistency and usefulness for a stated purpose.", "A monthly report's totals don't match its detail pages even though nobody tampered with it. The information lacks accuracy and internal consistency, so integrity is in question.", 1], ["International Organization of Standards", "The International Organization of Standards develops voluntary international standards in collaboration with its partners in international standardization, the International Electro-technical Commission and the International Telecommunication Union, particularly in the field of information and communication technologies.", "A company seeks certification against an International Organization of Standards security standard to show customers it follows internationally recognized practices. The standard is voluntary, but customers may require it.", 1], ["Internet Control Message Protocol", "An Internet Protocol network protocol standardized by the Internet Engineering Task Force through Request for Comments 792 to determine if a particular service or host is available.", "A technician pings a server to see whether it responds. The ping uses Internet Control Message Protocol to check availability, showing whether the host is reachable on the network.", 4], ["Internet Engineering Task Force", "The internet standards organization, made up of network designers, operators, vendors and researchers, that defines protocol standards (for example, Internet Protocol, Transport Control Protocol, Domain Name Service) through a process of collaboration and consensus. Source: National Institute of Standards and Technology Special Publication 1800-16B", "When engineers want to know how Transport Control Protocol is supposed to behave, they read the specification that the Internet Engineering Task Force published. The Internet Engineering Task Force's consensus process is how Internet protocols become standards.", 4], ["Internet Protocol", "Standard protocol for transmission of data from source to destinations in packet-switched communications networks and interconnected systems of such networks. Committee on National Security Systems Instruction 4009-2015", "Every device on an Internet Protocol version 4 network gets an address, and routers use it to forward packets from source to destination across many networks. Internet Protocol version 4 is the addressing and delivery scheme at the Network layer.", 4], ["Intrusion", "A security event, or combination of security events, that constitutes a security incident in which an intruder gains, or attempts to gain, access to a system or system resource without authorization. Source: Internet Engineering Task Force Request for Comments 4949 Version 2", "Someone repeatedly tries to log in to a file server using guessed credentials. Because they are trying to gain unauthorized access, this is an intrusion, even if every attempt fails.", 2], ["iOS", "An operating system manufactured by Apple Inc. Used for mobile devices.", "A company issues iPhones to staff and must configure and patch them. Because iOS is the mobile operating system, mobile device policies must account for it as well as for laptops.", 5], ["Layered Defense", "The use of multiple controls arranged in series to provide several consecutive controls to protect an asset; also called defense in depth.", "An attacker who gets past the network firewall still has to defeat endpoint protection, access controls, and monitoring before reaching the database. Each control is another layer in the series.", 4], ["Likelihood", "The probability that a potential vulnerability may be exercised within the construct of the associated threat environment.", "A flaw exists on an internal server that few attackers can reach and no one is targeting. The likelihood of exploitation is low, even though the vulnerability exists.", 1], ["Likelihood of Occurrence", "A weighted factor based on a subjective analysis of the probability that a given threat is capable of exploiting a given vulnerability or set of vulnerabilities.", "In a risk workshop, experts rate each threat's chance of exploiting a weakness on a scale of 1 to 5 based on their judgment. That judgment-based weight is the likelihood of occurrence.", 1], ["Linux", "An operating system that is open source, making its source code legally available to end users.", "A company chooses Linux for its servers because it can inspect and modify the source code. Open source means the code is available to users, though it still must be patched and configured securely.", 5], ["Log Anomaly", "A system irregularity that is identified when studying log entries which could represent events of interest for further surveillance.", "An analyst reviewing logs notices an employee who works days logging in repeatedly at 3 in the morning That irregularity is a log anomaly, prompting investigation to see if it signals a incident.", 5], ["Logging", "Collecting and storing user activities in a log, which is a record of the events occurring within an organization’s systems and networks. National Institute of Standards and Technology Special Publication 1800-25B.", "A server records every login, file access, and configuration change. Later, investigators use these logs to reconstruct what happened, tie actions to people, and find anomalies.", 5], ["Logical Access Control Systems", "An automated system that controls an individual’s ability to access one or more computer system resources, such as a workstation, network, application or database. A logical access control system requires the validation of an individual’s identity through some mechanism, such as a personal identification number, card, biometric or other token. It has the capability to assign different access privileges to different individuals depending on their roles and responsibilities in an organization. National Institute of Standards and Technology Special Publication 800-53 Revision 5.", "An employee swipes a card, enters a personal identification number, and the system grants access only to the applications for their role. The automated checking of identity and assignment of privileges is a logical access control system.", 3], ["Man-in-the-Middle", "An attack where the adversary positions himself in between the user and the system so that he can intercept and alter data traveling between them. Source: National Institute of Standards and Technology Interagency or Internal Report 7711", "On a hotel's open Wi-Fi, an attacker secretly relays a traveler's traffic to a bank site while reading and changing it. The traveler believes they're talking directly to the bank, but the attacker sits in the middle.", 4], ["Mandatory Access Control", "Access control that requires the system itself to manage access controls in accordance with the organization’s security policies.", "A defense contractor's system assigns sensitivity labels and clearances, and it refuses access that violates policy even if the file's creator wants to share it. The system, not the owner, enforces access.", 3], ["Mantrap", "An entrance to a building or an area that requires people to pass through two doors with only one door opened at a time.", "A data center installs a small vestibule at its entrance. A visitor must enter the first door, have it close, and be verified before the second door opens, preventing tailgating.", 3], ["Message Digest", "A digital signature that uniquely identifies data and has the property such that changing a single bit in the data will cause a completely different message digest to be generated. National Institute of Standards and Technology Interagency or Internal Report 8011 Volume 3", "A software vendor publishes a digest for its installer. If one bit of the downloaded file changes, the computed digest will be entirely different, alerting the user to tampering or corruption.", 5], ["Microsegmentation", "Part of a zero-trust strategy that breaks local area networks into very small, highly localized zones using firewalls or similar technologies. At the limit, this places a firewall at every connection point.", "Instead of one large internal network, a company puts each server group in its own zone with firewall rules. If malware infects one zone, it can't easily spread to the others.", 4], ["Multi-Factor Authentication", "Using two or more distinct instances of the three factors of authentication (something you know, something you have, something you are) for identity verification.", "A user enters a password and then approves a prompt on an enrolled phone. Knowledge plus possession means a stolen password alone won't let an attacker in.", 1], ["National Institute of Standards and Technology", "The National Institute of Standards and Technology is part of the United States Department of Commerce and addresses the measurement infrastructure within science and technology efforts within the United States federal government. National Institute of Standards and Technology sets standards in a number of areas, including information security within the Computer Security Resource Center of the Computer Security Divisions.", "A federal contractor follows security guidance published by National Institute of Standards and Technology. Many of the definitions in this glossary cite National Institute of Standards and Technology special publications as their source.", 1], ["Non-repudiation", "The inability to deny taking an action such as creating information, approving information and sending or receiving a message.", "A manager approves a large purchase using a digitally signed approval. Later, the manager cannot credibly claim they never approved it because the system bound the approval to them.", 1], ["Object", "Passive information system-related entity (for example, devices, files, records, tables, processes, programs, domains) containing or receiving information. Access to an object (by a subject) implies access to the information it contains. See subject. Source: National Institute of Standards and Technology Special Publication 800-53 Revision 4", "A payroll file sits on a server. A user opening it is the subject; the file is the object being accessed. Access controls decide which subjects may reach which objects.", 3], ["Operating System", "The software “master control application” that runs the computer. It is the first program loaded when the computer is turned on, and its main component, the kernel, resides in memory at all times. The operating system sets the standards for all application programs (such as the Web server) that run in the computer. The applications communicate with the operating system for most user interface and file management operations. National Institute of Standards and Technology Special Publication 800-44 Version 2", "When a laptop starts, the operating system loads first and then lets applications like a browser run. Because everything depends on it, keeping the operating system patched is critical to security.", 5], ["Oversized Packet Attack", "Purposely sending a network packet that is larger than expected or larger than can be handled by the receiving system, causing the receiving system to fail unexpectedly.", "An attacker sends an enormous packet to an outdated server. The server can't process it and crashes, interrupting service.", 4], ["Packet", "Representation of data at Layer 3 of the Open Systems Interconnection model.", "A router reads the destination address in each packet to decide where to send it next. Packets are the Layer 3 units that cross networks.", 4], ["Patch", "A software component that, when installed, directly modifies files or device settings related to a different software component without changing the version number or release details for the related software component. Source: International Organization of Standards/International Electro-technical Commission 19770-2", "A vendor releases a small update that fixes a security flaw in a program. After installation, the program's version number is unchanged, but the vulnerability is closed.", 5], ["Patch Management", "The systematic notification, identification, deployment, installation and verification of operating system and application software code revisions. These revisions are known as patches, hotfixes, and service packs. Source: Committee on National Security Systems Instruction 4009", "Each month, an information technology team learns of new updates, tests them, deploys them to servers and laptops, and verifies they installed. Doing this systematically closes known weaknesses before attackers use them.", 5], ["Payload", "The primary action of a malicious code attack.", "A worm spreads through a network by exploiting a flaw; once on a machine, it encrypts the files. The file-encrypting action is the payload, while the spreading and exploiting are the delivery.", 4], ["Payment Card Industry Data Security Standard", "An information security standard administered by the Payment Card Industry Security Standards Council that applies to merchants and service providers who process credit or debit card transactions.", "A cafe chain takes card payments in stores and online. To protect cardholder data, it must meet Payment Card Industry Data Security Standard requirements, or risk fines and losing the ability to process cards.", 1], ["Personally Identifiable Information", "The National Institute of Standards and Technology, in its Special Publication 800-122 defines personally identifiable information as “any information about an individual maintained by an agency, including (1) any information that can be used to distinguish or trace an individual’s identity, such as name, Social Security number, date and place of birth, mother’s maiden name, or biometric records; and (2) any other information that is linked or linkable to an individual, such as medical, educational, financial and employment information.”", "A school stores students' names alongside their grades and addresses. Because the information is linked to identifiable people, it's personally identifiable information and must be protected from unauthorized disclosure.", 1], ["Physical Controls", "Controls implemented through a tangible mechanism. Examples include walls, fences, guards, locks, and so on. In modern organizations, many physical control systems are linked to technical/logical systems, such as badge readers connected to door locks. Also known as Physical Access Controls.", "A server room has a steel door, a guard desk, and a badge reader. The door and guard are physical controls, and the reader connects the physical barrier to a technical system that records entries.", 3], ["Plaintext", "A message or data in its natural format and in readable form; extremely vulnerable from a confidentiality perspective.", "A password sent over an unencrypted connection travels as plaintext. Anyone who intercepts it can read it immediately, which is why sensitive data is encrypted into ciphertext.", 5], ["Platform as a Service", "The web-authoring or application development middleware environment that allows applications to be built in the cloud before they’re deployed as Software as a Service assets.", "A development team writes and tests an application using a provider's environment without managing servers or operating systems. They deploy the finished app to users, while the provider maintains the platform.", 4], ["Privacy", "The right of an individual to control the distribution of information about themselves.", "A customer gave a company their email only for order updates. When the company sells it to marketers without permission, privacy is violated even if the database was never hacked.", 1], ["Private Cloud", "A cloud computing platform that is implemented within the corporate firewall, under the control of the information technology department. A private cloud is designed to offer the same features and benefits of cloud systems but removes a number of objections to the cloud computing model, including control over enterprise and customer data, worries about security, and issues connected to regulatory compliance.", "A bank runs cloud services in its own data centers, accessible only to its employees. It gets cloud flexibility while keeping full control over customer data and regulatory compliance.", 4], ["Principle of Least Privilege", "The principle that users and programs should have only the minimum privileges necessary to complete their tasks. National Institute of Standards and Technology Special Publication 800-179", "An intern who needs to view sales reports gets read-only access to that folder, and a backup program gets rights only to the files it copies. Limiting access limits the damage if an account is compromised.", 3], ["Privileged Account", "An information system account with approved authorizations of a privileged user. National Institute of Standards and Technology Special Publication 800-53 Revision 4", "A system administrator has an account that can change configurations and create users. Because compromise would give attackers broad control, such accounts are used only for administration and closely monitored.", 3], ["Probability", "The chances, or likelihood, that a given threat is capable of exploiting a given vulnerability or a set of vulnerabilities. Source: National Institute of Standards and Technology Special Publication 800-30 Revision 1", "A risk analyst estimates there is a one-in-ten chance per year that a known flaw will be exploited. That chance is the probability used when ranking the risk.", 1], ["Protected Health Information", "Information regarding health status, the provision of healthcare or payment for healthcare as defined in Health Insurance Portability and Accountability Act.", "A clinic's billing system stores patient diagnoses and insurance payments. Because the data concerns health status and payment for care, it is protected health information and must be protected under health privacy rules.", 1], ["Protocols", "A set of rules (formats and procedures) to implement and control some type of association (that is, communication) between systems. National Institute of Standards and Technology Special Publication 800-82 Revision 2", "Two computers can only exchange email because both follow the same rules for message format and handshake. Those agreed rules are the protocol; Simple Mail Transport Protocol, File Transfer Protocol, and Domain Name Service are examples.", 4], ["Public Cloud", "The cloud infrastructure is provisioned for open use by the general public. It may be owned, managed, and operated by a business, academic, or government organization, or some combination of them. It exists on the premises of the cloud provider. National Institute of Standards and Technology Special Publication 800-145", "A small shop signs up for a provider's email and storage service that thousands of other organizations also use. The provider owns the infrastructure, and the shop shares it with the public.", 4], ["Qualitative Risk Analysis", "A method for risk analysis that is based on the assignment of a descriptor such as low, medium or high. Source: National Institute of Standards and Technology Interagency or Internal Report 8286", "A small company lacks reliable loss data, so its team rates each risk as low, medium, or high on a heat map. Because it uses descriptors instead of dollar figures, this is qualitative analysis.", 1], ["Quantitative Risk Analysis", "A method for risk analysis where numerical values are assigned to both impact and likelihood based on statistical probabilities and monetarized valuation of loss or gain. Source: National Institute of Standards and Technology Interagency or Internal Report 8286", "A bank estimates that a particular fraud type has a 5% yearly chance and a $2 million loss, giving an expected loss it can compare with the cost of controls. Numbers and money make it quantitative.", 1], ["Ransomware", "A type of malicious software that locks the computer screen or files, thus preventing or limiting a user from accessing their system and data until money is paid.", "On Monday morning, employees find all shared files locked and a message demanding payment. Offline backups let the company restore without paying, which is why isolated backups matter against ransomware.", 4], ["Records", "The recordings (automated and/or manual) of evidence of activities performed or results achieved (for example, forms, reports, test results), which serve as a basis for verifying that the organization and the information system are performing as intended. Also used to refer to units of related data fields (that is, groups of data fields that can be accessed by a program and that contain the complete set of information on particular items). National Institute of Standards and Technology Special Publication 800-53 Revision 4", "An auditor asks for proof that access reviews were done. The signed review forms and system reports are records, giving evidence that controls actually operated.", 5], ["Records Retention", "A practice based on the records life cycle, according to which records are retained as long as necessary, and then are destroyed after the appropriate time interval has elapsed.", "A company's policy keeps invoices for seven years and then securely destroys them. Keeping them longer adds breach exposure, and destroying them sooner could violate legal requirements.", 5], ["Remanence", "Residual information remaining on storage media after clearing. National Institute of Standards and Technology Special Publication 800-88 Revision 1", "A company deletes files from retired drives and sells them. A buyer later recovers fragments because the data remained on the media, which is why disposal needs proper sanitization such as degaussing or destruction.", 5], ["Request for Change", "The first stage of change management, wherein a change in procedure or product is sought by a stakeholder.", "An administrator wants to alter a firewall rule. Before touching production, they submit an request for change so the change can be reviewed, approved, and recorded.", 5], ["Risk", "A measure of the extent to which an entity is threatened by a potential circumstance or event.", "A company stores sensitive data on a server with a known flaw. The possibility that a threat exploits that flaw and causes harm is the risk, determined by how likely it is and how damaging it would be.", 1], ["Risk Acceptance", "Determining that the potential benefits of a business function outweigh the possible risk impact/likelihood and performing that business function with no other action.", "A firm finds that a control costing $50,000 a year would prevent an expected loss of $10,000. Management formally accepts the risk and continues without further action.", 1], ["Risk Assessment", "The process of identifying and analyzing risks to organizational operations (including mission, functions, image, or reputation), organizational assets, individuals and other organizations. The analysis performed as part of risk management which incorporates threat and vulnerability analyses and considers mitigations provided by security controls planned or in place.", "Before launching a new app, a team lists its assets, threats, and vulnerabilities, accounts for controls already in place, and rates the remaining risks. That structured analysis is a risk assessment.", 1], ["Risk Avoidance", "Determining that the impact and/or likelihood of a specific risk is too great to be offset by the potential benefits and not performing a certain business function because of that determination.", "A company concludes that storing customers' full card numbers is too risky for the profit it brings, so it stops storing them entirely. By not performing the activity, it avoids the risk.", 1], ["Risk Management", "The process of identifying, evaluating and controlling threats, including all the phases of risk context (or frame), risk assessment, risk treatment and risk monitoring.", "An organization frames its risk context, assesses risks each year, chooses treatments, and reviews quarterly whether those choices still work. That ongoing cycle is risk management.", 1], ["Risk Management Framework", "A structured approach used to oversee and manage risk for an enterprise. Source: Committee on National Security Systems Instruction 4009", "A federal agency adopts a documented ste
