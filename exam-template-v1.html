<title>ISC2 Certified in Cybersecurity Practice Quizzes</title>
<style>
:root{box-sizing:border-box;--bg:#f7f8fa;--fg:#14202b;--mut:#5b6b7a;--card:#fff;--line:#d5dce3;--acc:#0b5c8a;--ok:#1b7f4b;--bad:#b3261e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--fg:#e8eef3;--mut:#9aaab8;--card:#18212a;--line:#2b3846;--acc:#6bb8e8;--ok:#5fd08e;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#10161c;--fg:#e8eef3;--mut:#9aaab8;--card:#18212a;--line:#2b3846;--acc:#6bb8e8;--ok:#5fd08e;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2em 0}
p.s{color:var(--mut);margin:.2em 0 1em}
button{font:inherit;cursor:pointer}
.set{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;color:var(--fg)}
.set b{display:block;color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.q{font-size:1.1rem;margin:14px 0}
.o{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;color:var(--fg)}
.o.sel{border-color:var(--acc);border-width:2px}.o.ok{border-color:var(--ok);border-width:2px}.o.no{border-color:var(--bad);border-width:2px}
.ex{background:var(--card);border-left:4px solid var(--acc);padding:10px 12px;margin:12px 0;color:var(--fg)}
.nx{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:12px 20px;margin-top:8px}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.top button{background:none;border:0;color:var(--acc);padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:220px;cursor:pointer;margin:12px 0}.card h2{margin:.1em 0 .4em;font-size:1.3rem;color:var(--acc)}.card .lb{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-top:14px}.card p{margin:.2em 0}.hint{color:var(--mut);font-size:.9rem;margin-top:24px}.gs{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row .nx{margin-top:0}details.rd{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}details.rd summary{cursor:pointer}.rbar{height:8px;background:var(--line);border-radius:4px;margin:3px 0 10px}.rbar i{display:block;height:100%;background:var(--acc);border-radius:4px}.rn{font-size:.85rem;color:var(--mut)}.big{font-size:1.6rem;color:var(--acc);font-weight:bold}</style></head><body><main id="app"></main>
<script>
// [prompt, [options], correctIndex, explanation]
const MASTER=[["Counsel says controls must provide 'adequate security' for donor records. Which reading matches Office of Management and Budget Circular A-130?", ["Protection that matches what peer organizations deploy", "Protection equal to what auditors require at minimum", "Protection funded at a fixed share of the information technology budget", "Protection scaled to the risk and magnitude of potential harm"], 3, "Office of Management and Budget A-130 defines adequate security as protection commensurate with the risk and the magnitude of harm from loss, misuse, unauthorized access, or modification. That ties protection to actual risk rather than to peer practice, audit minimums, or a budget percentage, none of which measure the harm the controls are meant to prevent.", 1], ["Which item is an intangible asset?", ["A fleet of laptops", "A leased office floor", "A rack-mounted server", "A registered trademark"], 3, "Intangible assets have value but no physical form, and the glossary lists intellectual property as an example. A registered trademark fits. Laptops, a leased floor, and a rack-mounted server are physical (tangible) items.", 1], ["The owner calls a roadmap highly important to protect; security gauges harm from its disclosure; operations notes the business stalls without the system. Which labels match, in that order?", ["Criticality, classification, sensitivity", "Sensitivity, classification, criticality", "Sensitivity, criticality, classification", "Classification, sensitivity, criticality"], 1, "Sensitivity is the importance the owner assigns to information for the purpose of protection, classification identifies the harm if it is divulged to unauthorized parties, and criticality measures how much the mission depends on the system. Matching them in that order follows each definition; the other orders swap those meanings.", 1], ["Classification of a document is primarily driven by concern for which objective?", ["Confidentiality", "Availability", "Non-repudiation", "Integrity"], 0, "Classification is based on the harm that would result if information were disclosed, so it focuses first and foremost on confidentiality. Integrity and availability concern accuracy and access, and non-repudiation concerns denial, none of which drive classification labels.", 1], ["A vendor secures customer data against hackers, then sells it to marketers against customers' wishes. What is most directly violated?", ["Privacy", "Availability", "Integrity", "Confidentiality"], 0, "Privacy is an individual's right to control how information about them is distributed. The vendor protected the data from outsiders (confidentiality held) but ignored the customers' wishes about distribution. Integrity and availability are unaffected.", 1], ["A rootkit alters an operating system so security tools report false results. Which property is lost?", ["System integrity", "Confidentiality", "Data integrity", "Availability"], 0, "System integrity means a system performs its intended function unimpaired, free from unauthorized manipulation. A rootkit that alters the operating system and falsifies tool output damages the system itself. Data integrity concerns the data's accuracy, which is a different focus.", 1], ["An attacker changes a transfer amount while a payment message crosses the network. Which property is violated?", ["System integrity", "Non-repudiation", "Authentication", "Data integrity"], 3, "Data integrity covers data in storage, processing, and transit; an attacker changing a transfer amount alters data in transit. System integrity concerns the system's behavior, non-repudiation concerns denial of actions, and authentication concerns identity.", 1], ["Ransomware locks files, but nothing is copied or altered. Which objective is most directly affected?", ["Availability", "Privacy", "Integrity", "Confidentiality"], 0, "Ransomware blocks authorized users from reaching their own data, which is an availability failure. Nothing was disclosed (confidentiality) or altered (integrity), so those aren't the primary objectives hit, and privacy concerns control of personal data.", 1], ["A user claims they never sent a message that arrived from their authenticated account. Which control best prevents this denial?", ["A checksum", "A digital signature", "Symmetric encryption", "A message digest"], 1, "A digital signature ties a message to its signer, giving origin authentication, integrity, and non-repudiation, so the sender can't credibly deny sending it. A checksum or digest only detects change, and symmetric encryption doesn't identify a unique sender.", 1], ["Which set of services does a properly implemented digital signature provide?", ["Origin authentication, integrity, and non-repudiation", "Authentication, authorization, and accounting", "Confidentiality, integrity, and availability", "Origin authentication, confidentiality, and privacy"], 0, "The glossary defines digital signature services as origin authentication, data integrity, and signer non-repudiation. Confidentiality and availability aren't provided by signatures, and authentication, authorization, and accounting describe access control, not signatures.", 1], ["When one bit of a file changes, how does its message digest change?", ["It stays the same", "It shifts by one position", "It becomes completely different", "It changes in the last block only"], 2, "A message digest has the property that changing a single bit produces a completely different digest. That avalanche behavior makes tampering easy to detect, so a similar digest, an unchanged one, or a change in only the last block would defeat its purpose.", 1], ["A job compares a stored value with a recomputed one to catch accidental corruption in transferred files. Which term fits best?", ["Checksum", "Digital signature", "Token", "Public key"], 0, "A checksum is a value computed from data and compared later to detect errors, such as accidental corruption. A digital signature authenticates a signer, a token authenticates a user, and a public key is part of asymmetric encryption.", 1], ["A researcher studies an algorithm and finds a flaw in how a library implements it. Which role is this?", ["Cryptographer", "Threat actor", "Security auditor", "Cryptanalyst"], 3, "A cryptanalyst studies techniques to defeat cryptography, including finding flaws in how an algorithm is implemented. A cryptographer designs cryptographic methods, an auditor reviews controls, and a threat actor attacks systems.", 1], ["Which sequence correctly names the data forms and operations in encrypting and recovering a message?", ["Ciphertext, decryption, plaintext, encryption", "Plaintext, decryption, ciphertext, encryption", "Ciphertext, encryption, plaintext, decryption", "Plaintext, encryption, ciphertext, decryption"], 3, "Plaintext is readable data, encryption converts it to ciphertext, and decryption converts ciphertext back to plaintext. The other sequences reverse the forms or the operations.", 1], ["A decrypting party uses the same key that encrypted the message. Which type of encryption is in use?", ["Symmetric", "Hash-based", "Asymmetric", "Signature-based"], 0, "Using the same key to encrypt and decrypt is symmetric encryption. Asymmetric encryption uses different keys, and hashing and signatures are not symmetric encryption.", 1], ["Auditors say an encryption deployment is weak despite a strong cipher because key handling is sloppy. Which glossary concept covers algorithms, hardware, software, and procedures together?", ["Cryptography", "Encryption system", "Cipher suite", "Message digest"], 1, "An encryption system is the total set of algorithms, processes, hardware, software, and procedures providing encryption and decryption. A strong cipher alone isn't enough if key handling is poor. Cryptography is the broader field, and a message digest is a hash.", 1], ["An unpatched flaw exists, an attacker runs a script against it, and customer data is lost. Which mapping is correct?", ["Flaw: vulnerability; script: threat actor; data loss: impact", "Flaw: vulnerability; script: exploit; data loss: impact", "Flaw: exploit; script: vulnerability; data loss: threat", "Flaw: threat; script: payload; data loss: likelihood"], 1, "The unpatched flaw is the vulnerability, the script that abuses it is the exploit (a particular attack), and the loss of data is the impact (harm). The other mappings mislabel the script as a threat actor or payload, or call the flaw a threat or exploit.", 1], ["Which term denotes the magnitude of harm if a threat exercises a vulnerability?", ["Criticality", "Likelihood", "Impact", "Probability"], 2, "Impact is the magnitude of harm caused when a threat exercises a vulnerability. Likelihood and probability concern chance, and criticality measures mission dependence on an asset.", 1], ["A workshop assigns a weighted, subjective factor to the chance that a threat exploits a vulnerability. Which term fits best?", ["Likelihood of occurrence", "Impact", "Criticality", "Sensitivity"], 0, "Likelihood of occurrence is a weighted factor based on a subjective analysis of the probability that a threat exploits a vulnerability. Impact is harm, criticality is mission dependence, and sensitivity is the owner's protection need.", 1], ["Which is NOT a synonym for risk tolerance?", ["Risk appetite", "Acceptable risk", "Risk transference", "Risk threshold"], 2, "Risk appetite, risk threshold, and acceptable risk are used synonymously with risk tolerance. Risk transference is paying a third party to take on financial impact, a different treatment.", 1], ["Which statement best separates risk acceptance from risk tolerance?", ["Tolerance is the level of risk willing to be assumed; acceptance is proceeding with no other action", "Acceptance is the level of risk willing to be assumed; tolerance is proceeding with no other action", "Tolerance is paying a third party; acceptance is a control", "They are synonyms in the glossary"], 0, "Tolerance is a level of risk an entity is willing to assume. Acceptance is a decision to proceed with no other action because benefits outweigh the risk. They aren't synonyms, and swapping them or calling acceptance a control is wrong.", 1], ["After buying cyber insurance, the chief executive officer says the company no longer has to manage that risk. What is the best correction?", ["Transference removes the underlying vulnerability for good", "Transference shifts financial impact but not the duty to manage risk", "Insurance counts as mitigation of the exposure", "Insurance is a form of risk avoidance by contract"], 1, "Risk transference pays an external party to accept the financial impact; it doesn't remove the vulnerability or the need to manage the underlying risk, and it isn't mitigation or avoidance. The chief executive officer's claim confuses financial relief with elimination of risk.", 1], ["A team assigns monetary values and statistical probabilities to risks. Which method is this?", ["Qualitative risk analysis", "Quantitative risk analysis", "Risk avoidance", "Risk transference"], 1, "Assigning monetary values and statistical probabilities is quantitative risk analysis. Qualitative analysis uses descriptors like low, medium, and high, and avoidance and transference are responses to risk, not methods of analysis.", 1], ["A structured approach for overseeing and managing risk across an enterprise is called a:", ["Risk assessment", "Risk register", "Risk treatment", "Risk management framework"], 3, "A risk management framework is a structured approach for overseeing and managing risk across an enterprise. Assessment, treatment, and a register are parts of the risk process, not the overall framework.", 1], ["Which statement best contrasts governance with security governance?", ["Governance covers only the technology choices an organization makes", "Security governance applies only to the security operations center and information technology staff", "Security governance is the policies, roles, and processes used for security decisions", "Security governance covers every management decision in the organization"], 2, "Governance is how an organization is managed, including how decisions are made. Security governance is the policies, roles, and processes used for security decisions. It isn't limited to technology, isn't limited to the security operations center, and doesn't cover every management decision.", 1], ["A catalog prescribes management, operational, and technical safeguards for a system. Which glossary term describes this collection?", ["Baseline", "Risk treatment", "Security policy", "Security controls"], 3, "Security controls are the management, operational, and technical safeguards prescribed for an information system to protect confidentiality, integrity, and availability. A baseline is a minimum configuration, and treatment is a decision about risk.", 1], ["Which control type best describes an access-granting policy requiring manager approval that the identity system enforces?", ["Detective only", "Physical, enforced with technical controls", "Technical only", "Administrative, enforced with technical controls"], 3, "An access-granting policy is an administrative control, and the identity system that enforces it is a technical mechanism, which the glossary notes is common. It isn't purely technical or physical, and it isn't detective.", 1], ["Which is a synonym for defense in depth?", ["Segregation of duties", "Least privilege", "Microsegmentation", "Layered defense"], 3, "Layered defense is the same concept as defense in depth: multiple controls arranged in series to protect an asset. Segregation of duties, least privilege, and microsegmentation are separate principles.", 1], ["A nightly backup program has domain admin rights but only reads one share. Which principle does this violate?", ["Non-repudiation", "Least privilege", "Defense in depth", "Segregation of duties"], 1, "A program should have only the minimum privileges it needs. Domain admin rights for a job that reads one share violate least privilege, which applies to programs as well as users.", 1], ["No single person can create, approve, and pay an invoice. Which statement describes the benefit?", ["It forces collusion, reducing insider threat", "It adds redundant technical controls at each step", "It proves which person approved each step", "It limits how much data each person can see"], 0, "Segregation of duties ensures no single person can complete a process, forcing collusion and thereby reducing insider threat. It doesn't add technical redundancy, prove approvals, or limit data access.", 1], ["An account has approved authorizations beyond ordinary users. Which glossary term names it?", ["Token", "Object", "Privileged account", "Service account"], 2, "A privileged account has approved authorizations beyond those of ordinary users. A token is an authenticator, an object is a resource, and 'service account' isn't the glossary term for elevated authorization.", 1], ["A trusted employee with legitimate access copies files before resigning. Which term fits best?", ["Threat actor only", "Zero day", "Insider threat", "Bot"], 2, "An insider threat is an entity with authorized access that could harm an information system, and copying files before resigning fits. A threat actor attacks, a zero day is an unknown flaw, and a bot is remotely controlled malware.", 1], ["A gang sends phishing emails carrying malware. Which pairing is correct?", ["Gang: threat; email: vulnerability", "Gang: exploit; email: payload", "Gang: threat actor; email: threat vector", "Gang: threat vector; email: threat actor"], 2, "The gang is the threat actor, the group attempting to exploit vulnerabilities, and the email is the threat vector, the means used. The other pairings mislabel actors as vectors, exploits, or threats.", 1], ["Which is a low-tech example of social engineering?", ["Flooding a server with requests", "Following an employee through a secured door", "Splitting packets to avoid reassembly", "Altering a packet's source address"], 1, "The glossary notes that simply following someone into a secure building is a low-tech social engineering method. Flooding, packet splitting, and forging addresses are technical attacks.", 1], ["A hurricane is forecast near a data center. Under the glossary definition of threat, what is true?", ["It is a vulnerability of the facility's coastal location", "It is an exploit of the site's physical weak points", "It is not a threat, since no attacker is involved here", "It is a threat, because the event could harm operations"], 3, "A threat is any circumstance or event with the potential to harm operations or assets, so a hurricane counts even without an attacker. A vulnerability is a weakness, and an exploit is an attack on a vulnerability.", 1], ["A defaced web page, a packet flood, and a failed login occur in one week. Which statement is correct?", ["All are events; the first two are adverse; incident status depends on confidentiality, integrity, and availability", "All three are incidents, since each occurred in the same week", "Only the failed login is an event; the other two are incidents", "All three are breaches, since each touched a production system"], 0, "All three are events; the defacement and flood are adverse events with negative consequences, and a failed login may be routine. Whether any is a incident depends on whether it jeopardizes confidentiality, integrity, or availability. They aren't all incidents or breaches by definition.", 2], ["A nurse opens a celebrity's chart out of curiosity. Which statement is correct under the National Institute of Standards and Technology breach definition?", ["It is only a baseline violation of the access policy", "It is a zero-day exposure of the records system", "It is not a breach since the nurse holds valid access", "It can be a breach: an authorized user accessed personally identifiable information for an unauthorized purpose"], 3, "A breach includes an authorized user accessing personally identifiable information for other than an authorized purpose. Authorization to use the system doesn't excuse curiosity access. It isn't just a baseline violation or a zero day.", 2], ["Malware runs on a server holding no personally identifiable information, and no personally identifiable information was accessed. Which statement is most accurate?", ["A incident occurred; a breach is not established", "A breach occurred; no incident is established", "Both occurred because malware executed on a server", "Neither occurred because no personally identifiable information was accessed"], 0, "A incident jeopardizes confidentiality, integrity, or availability, and malware on a server can do that. A breach, per the National Institute of Standards and Technology definition used, involves personally identifiable information access, which didn't occur. So it's a incident without an established breach.", 2], ["Which best defines incident response?", ["Detecting and analyzing incidents to limit their effect", "Sustaining business processes during disruption", "Restoring information technology services after a disaster", "Ranking recovery priorities"], 0, "Incident response is the process of detecting and analyzing incidents to limit their effect. Sustaining processes is business continuity, restoring information technology is disaster recovery, and ranking priorities is the business impact analysis.", 2], ["Which mapping of documents to purposes is correct?", ["Incident response plan: sustain processes; business continuity plan: restore information technology; disaster recovery plan: cyberattack handling", "Incident response plan: restore information technology; business continuity plan: cyberattack handling; disaster recovery plan: sustain processes", "Incident response plan: rank priorities; business continuity plan: restore information technology; disaster recovery plan: sustain processes", "Incident response plan: cyberattack handling; business continuity plan: sustain mission processes; disaster recovery plan: restore information technology"], 3, "Incident response plan covers cyberattack handling, business continuity plan sustains mission processes, and disaster recovery plan restores information technology and communications. The other mappings swap those scopes.", 2], ["Which statement correctly relates business continuity and business continuity plan?", ["Business continuity covers only information technology systems; the business continuity plan covers business units", "Business continuity is the written document; the business continuity plan is the set of tools", "Business continuity is the actions and tools; the business continuity plan documents the instructions", "Business continuity is the recovery step; the business continuity plan is the planning step"], 2, "Business continuity is the actions, processes, and tools that keep critical operations going; the business continuity plan is the documentation of predetermined instructions. They aren't the same, and business continuity isn't limited to information technology.", 2], ["A team maps functions, requirements, and interdependencies to rank which systems return first. Which output is this?", ["Incident response plan", "Business impact analysis", "Disaster recovery plan", "Risk assessment"], 1, "A business impact analysis examines requirements, functions, and interdependencies to characterize contingency priorities. A incident response plan and disaster recovery plan are plans, and a risk assessment analyzes risks rather than recovery order.", 2], ["Which condition does the glossary define as a disaster?", ["A critical function cannot be performed acceptably within a set period", "Any alert from a security monitoring platform", "Any power fluctuation at a company facility", "Any server crash that interrupts a user's session"], 0, "The glossary defines a disaster as a situation where critical business functions can't be performed at a acceptable level within a predetermined period after a disruption. Alerts, power blips, or a single crash don't qualify.", 2], ["Ransomware encrypts file servers and offline backups are intact. Which sequence is best?", ["Restore from backup first, and then contain the spread of it", "Wait for business continuity to finish before starting any incident response", "Contain per incident response plan, restore under disaster recovery, and let business continuity sustain critical work", "Pay the demand first, and then contain the affected servers"], 2, "Contain the ransomware under the incident response plan so it doesn't spread, restore under disaster recovery, and use business continuity to keep critical work going. Restoring before containing risks reinfection, paying isn't a plan, and business continuity runs alongside response.", 2], ["A flood destroys the server room, and the business impact analysis shows billing must return first. Which document should reflect that order?", ["Disaster recovery plan", "Incident response plan", "Baseline", "Request for change"], 0, "The disaster recovery plan covers restoring information technology and communications after a disaster, and it should follow the business impact analysis's priority order. The incident response plan handles cyberattacks, a baseline is a configuration standard, and an request for change starts a change.", 2], ["Which statement best distinguishes a business impact analysis from a risk assessment?", ["Business impact analysis tests the backups; assessment drafts the incident plan", "Business impact analysis lists installed controls; assessment lists owned assets", "Business impact analysis identifies threat actors; assessment ranks recovery order", "Business impact analysis sets recovery priorities; assessment analyzes risks"], 3, "A business impact analysis characterizes contingency requirements and recovery priorities, while a risk assessment identifies and analyzes risks. The other statements assign tasks to the wrong activity.", 2], ["Forms, test results, and automated recordings serve as evidence that controls performed. Which term covers them?", ["Logs only", "Payloads", "Records", "Baselines"], 2, "Records are recordings of evidence of activities performed or results achieved, such as forms, reports, and test results. Logs are one kind, but 'logs only' is too narrow, and baselines and payloads are unrelated.", 2], ["Invoices are kept seven years then destroyed, yet retired drives still yield recoverable data. Which concept names the leftover problem?", ["Baseline drift", "Records retention", "Non-repudiation", "Remanence"], 3, "Remanence is residual information remaining on media after clearing. Retention policy governed when the invoices were destroyed, but the recoverable data on retired drives is remanence.", 2], ["Which result should degaussing achieve when performed properly?", ["Too little magnetic remanence to reconstruct data", "A new baseline for the storage device", "An encrypted copy of the original contents", "A checksum that proves the data was erased"], 0, "Degaussing, done properly, leaves insufficient magnetic remanence to reconstruct data. It doesn't create a baseline, an encrypted copy, or a checksum.", 2], ["A responder captures a compromised host's condition at 14:02 before containment. Which term describes that condition?", ["Event", "State", "Record", "Baseline"], 1, "State is the condition an entity is in at a point in time, such as a host captured at 14:02. An event is an occurrence, a record is evidence, and a baseline is a minimum configuration.", 2], ["Which pair is correct for log work after an alert?", ["Both describe retention of records over time", "Logging spots irregularities; an anomaly collects the records", "Both are baselines applied to log files", "Logging collects records; a log anomaly is an irregularity in them"], 3, "Logging collects and stores user activity records, and a log anomaly is an irregularity found when studying them. The other options reverse the roles or call them baselines.", 2], ["A centralized team monitors, detects, and analyzes events to resolve issues before business disruption. Which function is this?", ["Governance committee", "Change advisory board", "Records office", "Security operations center"], 3, "A security operations center is a centralized function that monitors, detects, and analyzes events to prevent and resolve issues. A governance committee, change board, and records office have different roles.", 2], ["An outsider repeatedly attempts unauthorized access to a file share. Which glossary term fits an event that is a incident where an intruder gains or attempts access?", ["Payload", "Intrusion", "Exploit", "Breach"], 1, "An intrusion is a security event or combination of events constituting a incident in which an intruder gains or attempts to gain unauthorized access. A breach concerns personally identifiable information, an exploit is a specific attack, and a payload is malicious code's action.", 2], ["Which examples are all adverse events?", ["A baseline, a rule, and a token issuance", "A user login, a file save, and a routine reboot", "A patch install, a backup job, and an audit", "A crash, a packet flood, and destructive malware execution"], 3, "Adverse events have negative consequences, such as crashes, packet floods, and destructive malware. Logins, saves, reboots, patches, and backups are routine events, and baselines, rules, and tokens aren't events.", 2], ["Which activity is an audit under the glossary?", ["Monitoring traffic that leaves the organization", "Deploying and verifying software code revisions", "Independent review of records and activities for control adequacy", "Collecting and storing records of user activity"], 2, "An audit is an independent review and examination of records and activities to assess control adequacy and compliance. Monitoring traffic, deploying revisions, and collecting activity records are other activities.", 2], ["After an attack, management wants only authorized and validated changes to affected systems. Which discipline does this?", ["Provisioning", "Patch management", "Configuration management", "Records retention"], 2, "Configuration management ensures only authorized and validated changes are made to a system. Patch management is one kind of change, provisioning handles accounts, and retention handles records.", 2], ["The first formal stage of change management, in which a stakeholder seeks a change, is the:", ["Request for change", "Change approval", "Verification", "Deployment"], 0, "The request for change is the first stage of change management, where a stakeholder seeks a change. Approval, deployment, and verification follow.", 2], ["Two systems failed: a brochure site and the order platform. Which measure should set the recovery order?", ["Likelihood", "Criticality", "Classification", "Remanence"], 1, "Criticality measures how much the mission depends on a system, so it should set recovery order. Classification concerns confidentiality, likelihood concerns chance, and remanence concerns residual data.", 2], ["An analyst must decide whether an unusual process is a incident. Which test applies?", ["Whether it actually or potentially jeopardizes confidentiality, integrity, and availability", "Whether it occurred outside normal business hours", "Whether it affected a production server", "Whether it produced an entry in a system log"], 0, "A incident is an event that actually or potentially jeopardizes confidentiality, integrity, or availability. Timing, system type, or whether it's logged doesn't define a incident.", 2], ["Which is the best example of business continuity rather than disaster recovery?", ["Engineers restore the failed network links", "Staff use paper forms at a secondary site during an information technology outage", "Technicians rebuild the failed servers from backup", "Admins replace the failed storage arrays"], 1, "Business continuity keeps operations going during disruption, such as using paper forms at a secondary site. Restoring links, rebuilding servers, and replacing storage are disaster recovery activities that restore information technology.", 2], ["Which statement about disaster recovery is correct?", ["Disaster recovery ranks recovery priorities among systems", "Disaster recovery restores information technology and communications during and after an outage", "Disaster recovery applies only to malicious cyberattacks", "Disaster recovery sustains every mission process regardless of information technology"], 1, "Disaster recovery restores information technology and communications services during and after an outage. Ranking priorities is the business impact analysis, sustaining all mission processes is business continuity, and disaster recovery isn't limited to cyberattacks.", 2], ["A user proves identity but is denied the payroll share because their role lacks permission. Which statement is correct?", ["Authorization succeeded; authentication failed", "Both succeeded; the share is offline", "Authentication succeeded; authorization was not granted", "Both failed"], 2, "Authentication verified the user, but authorization, the permission to access the resource, wasn't granted because the role lacks it. Both are separate steps, so the other combinations don't fit.", 3], ["A gateway must confirm that a message truly came from the claimed station rather than a forger. Which concept covers this?", ["Authorization", "Non-repudiation", "Encapsulation", "Authentication"], 3, "Authentication verifies the validity of a transmission or originator, which includes confirming a message came from the claimed station. Authorization grants permissions, and non-repudiation and encapsulation are different concepts.", 3], ["One login uses a password plus a hardware token; another uses only a long passphrase. Which pairing is correct?", ["Single-factor; single-factor", "Multi-factor; multi-factor", "Multi-factor; single-factor", "Single-factor; multi-factor"], 2, "A password plus a hardware token combines two distinct factor types, knowledge and possession, so it's multi-factor. A passphrase alone is a single factor no matter how long it is.", 3], ["A key fob the user carries and an iris scan are both used for login. Which pairing is correct?", ["Fob: token; iris: biometric", "Fob: token; iris: token", "Fob: biometric; iris: token", "Fob: biometric; iris: biometric"], 0, "A token is a physical object the user possesses and controls, and an iris scan is a biometric. The other pairings mislabel one or both.", 3], ["A system validates identity by personal identification number, card, or biometric, then assigns privileges by role across workstations and databases. Which term fits?", ["Discretionary access control", "Mandatory access control", "Physical access control system", "Logical access control system"], 3, "A logical access control system validates identity by personal identification number, card, or biometric and assigns privileges by role to computer resources. Discretionary access control and mandatory access control are access models, and a physical system controls doors rather than workstations and databases.", 3], ["An owner shares a folder and lets a delegate decide who else may access it. Which model is this?", ["Discretionary access control", "Mandatory access control", "Rule-based access control", "Role-based access control"], 0, "Discretionary access control leaves access decisions to the owner or someone authorized by the owner, such as a delegate. Mandatory access control is system-enforced, role-based access control is role-based, and rule-based control applies preset rules.", 3], ["A compliance regime requires that the system enforce labels so owners cannot override access. Which model fits?", ["Mandatory access control", "Rule-based access control", "Discretionary access control", "Role-based access control"], 0, "Mandatory access control has the system manage access according to organizational policy, so owners can't override it. Discretionary access control and role-based control allow owner or role-based decisions, and rule-based control isn't label-driven.", 3], ["Staff change departments and administrators update group membership rather than individual permissions. Which model is this?", ["Discretionary access control", "Mandatory access control", "Rule-based access control", "Role-based access control"], 3, "Role-based access control assigns permissions to roles, so changing group membership changes a person's access. Discretionary access control depends on owner choice, mandatory access control on system labels, and rule-based on preset rules.", 3], ["A policy instruction compares a validated identity against an access control list to allow or deny access. Which glossary term names it?", ["State", "Baseline", "Rule", "Token"], 2, "A rule is an instruction that allows or denies access by comparing a validated identity to an access control list. State, baseline, and token are different terms.", 3], ["A process opens a file; later an administrator terminates that process. Which labeling is correct?", ["Always an object", "Opening: subject; being terminated: object", "Opening: object; being terminated: subject", "Always a subject"], 1, "A subject is an entity causing information to flow or changing system state, while an object is a passive entity containing or receiving information. A process can be a subject when acting and an object when acted upon, so it isn't always one or the other.", 3], ["A sysadmin keeps elevated rights after moving to a role that does not need them. Which pair of ideas applies?", ["Data loss prevention and egress monitoring", "Token and baseline management", "Privileged account and least privilege", "Records retention and remanence"], 2, "The elevated rights are a privileged account, and keeping them after a role change violates least privilege. Data loss prevention, tokens, records retention, and remanence aren't relevant to excess access.", 3], ["Human resources approves a hire, information technology creates accounts, roles change, accounts are disabled at exit. Which process covers this lifecycle?", ["Configuration management", "User provisioning", "Egress monitoring", "Patch management"], 1, "User provisioning is creating, maintaining, and deactivating user identities, which matches the lifecycle described. Configuration, patch, and egress management address other areas.", 3], ["One employee can request, approve, and pay vendor invoices. Which principle is missing?", ["Defense in depth", "Accountability", "Least privilege", "Segregation of duties"], 3, "Segregation of duties ensures no single person can complete a process. One person handling request, approval, and payment defeats it. Least privilege, defense in depth, and accountability are different principles.", 3], ["A data center door allows only one door open at a time; the lobby has a rotating barrier admitting one person. Which pairing is right?", ["Data center: mantrap; lobby: turnstile", "Both turnstiles", "Data center: turnstile; lobby: mantrap", "Both mantraps"], 0, "A mantrap uses two doors with only one open at a time, and a turnstile is a one-way rotating barrier admitting one person at a time. The other pairings swap or duplicate them.", 3], ["A designer adds lighting and clear sightlines to reduce crime. Which approach is this?", ["Defense in depth for physical sites", "Microsegmentation of building networks", "Segregation of duties among guards", "Crime Prevention through Environmental Design"], 3, "Crime Prevention through Environmental Design is an architectural approach using passive design features such as lighting and sight lines to reduce criminal opportunity. Defense in depth, microsegmentation, and segregation of duties don't concern physical design.", 3], ["A badge reader is wired to a lock and logs entries to a server. How is it best described?", ["Governance control set by the board", "Physical control linked to technical systems", "Administrative control enforced by policy only", "Baseline control for hardware settings"], 1, "A badge reader tied to a lock and a server is a physical control linked to technical systems, matching the glossary's example. It isn't governance, an administrative policy alone, or a baseline.", 3], ["A policy states two staff must jointly perform a sensitive operation. Which control type is primary?", ["Detective hardware", "Technical", "Physical", "Administrative"], 3, "A policy requiring two staff for a sensitive operation is implemented through policy and procedure, so it's administrative. It isn't technical, physical, or detective hardware.", 3], ["A transaction log ties each approval to a verified user so it cannot be disowned. Which concept is this?", ["Authorization", "Non-repudiation", "Privacy", "Availability"], 1, "Non-repudiation means an actor cannot credibly deny an action such as approving information. A log that ties each approval to a verified user supports that. Authorization grants permissions, privacy concerns control of personal data, and availability concerns access.", 3], ["A design assumes no network location is trusted and verifies at the most granular asset. Which model is this?", ["Discretionary access", "Perimeter trust", "Zero trust", "Defense in depth"], 2, "Zero trust removes the belief that any part of the network is trusted and manages security at the most granular asset. Perimeter trust assumes the inside is safe, discretionary access is an owner-driven model, and defense in depth is layering rather than removing trust.", 3], ["Local area network segments are broken into very small zones with firewalls at nearly every connection. Which technique is this?", ["Virtual local area network", "Virtual private network", "Broadcast domain", "Microsegmentation"], 3, "Microsegmentation breaks local area networks into very small, localized zones using firewalls, at the limit a firewall at every connection point. A virtual local area network is a coarser logical grouping, a virtual private network is a tunnel, and a broadcast domain is the scope of broadcast traffic.", 3], ["Which statement is most accurate about a highly classified file?", ["Protection should be technical controls only", "Protection should depend on the file's storage size", "Availability should be open to all staff members", "Protection should reflect harm from unauthorized disclosure"], 3, "Classification reflects the harm to the organization if the information is divulged, so protection should match that harm. It isn't purely technical, doesn't depend on file size, and highly classified material shouldn't be open to all staff.", 3], ["Information that can distinguish or trace an individual, plus linked medical, educational, financial, and employment data, is:", ["Personally identifiable information", "Protected health information", "Classified information", "Payment Card Industry data"], 0, "Personally identifiable information is any information that can distinguish or trace an individual's identity, plus linked medical, educational, financial, and employment information. Protected health information is health-specific, classified information is government-marked, and Payment Card Industry data concerns cards.", 3], ["A clinic's records of health status and payment for healthcare are covered by Health Insurance Portability and Accountability Act. Which term is this?", ["Protected health information", "Payment Card Industry data", "Sensitive security parameters", "Personally identifiable information only"], 0, "Health status, healthcare provision, and payment for healthcare as defined in Health Insurance Portability and Accountability Act make up protected health information. Personally identifiable information is broader, Payment Card Industry data concerns payment cards, and 'sensitive security parameters' isn't the term.", 3], ["Which regulation treats personal privacy as an individual human right in comprehensive 2016 legislation?", ["International Organization of Standards", "Health Insurance Portability and Accountability Act", "General Data Protection Regulation", "Payment Card Industry Data Security Standard"], 2, "The General Data Protection Regulation is 2016 European Union legislation that treats personal privacy as an individual human right. Health Insurance Portability and Accountability Act covers United States health information, Payment Card Industry Data Security Standard covers card processing, and International Organization of Standards develops voluntary standards.", 3], ["A caller poses as information technology to obtain an intern's password. Which term covers this tactic?", ["Fragment attack", "Whaling", "Social engineering", "Spoofing"], 2, "Social engineering uses tactics like impersonating authority to trick people into giving up access. Fragment attacks and spoofing are technical, and whaling targets high-level officials for wire transfers, not an intern's password.", 3], ["A convincing email appears to come from the chief executive officer and asks the chief financial officer to wire funds to a new payee. Which attack is this?", ["Fragment attack", "Bot", "Whaling", "Spoofing"], 2, "Whaling is phishing aimed at highly placed officials to authorize large wire transfers. Fragment attacks and spoofing are technical, and a bot is remotely controlled malware.", 3], ["An administrator uses authorized access to copy confidential data before resigning. Which threat is this?", ["Spoofing", "External threat actor", "Insider threat", "Bot"], 2, "An insider threat is an entity with authorized access that could harm an information system. An external actor lacks authorized access, spoofing forges addresses, and a bot is malware.", 3], ["Independent examination of approvals and access records to assess control adequacy is a(n):", ["Patch management", "Logging", "Provisioning", "Audit"], 3, "An audit is an independent review and examination of records and activities to assess control adequacy and compliance. Patch management, logging, and provisioning are operational processes.", 3], ["Which authentication method combines two distinct factors?", ["A badge plus a second badge", "A password plus a security question", "A hardware token plus a fingerprint", "A passphrase plus a personal identification number"], 2, "A hardware token (something you have) plus a fingerprint (something you are) combines two distinct factor types. A passphrase and personal identification number or a password and security question are both knowledge, and two badges are both possession.", 3], ["Which describes a physical control often linked to technical systems?", ["A written password policy", "A monthly patch schedule", "A badge reader tied to a door lock", "A firewall rule for the lobby"], 2, "A badge reader tied to a door lock is a physical control linked to technical systems, the glossary's example. A password policy is administrative, a patch schedule is operational, and a firewall rule is technical.", 3], ["Which pairing correctly places bits, bytes, and packets?", ["Bits at Layer 2; a byte is typically sixteen bits; packets at Layer 4", "Bits at Open Systems Interconnection Layer 1; a byte is typically eight bits; packets at Layer 3", "Bits at Layer 1; a byte is typically sixteen bits; packets at Layer 2", "Bits at Layer 3; a byte is typically four bits; packets at Layer 1"], 1, "Bits are at Open Systems Interconnection Layer 1, a byte is most commonly eight bits, and packets are at Layer 3. The other choices alter the layer or the byte size.", 4], ["A sender wraps data in headers layer by layer; the receiver removes them. Which pairing names these processes?", ["De-encapsulation, then encapsulation", "Encryption, then decryption", "Encapsulation, then de-encapsulation", "Fragmentation, then reassembly"], 2, "The sender encapsulates data in headers layer by layer, and the receiver de-encapsulates by unpacking them. Encryption/decryption and fragmentation/reassembly are different processes.", 4], ["Which mapping of Transport Control Protocol/Internet Protocol layers is correct?", ["Link: user programs; Internet: host channels; Transport: network-to-network; Application: physical", "Link: host channels; Internet: user programs; Transport: physical; Application: network-to-network", "Link: physical; Internet: network-to-network; Transport: host channels; Application: user programs", "Link: network-to-network; Internet: physical; Transport: user programs; Application: host channels"], 2, "The Transport Control Protocol/Internet Protocol model has the Link layer for physical communications, the Internet layer for network-to-network communication, the Transport layer for host channels, and the Application layer for user programs. The other mappings scramble those functions.", 4], ["Which statement describes Internet Protocol version 4 in the glossary?", ["The internet protocol and program used to move files between hosts", "The standard protocol for sending and receiving email between mail servers", "The Internet Protocol network protocol used to check whether a host is available", "The standard protocol for transmitting data from source to destination in packet-switched networks"], 3, "Internet Protocol version 4 is the standard protocol for transmitting data from source to destinations in packet-switched networks. The other statements describe File Transfer Protocol, Simple Mail Transport Protocol, and Internet Control Message Protocol.", 4], ["A tool built on Request for Comments 792 checks whether a host or service is available. Which protocol is this?", ["Internet Control Message Protocol", "File Transfer Protocol", "Simple Mail Transport Protocol", "Internet Protocol version 4"], 0, "Internet Control Message Protocol is standardized by the Internet Engineering Task Force in Request for Comments 792 and is used to determine whether a service or host is available. File Transfer Protocol transfers files, Simple Mail Transport Protocol handles email, and Internet Protocol version 4 transmits data.", 4], ["Which pairing of bodies and focus is correct?", ["Internet Engineering Task Force: card-data security; International Organization of Standards: email relay; Institute of Electrical and Electronics Engineers: Domain Name Service naming; National Institute of Standards and Technology: Wi-Fi rollout", "Internet Engineering Task Force: telecom engineering; International Organization of Standards: Internet protocols; Institute of Electrical and Electronics Engineers: voluntary standards; National Institute of Standards and Technology: Domain Name Service naming", "Internet Engineering Task Force: Commerce measurement; International Organization of Standards: Internet Protocol routing; Institute of Electrical and Electronics Engineers: card security; National Institute of Standards and Technology: protocol design", "Internet Engineering Task Force: Internet protocol standards; International Organization of Standards: voluntary international standards; Institute of Electrical and Electronics Engineers: telecom and computer engineering; National Institute of Standards and Technology: United States Commerce Department measurement"], 3, "Internet Engineering Task Force defines Internet protocol standards, International Organization of Standards develops voluntary international standards, Institute of Electrical and Electronics Engineers sets telecom and computer engineering standards, and National Institute of Standards and Technology is part of the United States Department of Commerce. The other pairings mismatch bodies and focus.", 4], ["A colleague says Domain Name Service is only a protocol. Which correction fits the glossary?", ["Domain Name Service can name a service, a physical server, and a protocol", "Domain Name Service refers only to a hosted software service", "Domain Name Service refers only to a network protocol", "Domain Name Service refers only to a physical name server"], 0, "Domain Name Service can refer to a service, a physical server, and a network protocol, so calling it only a protocol, server, or service is incomplete.", 4], ["Staff move files between hosts with one internet protocol and relay mail with another. Which pairing is correct?", ["Domain Name Service for files; Internet Control Message Protocol for email", "File Transfer Protocol for files; Simple Mail Transport Protocol for email", "Internet Control Message Protocol for files; Domain Name Service for email", "Simple Mail Transport Protocol for files; File Transfer Protocol for email"], 1, "File Transfer Protocol is the internet protocol and program for transferring files between hosts, and Simple Mail Transport Protocol is the standard for sending and receiving email. The other pairings assign them wrongly.", 4], ["A host sends traffic intended for everyone on its network segment. Which transmission form is this?", ["Encapsulation", "Spoofing", "Unicast", "Broadcast"], 3, "Broadcast is one-to-many, sending traffic to everyone. Unicast is one-to-one, and encapsulation and spoofing aren't transmission forms.", 4], ["Workstations in different buildings must behave as one local area network, separate from other departments. Which technology fits?", ["Virtual private network", "Firewall", "Broadcast", "Virtual local area network"], 3, "A virtual local area network is a logical group of devices that appear to be on the same local area network regardless of location, while remaining separate from other groups. A virtual private network tunnels traffic, a firewall filters, and broadcast is a transmission type.", 4], ["Remote staff need secure communication to headquarters over existing networks. Which technology fits?", ["Virtual local area network", "Broadcast", "Wireless Area Network", "Virtual private network"], 3, "A virtual private network is built on top of existing networks to provide a secure communications mechanism. Virtual local area networks group devices, Wireless Area Networks are wireless networks, and broadcast is a transmission form.", 4], ["An office network uses radio transmissions instead of cables. Which glossary term fits, and what is Wi-Fi a type of?", ["Wide area network; Wi-Fi is a type of wide area network", "Virtual private network; Wi-Fi is a type of virtual private network", "Virtual local area network; Wi-Fi is a type of virtual local area network", "Wireless Area Network; Wi-Fi is a type of Wireless Area Network"], 3, "A network using radio transmissions instead of wires is a Wireless Area Network, and a Wi-Fi network is a type of Wireless Area Network. Virtual local area network, virtual private network, and wide area network are different network types.", 4], ["A device enforces administrative security policy by filtering incoming traffic against rules. Which device is this?", ["Firewall", "Application server", "Web server", "Security operations center"], 0, "Firewalls enforce administrative security policies by filtering incoming traffic according to rules. Application and web servers host services, and a security operations center monitors events.", 4], ["One team monitors incoming traffic for scans while another watches outbound traffic for large transfers. Which pairing is correct?", ["Egress monitoring; egress monitoring", "Ingress monitoring; egress monitoring", "Ingress monitoring; ingress monitoring", "Egress monitoring; ingress monitoring"], 1, "Ingress monitoring watches incoming traffic, such as scans, and egress monitoring watches outgoing traffic, such as large transfers. The other combinations repeat or swap them.", 4], ["Authorized users cannot reach a service because requests flood it. Which attack is this?", ["Denial of service", "Spoofing", "Zero day", "Whaling"], 0, "Denial of service prevents authorized access to resources or delays time-critical operations, as when a flood overwhelms a service. Spoofing, zero days, and whaling aren't about overwhelming availability.", 4], ["Traffic is split so that a system cannot put the packets back together. Which attack is this?", ["Broadcast", "Fragment attack", "Spoofing", "Oversized packet attack"], 1, "A fragment attack splits traffic so a system can't put the packets back together. An oversized packet attack sends one packet too large, and spoofing and broadcast are different.", 4], ["A server fails after receiving a packet larger than it can handle. Which attack is this?", ["Oversized packet attack", "Whaling", "Bot", "Fragment attack"], 0, "An oversized packet attack sends a packet larger than expected or than the receiver can handle, causing failure. A fragment attack splits traffic, whaling is phishing, and a bot is malware.", 4], ["An adversary sits between user and system, reading and altering traffic. Which attack is this?", ["Ransomware", "Fragment attack", "Denial of service", "Man-in-the-middle"], 3, "In a man-in-the-middle attack, the adversary sits between user and system to intercept and alter traffic. Ransomware, fragment attacks, and denial of service don't involve intercepting both sides.", 4], ["Packets carry a forged sender address to gain entry into a secure system. Which attack is this?", ["Whaling", "Degaussing", "Spoofing", "Fragment attack"], 2, "Spoofing is faking the sending address of a transmission to gain entry. Whaling, degaussing, and fragment attacks don't forge addresses.", 4], ["A graphical tool maps everything connected to a network for the Nmap scanner. Which tool is this?", ["Checksum", "Token", "Wireshark", "Zenmap"], 3, "Zenmap is the graphical user interface for the Nmap Security Scanner, which maps connected devices. Wireshark captures packets, and a checksum and token are unrelated.", 4], ["A developer integrates a payment provider's web service using a documented set of routines and protocols. Which term fits?", ["Protocol only", "Encapsulation", "Application server", "Application programming interface"], 3, "An application programming interface is a set of routines, standards, protocols, and tools for building software that accesses a web-based application. A protocol alone, encapsulation, and an application server are different concepts.", 4], ["One machine hosts business applications for workstations; another provides World Wide Web services and may be called an intranet server if internal. Which pairing is correct?", ["Web server; web server", "Web server; application server", "Application server; web server", "Application server; application server"], 2, "An application server hosts applications to user workstations, and a web server provides World Wide Web services and may be called an intranet server if used internally. The other pairings repeat or reverse them.", 4], ["A provider offers on-demand, shared, rapidly provisioned computing resources with minimal management effort. Which term fits?", ["Defense in depth", "Microsegmentation", "Cloud computing", "Zero trust"], 2, "Cloud computing is a model for on-demand network access to a shared pool of configurable resources rapidly provisioned with minimal management effort. Defense in depth, microsegmentation, and zero trust are security concepts.", 4], ["A customer rents core computing and storage; another builds apps in provider middleware; another uses provider apps via browser. Which pairing is correct?", ["Infrastructure as a Service, Software as a Service, Platform as a Service", "Infrastructure as a Service, Platform as a Service, Software as a Service", "Software as a Service, Platform as a Service, Infrastructure as a Service", "Platform as a Service, Infrastructure as a Service, Software as a Service"], 1, "Infrastructure as a Service provides core computing and storage, Platform as a Service provides middleware for building apps, and Software as a Service provides applications via a browser. The other orders mismatch them.", 4], ["A hospital runs cloud inside its firewall; three agencies share another; a vendor offers one to the public. Which pairing is correct?", ["Private; public; community", "Community; public; private", "Public; private; community", "Private; community; public"], 3, "A private cloud runs inside the corporate firewall under information technology control, a community cloud is shared by organizations with common concerns, and a public cloud is open to the general public. The other orders mismatch them.", 4], ["A remotely controlled infected machine with trojan and worm capabilities takes commands from an attacker. Which term fits?", ["Checksum", "Bot", "Token", "Payload"], 1, "A bot is malicious code that acts like a remotely controlled robot for an attacker, with trojan and worm capabilities. A checksum, token, and payload are different things.", 4], ["Which statement about Linux, iOS, and operating system kernels is accurate?", ["Linux is proprietary; iOS is open source; the kernel loads on demand", "Linux is open source; iOS is Apple's mobile operating system; the kernel stays in memory", "Linux is open source; iOS is Apple's desktop operating system; the kernel is an application", "Linux is Apple's mobile operating system; iOS is open source; the kernel stays on disk"], 1, "Linux is open source, iOS is Apple's mobile operating system, and an operating system kernel resides in memory at all times. The other statements swap or misstate those facts.", 4], ["Which statement about software matches the glossary?", ["Software is fixed code that never changes after installation", "Software is only the data kept on a disk or other storage", "Software includes programs and data that may change during execution", "Software is firmware that is stored only on device chips"], 2, "Software is programs and associated data that may be dynamically written or modified during execution. It isn't fixed, data-only, or firmware-only.", 4], ["A firm describes a network where traffic crosses small zones guarded by firewalls so a breach cannot spread. Which design belief does it support?", ["Perimeter trust", "Open broadcast", "Single-layer defense", "Removing any trusted space"], 3, "Using many small zones guarded by firewalls supports zero trust, which removes any trusted space. Perimeter trust assumes the inside is safe, and open broadcast or single-layer defense aren't designed to stop spread.", 4], ["A data center needs to see every device on a subnet it is authorized to scan. Which tool fits?", ["Token", "Zenmap", "Data loss prevention", "Firewall"], 1, "Zenmap is a graphical user interface for the Nmap scanner that determines everything connected to a network. A token, data loss prevention, and a firewall don't discover devices.", 4], ["A packet is represented at which Open Systems Interconnection layer?", ["Layer 1", "Layer 3", "Layer 2", "Layer 4"], 1, "A packet represents data at Layer 3 of the Open Systems Interconnection model. Bits are Layer 1, frames are Layer 2, and segments are Layer 4.", 4], ["Which statement about protocols is accurate?", ["A storage format used to exchange data between systems", "A hardware device that filters traffic between systems", "A set of rules controlling communication between systems", "A family of malicious code that spreads between systems"], 2, "A protocol is a set of rules (formats and procedures) that control communication between systems. It isn't a device, a malware family, or a storage format.", 4], ["Which transmission is one-to-many?", ["Encapsulation", "De-encapsulation", "Broadcast", "Unicast"], 2, "Broadcast is one-to-many. Unicast is one-to-one, and encapsulation and de-encapsulation are packaging processes.", 4], ["An administrator sets up a secure channel built on top of existing networks. Which term fits best?", ["Virtual private network", "Virtual local area network", "Wireless Area Network", "Zero trust"], 0, "A virtual private network is built on top of existing networks to provide a secure communications mechanism. Virtual local area networks group devices, Wireless Area Networks are wireless, and zero trust is a model.", 4], ["An update modifies another component's files without changing its version number. Which term describes it?", ["Baseline", "Token", "Patch", "Rule"], 2, "A patch modifies files or settings of another software component without changing its version number. A baseline is a minimum configuration, a token authenticates, and a rule allows or denies access.", 5], ["A team notifies, identifies, deploys, installs, and verifies code revisions across systems. Which process is this?", ["Configuration management", "Records retention", "Provisioning", "Patch management"], 3, "Patch management is the systematic notification, identification, deployment, installation, and verification of code revisions. Configuration management controls all changes, retention concerns records, and provisioning concerns accounts.", 5], ["A server drifts below its documented minimum configuration. Which concept was breached, and what controls changes?", ["The request for change; configuration management", "The baseline; patch management", "The payload; records retention", "The baseline; configuration management"], 3, "The baseline is the documented lowest security configuration, and configuration management ensures only authorized changes occur. An request for change starts a change, patch management handles updates, and a payload is malicious code's action.", 5], ["A procedure gap lets vendors keep accounts after contracts end. Which term covers weaknesses in security procedures?", ["Payload", "Vulnerability", "Exploit", "Bot"], 1, "A vulnerability is a weakness in a system, procedures, or controls that could be exploited, and a missing offboarding procedure is such a weakness. An exploit is an attack, a payload is malicious action, and a bot is malware.", 5], ["A published script abuses a flaw on unpatched servers. Which term names that particular attack?", ["Exploit", "Baseline", "Threat actor", "Vulnerability"], 0, "An exploit is a particular attack that takes advantage of a vulnerability. The flaw is the vulnerability, a baseline is a configuration, and a threat actor is the party attacking.", 5], ["Attackers use a flaw unknown to the vendor, and no signatures catch it. Which term and stance fit best?", ["Exploit; rely on signature-based detection alone", "Zero day; segmentation and monitoring as compensating controls", "Payload; reboot affected hosts each night", "Zero day; wait for the vendor patch before acting"], 1, "A zero day is a previously unknown vulnerability that evades signatures. With no patch, compensating controls like segmentation and monitoring reduce exposure. Waiting or relying on signatures leaves you exposed, and rebooting doesn't fix it.", 5], ["Malicious code abuses a flaw, then encrypts files. Which part is the payload?", ["The vulnerability scanner", "The file-encrypting action", "The flaw", "The delivery email"], 1, "The payload is the primary action of a malicious attack, here encrypting files. The flaw is the vulnerability, the email is the delivery vector, and a scanner is a defensive tool.", 5], ["Files are locked and a payment is demanded. Which malware is this, and what best supports recovery?", ["Spoofing; tokens and multi-factor login", "Ransomware; isolated backups and disaster recovery", "Zero day; baselines and records retention", "Bot; ingress monitoring and filtering"], 1, "Ransomware locks files until money is paid, and isolated backups plus disaster recovery let you recover without paying. The other pairings misidentify the malware or recommend unrelated controls.", 5], ["An email containing card numbers is blocked from leaving. Which capability does this, and how does it differ from egress monitoring?", ["Both only log traffic that leaves the network", "Both only encrypt traffic that leaves the network", "Egress monitoring prevents; data loss prevention observes outgoing traffic", "Data loss prevention can prevent; egress monitoring observes outgoing traffic"], 3, "Data loss prevention is designed to detect and prevent unauthorized transmission of information, such as card numbers, while egress monitoring watches outgoing traffic. They don't just log or encrypt, and the prevention role isn't reversed.", 5], ["A reviewer examines login records and notes an irregular 3 in the morning login. Which pairing is correct?", ["Logging collected the records; the irregularity is a log anomaly", "Both are baselines", "Both are tokens", "Anomaly collected records; logging is the irregularity"], 0, "Logging collects and stores the activity records, and a log anomaly is an irregularity found by studying them. They aren't baselines or tokens, and the roles aren't reversed.", 5], ["An independent party examines records and activities to assess adequacy of controls. Which activity is this?", ["Egress monitoring", "Logging", "Audit", "Provisioning"], 2, "An audit is an independent review of records and activities to assess control adequacy. Egress monitoring watches outbound traffic, logging collects records, and provisioning manages accounts.", 5], ["Invoices are retained for the required period then destroyed; old drives still hold fragments. Which pairing is correct?", ["Data loss prevention; token", "Records retention; remanence", "Remanence; records retention", "Baseline; payload"], 1, "Records retention keeps records as long as needed and then destroys them; remanence is residual data left on media after clearing. The other pairings mismatch them.", 5], ["Tapes are exposed to a strong magnetic field before disposal. Which technique is this, and what should remain?", ["Degaussing; too little remanence to rebuild data", "Hashing; a checksum proving the data was erased", "Overwriting; a new baseline for the storage device", "Encapsulation; headers wrapped around the old data"], 0, "Degaussing erases magnetic media with a strong field so there's too little remanence to reconstruct data. Hashing, overwriting, and encapsulation aren't degaussing, and none produces the results described.", 5], ["A chatbot resolves password requests by simulating human intelligence. Which glossary term names the capability?", ["Token", "Artificial intelligence", "Encapsulation", "Bot"], 1, "Artificial intelligence is the ability of computers to simulate human intelligence and behavior. In the glossary, a bot is malicious remotely controlled code, so the chatbot isn't that. A token and encapsulation are different terms.", 5], ["A compliance regime requires the system to enforce labels so owners cannot override access. Which model and why?", ["Mandatory access control; the system enforces policy", "Rule-based; access depends on access control list entries only", "Role-based access control; permissions follow job roles only", "Discretionary access control; each owner decides who gets access"], 0, "Mandatory access control has the system manage access according to organizational policy, so owners can't override it. Discretionary access control lets owners decide, role-based access control uses job roles, and rule-based uses access control list entries.", 5], ["Offsite backups of highly classified data are stored in plaintext. Which fix best matches the glossary?", ["Relabel them as public so handling is simpler", "Encrypt them so the data becomes ciphertext", "Delete the logs that describe the shipment", "Remove the tokens used to open the cases"], 1, "Encrypting converts plaintext to ciphertext, protecting confidentiality of data in storage or transit. Relabeling as public, deleting logs, or removing tokens doesn't protect the data.", 5], ["A vendor claims files are secure because a checksum matches. Which statement is most accurate?", ["A checksum is a hardware token that proves a user's identity", "A checksum prevents attackers from spoofing the sender address", "A checksum encrypts files so only the owners can read them", "A checksum detects errors but is not a confidentiality control"], 3, "A checksum detects errors by comparing computed values but doesn't provide confidentiality or identity proof. It doesn't encrypt, authenticate users, or prevent spoofing.", 5], ["A trainee says a digital signature and a message digest are the same. Which statement fits the glossary?", ["Neither is cryptographic; a signature only compresses the data", "Both provide availability; a digest also provides privacy for data", "A signature gives origin authentication, integrity, and non-repudiation; a digest only flags changes", "Both give non-repudiation; a digest also gives origin authentication"], 2, "A digital signature provides origin authentication, integrity, and non-repudiation, while a message digest merely changes if data changes. They aren't the same, and a digest doesn't provide non-repudiation or availability.", 5], ["After controls, leadership insures part of a residual risk and approves living with the rest. Which combination of treatments is this?", ["Avoidance and mitigation", "Avoidance and transference", "Mitigation only", "Transference and acceptance"], 3, "Insuring part of the risk is transference, and approving the remainder is acceptance. Mitigation, avoidance, or one treatment alone doesn't describe both actions.", 5], ["A hurricane threatens a data center. Which statement fits the glossary's threat definition?", ["A threat is only malicious code that runs on a host", "A threat can be any event that could harm operations, malicious or not", "A threat requires a human attacker with malicious intent", "A threat is a control that reduces the impact of attacks"], 1, "A threat is any circumstance or event with the potential to adversely impact operations or assets, malicious or not. A hurricane qualifies even though no attacker exists, and a threat isn't a control.", 5], ["A risk workshop confuses impact and likelihood. Which correction is right?", ["Impact is a control type; likelihood is a threat type here", "Impact is harm; likelihood is the chance a vulnerability is exercised", "Impact and likelihood are the same measure in the glossary", "Impact is the chance of exploitation; likelihood is the harm"], 1, "Impact is the magnitude of harm, and likelihood is the probability that a vulnerability will be exercised. The other statements swap or equate them, or invent control and threat types.", 5], ["Which statement matches Payment Card Industry Data Security Standard, General Data Protection Regulation, and Health Insurance Portability and Accountability Act correctly?", ["Payment Card Industry Data Security Standard: protected health information; General Data Protection Regulation: card processors; Health Insurance Portability and Accountability Act: European Union privacy", "Payment Card Industry Data Security Standard: card processors; General Data Protection Regulation: European Union privacy; Health Insurance Portability and Accountability Act: protected health information", "Payment Card Industry Data Security Standard: card processors; General Data Protection Regulation: protected health information; Health Insurance Portability and Accountability Act: European Union privacy", "Payment Card Industry Data Security Standard: European Union privacy; General Data Protection Regulation: protected health information; Health Insurance Portability and Accountability Act: card processors"], 1, "Payment Card Industry Data Security Standard applies to merchants and service providers processing cards, General Data Protection Regulation is European Union privacy legislation, and Health Insurance Portability and Accountability Act defines protected health information. The other pairings swap those scopes.", 5], ["A customer can change only limited user settings and cannot touch the operating system, network, servers, or storage. Which model is this?", ["Software as a Service", "Infrastructure as a Service", "Private cloud", "Platform as a Service"], 0, "In Software as a Service, the consumer doesn't manage the network, servers, operating systems, or storage, apart from limited user-specific settings. Infrastructure as a Service and Platform as a Service give more control, and private cloud is a deployment model.", 5], ["Developers build apps in a provider's middleware environment before deploying them as Software as a Service. Which model is this?", ["Platform as a Service", "Software as a Service", "Community cloud", "Infrastructure as a Service"], 0, "Platform as a Service is the application development middleware environment where apps are built before being deployed as Software as a Service. Infrastructure as a Service provides infrastructure, Software as a Service is the finished application, and community cloud is a deployment model.", 5], ["A provider supplies core computing, storage, and network hardware billed by usage. Which model is this?", ["Public cloud only", "Infrastructure as a Service", "Software as a Service", "Platform as a Service"], 1, "Infrastructure as a Service provides core computing, storage, and network hardware and software, usually billed on usage. Platform as a Service and Software as a Service sit higher in the stack, and public cloud is a deployment model.", 5], ["A cryptanalyst finds an implementation weakness in a sound algorithm. Which statement is consistent with the glossary?", ["Implementations are never studied during any cryptanalysis", "Cryptanalysis includes finding flaws in an algorithm's implementation", "Algorithms cannot contain weaknesses once they are published", "Weaknesses only arise after the data becomes ciphertext"], 1, "Cryptanalysis includes looking for errors or weaknesses in the implementation of an algorithm or in the algorithm itself. The other statements claim implementations aren't studied or algorithms can't be weak.", 5], ["A firm claims defense in depth because it has one firewall. Which critique fits best?", ["Depth means one well-configured firewall is sufficient alone", "Depth means issuing every user a hardware au
