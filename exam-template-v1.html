olicy even when a file's author approves. Which pairing is correct?", ["Project lead: discretionary access control; agency: mandatory access control", "Project lead: mandatory access control; agency: discretionary access control", "Project lead: role-based access control; agency: mandatory access control", "Project lead: discretionary access control; agency: role-based access control"], 0, "Discretionary access control leaves decisions to the object's owner or anyone the owner authorizes. Mandatory access control requires the system itself to manage access in accordance with organizational policy, so even an author cannot override it. Role-based control would assign permissions by role, which neither scenario describes.", 3], ["A nurse is promoted to supervisor. Instead of editing dozens of individual permissions, the administrator moves her into the Supervisor group, and her access changes at once. Which model does this describe, and what is its key characteristic?", ["Rule-based access control, in which permissions follow individual access control list entries", "Mandatory access control, in which permissions follow labels the system enforces", "Discretionary access control, in which permissions are set by the owner of each object", "Role-based access control, in which permissions are set up based on roles"], 3, "Role-based access control sets up user permissions based on roles, so moving a person into a role changes their permissions together. Discretionary control depends on owners, and mandatory control depends on system-enforced labels, neither of which is involved in a group move.", 3], ["A backup program copies a payroll file. An access control list contains an entry allowing the program's validated identity to read that file. Which labeling is correct?", ["The program is the subject, the file is the object, and the entry comparing identity to the list is a rule", "The program is the object, the file is the subject, and the entry comparing identity to the list is a rule", "The program is the subject, the file is the rule, and the entry comparing identity to the list is an object", "The program is the subject, the file is the object, and the entry comparing identity to the list is a token"], 0, "A subject is an individual, process, or device causing information to flow, and an object is a passive entity containing or receiving information. A rule is an instruction that allows or denies access by comparing the validated identity of the subject to an access control list. A token is a possessed authenticator, not a list entry.", 3], ["An employee presents a card, enters a personal identification number, and the system opens only the applications tied to the employee's job across workstations, networks, and databases. Which term best describes this automated system?", ["Mandatory access control, because the system assigns every application without any rules", "Logical access control system, because it validates identity and assigns privileges by role", "Physical access control system, because it begins with a card swipe at the door", "Discretionary access control, because the employee chooses which applications to open"], 1, "A logical access control system is an automated system that controls an individual's ability to access computer system resources, validating identity through a personal identification number, card, biometric, or other token and assigning privileges by role. Physical access control governs doors and barriers, and the employee does not choose the applications.", 3], ["A systems administrator uses an account with broad approved authorizations for daily email and web browsing. A scheduled program that only reads one share also runs under that account. Which statement is correct?", ["The account is an object, and both uses violate non-repudiation", "The account is a service account, and both uses satisfy the principle of least privilege", "The account is a privileged account, and both uses satisfy segregation of duties", "The account is a privileged account, and both uses violate the principle of least privilege"], 3, "A privileged account has approved authorizations of a privileged user. Users and programs should have only the minimum privileges needed for their tasks, so using it for email and for a read-only job violates least privilege. Segregation of duties concerns splitting a process among people.", 3], ["A purchasing process lets one employee create a vendor, approve its invoices, and release payment. Management wants the change that most directly reduces insider fraud risk. Which fits best?", ["Require the employee to change a password more often when performing each of the three steps", "Require the employee to record each step in a log the employee can later edit", "Require the employee to complete an annual training course on invoice fraud", "Require different people for creating the vendor, approving invoices, and releasing payment"], 3, "Segregation of duties ensures that a process cannot be completed by a single person and forces collusion as a means to reduce insider threats. Password changes, editable logs, and training do not stop one person from completing every step alone.", 3], ["A database administrator with legitimate access copies customer records to a personal drive after a poor performance review. Perimeter defenses did not trigger. Which term best describes this threat?", ["Intrusion, because the administrator gained access without any real authorization at all", "Zero day, because the access path was previously unknown to the organization's defenders", "Insider threat, because an entity with authorized access has the potential to harm the system", "Threat actor only, because outsiders always begin by attacking the perimeter first"], 2, "An insider threat is an entity with authorized access that has the potential to harm an information system through destruction, disclosure, modification, or denial of service. Perimeter controls do not stop someone who is already trusted. The access was authorized, so it is not an intrusion.", 3], ["Human resources approves a hire, information technology creates accounts, permissions change when the employee moves departments, and accounts are disabled at departure. An auditor asks which process covers the whole lifecycle.", ["Configuration management, which ensures only authorized changes reach a system", "Records retention, which keeps records and destroys them after an interval", "Patch management, which deploys and verifies software code revisions", "User provisioning, which creates, maintains, and deactivates user identities"], 3, "User provisioning is the process of creating, maintaining, and deactivating user identities on a system. The other processes concern changes to systems, software updates, and keeping or destroying records.", 3], ["A data center entrance has a small vestibule where the first door must close before the second opens. A corporate lobby uses a rotating barrier that admits one badge-holder per turn. Which pairing is correct?", ["Data center: mantrap; lobby: mantrap", "Data center: turnstile; lobby: turnstile", "Data center: turnstile; lobby: mantrap", "Data center: mantrap; lobby: turnstile"], 3, "A mantrap requires people to pass through two doors with only one open at a time. A turnstile is a one-way spinning door or barrier that allows one person at a time. The vestibule is a mantrap and the rotating barrier is a turnstile.", 3], ["A badge reader is wired to an electronic lock and sends each entry to a server, while a steel door and a guard desk sit beside it. How does the glossary classify these items?", ["Governance controls, because every entry is recorded for later review by management", "Administrative controls, because a guard desk operates under written policy and procedure", "Technical controls, because the badge reader and lock are executed by software", "Physical controls, many of which are linked to technical or logical systems such as badge readers"], 3, "Physical controls are implemented through a tangible mechanism, such as walls, locks, and guards, and many are linked to technical or logical systems like badge readers connected to door locks. Policies would be administrative, and system-executed safeguards would be technical.", 3], ["A company redesigns a parking lot with brighter lighting, open sight lines, and trimmed shrubs so intruders have nowhere to hide, with no new guards. Which approach is this, and what does it emphasize?", ["Crime Prevention through Environmental Design, which emphasizes passive features in the design", "Microsegmentation, which emphasizes very small network zones separated by firewalls", "Defense in depth, which emphasizes multiple active controls arranged in series for an asset", "Segregation of duties, which emphasizes dividing one process among several different people"], 0, "Crime Prevention through Environmental Design is an architectural approach that emphasizes passive features to reduce the likelihood of criminal activity. Lighting and sight lines work without guards or active controls, unlike the other approaches listed.", 3], ["A help desk technician logs in successfully but can open payroll files that have nothing to do with her role. Which control failed?", ["Authentication, because her credentials were not verified when she logged in", "Non-repudiation, because her actions cannot be tied to her verified identity", "Authorization, because permissions granted to her identity exceed what her role requires", "Availability, because payroll files were unreachable by the authorized payroll staff"], 2, "Authorization is the right or permission granted to a system entity to access a resource. Her identity was verified correctly, but excess permissions were granted, which also violates the principle of least privilege.", 3], ["Which is the best example of a passive design feature rather than an active control?", ["Windows and open sight lines that let staff see the parking area from the lobby", "A camera that records the license plates of vehicles entering the parking area during business hours", "A badge reader that opens the main entrance after validating a card presented by the visitor", "A guard who walks the parking area each hour on a fixed schedule through the evening shift"], 0, "Crime Prevention through Environmental Design emphasizes passive features, such as visibility and sight lines, that reduce criminal opportunity without anyone operating a control. Guards, readers, and cameras are physical or technical controls that require action or equipment.", 3], ["Which statement shows discretionary access control?", ["A guard decides who may enter the room that stores the paper copy of the document on that floor", "A system labels every document and blocks any sharing that violates policy, whatever the author wants", "A document's creator grants a colleague edit rights without asking an administrator", "An administrator assigns the same rights to everyone who belongs to the Auditors group in the system"], 2, "In discretionary access control, a certain amount of control is left to the discretion of the object's owner, who determines who should have access rights and what they are. Labels enforced by the system describe mandatory control, and group-based rights describe role-based control.", 3], ["A manager cannot grant a colleague access to a labeled file, even though the manager created it. The system refuses on policy grounds. Which model explains this, and why?", ["Discretionary access control, because the owner of the file decides who may access it and at what level", "Rule-based sharing, because every file may be shared by its creator without any restriction by the system", "Mandatory access control, because the system itself manages access in accordance with organizational policy", "Role-based access control, because permissions are assigned only to groups of users and never to a single person"], 2, "Mandatory access control requires the system itself to manage access controls in accordance with the organization's security policies, so an owner cannot override the label. In discretionary control the owner would decide.", 3], ["Which is a logical access control rather than a physical one?", ["A system that validates a card and a personal identification number and then assigns privileges by role", "A two-door vestibule at the data center entrance where only one door opens at a time for visitors", "A fence with a gate guard, a steel door, and a visitor sign-in sheet at the entrance of the site", "A turnstile that admits one person at a time through the lobby after a badge is presented"], 0, "A logical access control system is an automated system that controls an individual's ability to access computer resources, validating identity and assigning privileges by role. Fences, guards, turnstiles, and vestibules are tangible physical controls.", 3], ["A user deletes a customer record while a scheduled job reads the same table. Which labeling is correct?", ["The user and the job are subjects; the record and the table are objects", "The user is an object and the job is a subject; the record and table are rules", "The user and the job are rules; the record and the table are tokens", "The user and the job are objects; the record and the table are subjects"], 0, "A subject is an individual, process, or device causing information to flow among objects, and an object is a passive entity containing or receiving information. Both the person and the scheduled process act, while the record and table are acted upon.", 3], ["A service account that reads one folder holds domain administrator rights. Which change best applies the principle of least privilege?", ["Keep the rights but require the account's password to be changed every month", "Keep the rights but move the account into the Auditors group so its use is reviewed", "Grant read access to only that folder and remove the administrator rights", "Keep the rights but log every use of the account for later review"], 2, "The principle of least privilege says users and programs should have only the minimum privileges necessary to complete their tasks. A privileged account has approved authorizations beyond ordinary users, so removing unnecessary rights is the direct fix. Logging and password changes do not reduce what a compromise can do.", 3], ["Which statement describes an access rule?", ["A document that states management's intent for protecting information across the whole organization and its units", "An instruction that allows or denies access by comparing a validated identity with an access control list", "A step-by-step instruction for revoking a user's account when employment ends and access must stop", "A measure of the importance the owner assigns to a document for the purpose of protecting it properly"], 1, "A rule is an instruction developed to allow or deny access to a system by comparing the validated identity of the subject to an access control list. The other options describe a policy, a procedure, and sensitivity.", 3], ["Which process most clearly lacks segregation of duties?", ["A manager approves expense reports prepared by two different analysts who report to another director", "A developer submits code that another engineer reviews carefully before the release goes to production", "An auditor reviews records that were created earlier by members of the finance staff in the system", "A payroll clerk adds an employee, sets the salary, and approves the first payment"], 3, "Segregation of duties ensures an organizational process cannot be completed by a single person and forces collusion to reduce insider threats. One clerk performing every step of payroll creation, pay setting, and approval has no second person involved.", 3], ["Why are insider threats difficult for perimeter controls to stop?", ["The person already has authorized access and potential to harm the system through destruction, disclosure, modification, or denial of service", "The person always relies on a previously unknown vulnerability that fits no recognized signature or pattern in the monitoring tools", "The person is always an external attacker who has stolen a legitimate employee's identity and credentials", "The person's actions cannot be recorded because insiders are exempt from logging under most organizational policies"], 0, "An insider threat is an entity with authorized access that could harm an information system. Because the access is legitimate, controls aimed at outsiders do not stop it. Zero days and stolen identities are different problems.", 3], ["Which task is part of user provisioning?", ["Destroying invoices that have passed their retention period according to the records schedule", "Deactivating an employee's accounts when the employee leaves the organization", "Splitting a network into very small zones guarded by firewalls to limit lateral movement by attackers", "Verifying that a software update installed correctly on every server in the production environment"], 1, "User provisioning is the process of creating, maintaining, and deactivating user identities on a system. The other tasks are patch verification, records destruction, and microsegmentation.", 3], ["An administrator finds one user holds both the Payments Approver and Payments Entry roles. Which concern follows?", ["Role-based access control guarantees separation, so the combination is harmless", "The combination is the owner's choice because owners decide access under role-based control", "Role-based access control forbids any user from holding more than one role at a time", "Combined roles can defeat segregation of duties even in a role-based access control design"], 3, "Role-based access control sets permissions by roles, but it does not automatically prevent conflicting roles from being assigned to one person. When one user can enter and approve payments, the process can be completed by a single person, defeating segregation of duties.", 3], ["A site wants to stop two people entering on one badge swipe and to prevent someone slipping in while a door stays open. Which pairing of controls fits, in that order?", ["A mantrap admitting one person per turn; a fence letting only one door open at a time", "A turnstile admitting one person per turn; a mantrap letting only one door open at a time", "A mantrap admitting one person per turn; a turnstile letting only one door open at a time", "A turnstile letting only one door open at a time; a bollard admitting one person per turn"], 1, "A turnstile is a one-way barrier that allows only one person at a time to pass. A mantrap requires people to pass through two doors with only one open at a time. Together they address piggybacking and open-door slip-ins.", 3], ["Which is an example of a physical control linked to a technical system?", ["A password requirement of fourteen characters on every account in the central identity system", "A written policy requiring visitors to be escorted at all times while on the premises of the site", "A badge reader connected to a door lock and a server that records each entry", "A steel fence with no electronic components placed along the perimeter of the facility's grounds"], 2, "Physical controls are implemented through tangible mechanisms like walls, fences, guards, and locks, and many modern ones are linked to technical or logical systems, such as badge readers connected to door locks. A written policy is administrative, and a password requirement is technical.", 3]], "4": [["A technician tells a trainee that the signal on a cable is read as zeros and ones, the receiving host groups them in sets of eight, and routers forward data between networks. Which pairing of terms and layers is correct?", ["Bits at Layer 2, bytes typically of sixteen bits, and packets at Layer 4", "Bits at Layer 3, bytes typically of four bits, and packets at Layer 1", "Bits at Layer 1, bytes typically of eight bits, and packets at Layer 3", "Bits at Layer 1, bytes typically of sixteen bits, and packets at Layer 2"], 2, "A bit is the most basic representation of data at Layer 1 of the Open Systems Interconnection model, a byte most commonly consists of eight bits, and a packet represents data at Layer 3. The other options change the layer, the byte size, or both.", 4], ["When a message is sent, each layer of the network stack adds its own headers around the data. At the receiving end, those headers are removed one layer at a time. Which pairing names these processes?", ["Fragmentation when sending; reassembly when receiving", "Encapsulation when sending; de-encapsulation when receiving", "De-encapsulation when sending; encapsulation when receiving", "Encryption when sending; decryption when receiving"], 1, "Encapsulation packages data inside another data structure, as in network protocols, and de-encapsulation is the opposite process in which bundles of data are unpacked. Encryption and fragmentation change or split the data rather than wrapping it in headers.", 4], ["An engineer says a problem lies in the layer that provides basic channels for connection and connectionless exchange of data between hosts, not in the layer that provides network-to-network communication. Which pairing of layers is correct?", ["Internet layer and Link layer, respectively", "Transport layer and Internet layer, respectively", "Link layer and Application layer, respectively", "Application layer and Transport layer, respectively"], 1, "In the Transport Control Protocol/Internet Protocol model, the Transport layer provides basic channels for connections and connectionless exchange between hosts, and the Internet layer provides network-to-network communication. The Link layer is physical communications and the Application layer is where user programs use network services.", 4], ["A new analyst asks why different brands of computer can exchange data over the same networks. Which answer best uses the glossary's terms?", ["They follow shared protocols, and Internet Protocol is the standard for transmitting data from source to destinations in packet-switched networks", "They follow shared protocols, and Internet Protocol is the standard for transferring files between hosts on a network", "They follow shared protocols, and Internet Protocol is the standard for resolving domain names into network addresses", "They follow shared protocols, and Internet Protocol is the standard for sending and receiving email between senders and receivers"], 0, "Protocols are sets of rules, with formats and procedures, that control communication between systems. Internet Protocol is the standard protocol for transmission of data from source to destinations in packet-switched networks. Name resolution, email, and file transfer belong to other protocols.", 4], ["A help desk technician wants to learn quickly whether a branch server is reachable, using the protocol standardized in Request for Comments 792. Which protocol is this, and what does it test?", ["Internet Control Message Protocol, which determines whether a service or host is available", "Simple Mail Transport Protocol, which determines whether a mailbox is available", "File Transfer Protocol, which determines whether a file transfer is permitted", "Domain Name Service, which determines whether a domain name is registered"], 0, "The Internet Control Message Protocol was standardized by the Internet Engineering Task Force in Request for Comments 792 to determine whether a particular service or host is available. The other protocols handle email, file transfer, and name lookup.", 4], ["A vendor claims its wireless hardware meets an open engineering specification, and an architect wants to confirm how the Internet's core protocols are defined through consensus. Which pairing matches the bodies to those needs, in that order?", ["Institute of Electrical and Electronics Engineers; Internet Engineering Task Force", "Institute of Electrical and Electronics Engineers; International Organization of Standards", "Internet Engineering Task Force; Institute of Electrical and Electronics Engineers", "International Organization of Standards; Institute of Electrical and Electronics Engineers"], 0, "The Institute of Electrical and Electronics Engineers sets standards for telecommunications and computer engineering, and the Internet Engineering Task Force defines protocol standards such as Internet Protocol, Transport Control Protocol, and Domain Name Service through collaboration and consensus.", 4], ["An administrator says 'the Domain Name Service is down' in three meetings: about the lookup software, about the machine hosting it, and about the rules clients use to query it. Which statement explains why all three uses are acceptable?", ["The acronym refers only to a physical server, and the other two uses describe its software", "The acronym refers only to a service, and the other two uses describe its customers", "The acronym refers only to a protocol, and the other two uses are informal shorthand", "The acronym can refer to a service, a physical server, and a network protocol"], 3, "The glossary says the term can apply to three interrelated elements: a service, a physical server, and a network protocol. That is why people use it loosely, and each of the three uses in the meetings is legitimate.", 4], ["A web designer uploads site files to a hosting server, and the company's mail gateway delivers messages to an outside partner. Which pairing of protocols fits, in that order?", ["Internet Control Message Protocol; Simple Mail Transport Protocol", "File Transfer Protocol; Internet Control Message Protocol", "File Transfer Protocol; Simple Mail Transport Protocol", "Simple Mail Transport Protocol; File Transfer Protocol"], 2, "File Transfer Protocol is used to transfer files between hosts, and Simple Mail Transport Protocol is the standard for sending and receiving email. The Internet Control Message Protocol only checks whether hosts or services are available.", 4], ["A host on a large flat network announces itself to every other device at once, and the network slows as many hosts do the same. Which transmission type is this, and which change would limit its reach?", ["Unicast; replacing the network with a single virtual private network", "Broadcast; encrypting every transmission from end to end", "Multicast; moving every host into a public cloud environment", "Broadcast; dividing the network into virtual local area networks"], 3, "Broadcast is a one-to-many, one-to-everyone form of sending traffic. A virtual local area network groups devices logically and keeps that traffic within smaller groups. Encryption, tunnels, and cloud relocation do not reduce how far a broadcast reaches.", 4], ["Staff in two buildings must behave as if on one local network while remaining separate from the guest network. Which technology does this, and what defines it?", ["A virtual private network, a logical group of devices that communicate through an encrypted tunnel", "A community cloud, a group of organizations that share cloud infrastructure for their exclusive use", "A wireless area network, a group of devices that are linked by radio transmissions in one vicinity", "A virtual local area network, a logical group of devices that appear to be on the same network regardless of location"], 3, "A virtual local area network is a logical group of workstations, servers, and network devices that appear to be on the same local area network despite their geographical distribution. The other technologies describe tunnels, radio networks, and shared cloud environments.", 4], ["A traveling employee connects from a hotel using public Wi-Fi and needs the traffic protected across the existing networks between the hotel and headquarters. Which technology provides this, and how is it built?", ["A firewall, built at the network edge to filter outgoing traffic by rule", "A virtual private network, built on top of existing networks to provide a secure communications mechanism", "A community cloud, built by several organizations to share a pool of resources", "A virtual local area network, built on top of existing networks to isolate broadcast traffic"], 1, "A virtual private network is built on top of existing networks and provides a secure communications mechanism for transmission between networks. A virtual local area network groups devices logically, and a firewall filters incoming traffic by rules.", 4], ["An office offers Wi-Fi so laptops and phones connect without cables, and an engineer notes the signals reach outside the building. Which term describes this network, and what is Wi-Fi to it?", ["Wide area network; Wi-Fi is a standard that replaces it", "Virtual local area network; Wi-Fi is a protocol used by it", "Wireless area network; Wi-Fi is a type of it", "Virtual private network; Wi-Fi is an encryption method used by it"], 2, "A wireless area network is a group of computers and devices in the same vicinity forming a network based on radio transmissions instead of wired connections, and a Wi-Fi network is a type of it. Radio signals can be received outside the building, which is why they need protection.", 4], ["A perimeter device permits inbound traffic to a public website and drops all other inbound connections according to configured entries. Which description best fits the device and its purpose?", ["A virtual private network concentrator, which encrypts traffic between two sites", "An application server, which hosts applications to user workstations on the internal network", "A web server, which provides World Wide Web services including site content", "A firewall, which enforces administrative security policy by filtering incoming traffic against a set of rules"], 3, "Firewalls are devices that enforce administrative security policies by filtering incoming traffic based on a set of rules. Application servers and web servers host content and applications, and a concentrator for a virtual private network encrypts traffic rather than filtering by policy.", 4], ["A security team notices an unusual forty-gigabyte upload leaving a finance workstation at two in the morning, while another analyst reviews thousands of connection attempts probing the web server from outside. Which pairing names the monitoring that reveals each?", ["Egress monitoring for both the upload and the probing", "Ingress monitoring for both the upload and the probing", "Ingress monitoring for the upload; egress monitoring for the probing", "Egress monitoring for the upload; ingress monitoring for the probing"], 3, "Egress monitoring watches outgoing network traffic, such as a large upload leaving the network, and ingress monitoring watches incoming traffic, such as probes arriving from outside.", 4], ["On the morning tickets go on sale, a flood of requests overwhelms a ticket site. Genuine buyers cannot complete purchases, although no data is stolen or altered. Which attack and objective best match?", ["Spoofing, affecting integrity", "Man-in-the-middle, affecting confidentiality", "Whaling, affecting non-repudiation", "Denial of service, affecting availability"], 3, "A denial of service prevents authorized access to resources or delays time-critical operations, which is a loss of availability. Nothing was intercepted, forged, or used to deceive a senior official.", 4], ["One attacker splits traffic so that a target cannot put the packets back together. Another sends a single packet far larger than the target can handle, crashing it. Which pairing is correct?", ["First: fragment attack; second: oversized packet attack", "First: spoofing; second: fragment attack", "First: oversized packet attack; second: spoofing", "First: oversized packet attack; second: fragment attack"], 0, "In a fragment attack the attacker fragments traffic so a system cannot reassemble the packets. An oversized packet attack purposely sends a packet larger than expected or larger than the receiver can handle, causing it to fail.", 4], ["On an open hotel network, an attacker silently relays a traveler's session to a banking site while reading and changing the messages. The traveler believes they are talking directly to the bank. Which attack is this?", ["Fragment attack, in which the adversary splits traffic so it cannot be reassembled", "Oversized packet attack, in which the adversary sends packets too large to process", "Denial of service, in which the adversary prevents authorized access to resources", "Man-in-the-middle, in which the adversary sits between user and system to intercept and alter data"], 3, "In a man-in-the-middle attack, the adversary positions himself between the user and the system so he can intercept and alter data traveling between them. The other attacks disrupt availability rather than relaying and modifying a session.", 4], ["Packets arrive at an internal server carrying the source address of a trusted management host, but they originate elsewhere, and the server accepts them. Which attack is this, and what does it fake?", ["Whaling, which fakes the identity of a senior executive in a request", "Man-in-the-middle, which fakes the receiving address of a transmission", "Bot control, which fakes the commands of a legitimate administrator", "Spoofing, which fakes the sending address of a transmission"], 3, "Spoofing is faking the sending address of a transmission to gain illegal entry into a secure system. Here the forged source address makes the server trust the packets. Whaling deceives senior officials through messages and does not forge packet addresses.", 4], ["The chief financial officer receives an urgent message, apparently from the chief executive officer, demanding a large wire to a new vendor. Which attack is this, and what makes it distinctive?", ["Ransomware, a lock placed on files aimed at users in order to force a payment", "Fragment attack, split traffic aimed at systems in order to prevent reassembly", "Whaling, a phishing attack aimed at highly placed officials to authorize large wire transfers", "Spoofing, a forged source address aimed at secure systems in order to gain entry"], 2, "Whaling attacks are phishing attacks that try to trick highly placed officials, or private individuals with sizable assets, into authorizing large wire transfers to previously unknown entities. The other options are technical attacks on addresses, files, or packets.", 4], ["A stranger in a delivery uniform follows an employee through a secured door, and later a caller posing as information technology staff asks an intern for her password. Which term covers both tactics?", ["Spoofing, which forges the sending address of a transmission to gain entry", "Social engineering, which manipulates people to infiltrate systems or buildings", "Insider threat, which uses authorized access to harm an information system", "Whaling, which targets highly placed officials for large wire transfers of funds"], 1, "Social engineering covers tactics to infiltrate systems by email, phone, text, or social media, often impersonating an authority. The glossary notes that a low-tech method is simply following someone into a secure building. Spoofing forges addresses, whaling targets senior officials, and an insider threat already has authorized access.", 4], ["Malicious code abuses a flaw to run on a server and then locks every shared file until a payment is made. Which pairing names the whole malware type and the part that locks the files?", ["Bot; the payload", "Ransomware; the exploit", "Bot; the threat vector", "Ransomware; the payload"], 3, "Ransomware is malicious software that locks files until money is paid. The payload is the primary action of a malicious code attack, here locking the files, while the exploit is the particular attack on the flaw that delivers it.", 4], ["Thousands of infected laptops quietly wait for commands and later flood a victim's website on an attacker's signal. Which term describes each infected laptop?", ["Threat actor, an individual or group that attempts to exploit vulnerabilities to cause a threat", "Bot, malicious code acting like a remotely controlled robot with other Trojan and worm capabilities", "Threat vector, the means by which a threat actor carries out their objectives against a target", "Payload, the primary action of a malicious code attack once it is running on a host"], 1, "A bot is malicious code that acts like a remotely controlled robot for an attacker, with other Trojan and worm capabilities. The laptops are controlled machines, not the attacker, the delivery means, or the action itself.", 4], ["A vendor learns attackers are using a flaw it never knew about, so no signature or patch exists. Which pairing names the flaw's status and the attacker's technique for using it?", ["Zero day vulnerability; an exploit", "Zero day vulnerability; a threat vector", "Zero day payload; a threat actor", "Zero day exploit; a vulnerability"], 0, "A zero day is a previously unknown vulnerability that does not fit recognized patterns or signatures, so it can be exploited without detection. An exploit is a particular attack that takes advantage of a vulnerability, which is the attacker's technique.", 4], ["A criminal gang sends emails with malicious attachments to employees. Which pairing of terms is correct?", ["The gang is the threat actor, and the email is the threat vector", "The gang is the threat actor, and the email is the payload", "The gang is the payload, and the email is the exploit", "The gang is the threat vector, and the email is the threat actor"], 0, "A threat actor is an individual or group that attempts to exploit vulnerabilities, and a threat vector is the means by which the actor carries out objectives. The malicious action inside the attachment would be the payload.", 4], ["A firm relies on one perimeter firewall. After an incident, it adds endpoint protection, authentication, staff training, and monitoring so several consecutive controls protect the asset. Which strategy is this, and what is its alternate name?", ["Microsegmentation, also called layered segmentation", "Defense in depth, also called layered defense", "Segregation of duties, also called separation of duties", "Zero trust, also called layered trust"], 1, "Defense in depth integrates people, technology, and operations to establish barriers across multiple layers, and layered defense is the same idea: multiple controls arranged in series. Separation of duties is a different principle, and the other pairings are not glossary synonyms.", 4], ["A company stops assuming internal devices are safe. Each workload sits in its own small zone guarded by firewalls, and every request is verified. Which pairing is correct?", ["Zero trust is the design belief; microsegmentation is a tool of it", "Zero trust is a tool of defense in depth; microsegmentation is a protocol", "Zero trust is the design belief; microsegmentation is a type of virtual private network", "Microsegmentation is the design belief; zero trust is a tool of it"], 0, "Zero trust removes the design belief that the network has any trusted space, managing security at the most granular asset. Microsegmentation, which breaks networks into very small zones using firewalls, is a tool of that model.", 4], ["A hospital runs cloud services inside its own firewall under its information technology team's control. Three agencies with shared compliance concerns jointly use another environment for their exclusive use, and a vendor offers a third to anyone. Which pairing is correct, in that order?", ["Public cloud; private cloud; community cloud", "Private cloud; community cloud; public cloud", "Community cloud; public cloud; private cloud", "Private cloud; public cloud; community cloud"], 1, "A private cloud is implemented within the corporate firewall under the control of the information technology department. A community cloud is provisioned for exclusive use by a specific community with shared concerns. A public cloud is provisioned for open use by the general public. These are all models of cloud computing, the on-demand shared pool of resources.", 4], ["One team rents virtual machines and installs its own operating system. A second builds applications in a provider's development environment before deploying them. A third uses a provider's finished email application through a browser. Which pairing is correct?", ["Software as a Service; Platform as a Service; Infrastructure as a Service", "Infrastructure as a Service; Platform as a Service; Software as a Service", "Platform as a Service; Infrastructure as a Service; Software as a Service", "Infrastructure as a Service; Software as a Service; Platform as a Service"], 1, "Infrastructure as a Service supplies core computing, storage, and network resources. Platform as a Service is the application development middleware environment. Software as a Service delivers the provider's finished applications through a browser or program interface.", 4], ["One machine hosts business applications that employees open from their workstations. Another provides World Wide Web services and only staff can reach it. Which pairing is correct?", ["Application server; web server, which may be called an intranet server when used internally", "Application server; application server, which may be called an intranet server when used internally", "Application server; web server, which may be called a public server when used internally", "Web server; application server, which may be called an intranet server when used internally"], 0, "An application server is a computer responsible for hosting applications to user workstations. A web server provides World Wide Web services, and if it is used internally and not by the public, it may be known as an intranet server.", 4], ["A food-delivery application charges cards by calling a payment provider's web service using a documented set of routines, standards, protocols, and tools. Which term describes this interface?", ["Application programming interface, a set of routines, standards, protocols, and tools for building software", "Web server, the computer that provides World Wide Web services including pages and site content", "Application server, the computer responsible for hosting applications to user workstations in a network", "Protocol, a set of rules for formats and procedures that control communication between systems"], 0, "An application programming interface is a set of routines, standards, protocols, and tools for building software applications to access a web-based application or tool. An application server hosts applications, a protocol governs communication rules, and a web server provides web content.", 4], ["With permission, an administrator opens a graphical tool to find every device attached to the office subnet and discover an unknown device. Which tool fits?", ["Zenmap, the graphical interface for the Nmap Security Scanner", "A token, a physical object used to authenticate a user", "A checksum, a digit used to detect errors in stored data", "A firewall, a device that filters incoming traffic by rule"], 0, "Zenmap is the graphical user interface for the Nmap Security Scanner, an open-source application that scans networks to determine everything that is connected. A firewall filters traffic, a checksum detects data errors, and a token authenticates a user.", 4], ["A manager must name three attacks: one overwhelms a service with traffic, one forges the sender address on packets, and one splits traffic so it cannot be reassembled. Which statement names them correctly, in order?", ["Denial of service, spoofing, fragment attack", "Fragment attack, denial of service, spoofing", "Denial of service, fragment attack, spoofing", "Spoofing, fragment attack, denial of service"], 0, "Denial of service prevents authorized access by overwhelming a resource, spoofing fakes the sending address, and a fragment attack fragments traffic so the system cannot reassemble the packets. The other orders mismatch the descriptions.", 4], ["A startup manages the operating system and applications on rented virtual machines, while another firm uses only a browser-based application and adjusts a few user settings. Which statement correctly assigns responsibility?", ["Both kinds of customers manage the operating system, and neither manages user settings", "Neither kind of customer manages the operating system, and both manage the network", "Infrastructure as a Service customers manage the operating system; Software as a Service customers manage only limited user settings", "Software as a Service customers manage the operating system; Infrastructure as a Service customers manage only limited user settings"], 2, "In Infrastructure as a Service the customer builds and deploys on the provider's core hardware and software, so it manages the operating system and above. In Software as a Service the customer does not manage the network, servers, operating systems, or storage, apart from limited user-specific application settings.", 4], ["Which statement about an application programming interface is accurate?", ["It is a physical device that filters incoming traffic according to a rule set at the edge of a network", "It is a computer that hosts a company's applications for its user workstations in the data center", "It is a set of routines, standards, protocols, and tools that software uses to access a web-based application", "It is a rule set that decides which users may open which files on a shared server in the office"], 2, "An application programming interface is a set of routines, standards, protocols, and tools for building software applications to access a web-based software application or web tool. A filtering device is a firewall, a hosting computer is an application server, and a rule set for file access is an access control mechanism.", 4], ["Which description fits an application server and not a web server?", ["A computer that provides World Wide Web services including its hardware and site content", "A computer used only inside the organization that may be called an intranet server", "A computer that filters incoming traffic against a configured set of rules", "A computer responsible for hosting applications to user workstations"], 3, "An application server is a computer responsible for hosting applications to user workstations. A web server provides World Wide Web services and, if used only internally, may be called an intranet server. Filtering traffic is a firewall's role.", 4], ["A file header reserves twenty-four bits for a counter. Using the common definition, how many bytes does that equal, and at which layer are the individual bits represented?", ["Three bytes, with bits represented at Layer 1 of the Open Systems Interconnection model", "Twelve bytes, with bits represented at Layer 2 of the Open Systems Interconnection model", "Twenty-four bytes, with bits represented at Layer 4 of the Open Systems Interconnection model", "Six bytes, with bits represented at Layer 3 of the Open Systems Interconnection model"], 0, "A byte most commonly consists of eight bits, so twenty-four bits equal three bytes. A bit is the most basic representation of data, at Layer 1 of the Open Systems Interconnection model.", 4], ["Which statement about packets is correct?", ["A packet represents data at Layer 7, where user programs request services from the network stack", "A packet represents data at Layer 4, where hosts establish and manage connections between each other", "A packet represents data at Layer 1, where signals are zeros and ones carried across a physical cable", "A packet represents data at Layer 3 of the Open Systems Interconnection model, where routers forward it between networks"], 3, "A packet is the representation of data at Layer 3 of the Open Systems Interconnection model, the network layer. Layer 1 deals with bits, Layer 4 with host-to-host transport, and Layer 7 with applications.", 4], ["How does a bot differ from a threat actor?", ["A bot is a weakness in a system that can be exploited; the threat actor is the party that discovers it", "A bot is the means by which an attack reaches its target; the threat actor is the code that runs afterward", "A bot is remotely controlled malicious code on a victim machine; the threat actor is the person or group commanding it", "A bot is the person or group commanding attacks; the threat actor is the code on a victim machine"], 2, "A bot is malicious code acting like a remotely controlled robot for an attacker, with other Trojan and worm capabilities. A threat actor is an individual or group that attempts to exploit vulnerabilities, so the two are different kinds of thing.", 4], ["Which transmission is a broadcast?", ["A server relaying mail to a single partner's mail gateway over the internet", "A host sending a message intended for one named recipient on the segment", "A host sending one message that every device on the network segment receives", "A host sending a file to one other host through an encrypted tunnel"], 2, "Broadcast transmission is a one-to-many, one-to-everyone form of sending internet traffic. The other options are one-to-one communications.", 4], ["Which feature set matches cloud computing in the glossary?", ["On-demand network access to a shared pool of configurable resources, rapidly provisioned with minimal management effort", "A set of rules and procedures that controls communication between two systems over a shared network", "A single physical data center operated entirely by the customer's own staff in the customer's own building", "Exclusive ownership of fixed hardware that is provisioned once and reconfigured manually by the customer's staff"], 0, "Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources that can be rapidly provisioned and released with minimal management effort or provider interaction.", 4], ["A developer hides a program's internal data and code from other parts of the program. A network engineer says the same word applies to wrapping data in headers. Which pairing is accurate?", ["Both are encapsulation; the opposite process in networking is de-encapsulation, where bundles are unpacked", "Software hiding is encapsulation; networking wrapping is encryption, and the opposite is decryption", "Both are de-encapsulation; the opposite process in networking is encapsulation, where bundles are unpacked", "Software hiding is fragmentation; networking wrapping is encapsulation, and the opposite is reassembly"], 0, "Encapsulation is data hiding and code hiding in software, and also taking data and packaging or hiding it in another data structure, as in network protocols. De-encapsulation is the opposite process, in which bundles of data are unpacked or revealed.", 4], ["Which scenario does NOT reflect defense in depth?", ["A company adds endpoint protection, authentication, and staff training behind its firewall", "A company stacks physical, technical, and administrative controls around its data center", "A company adds monitoring in the network, on hosts, and on user accounts", "A company relies entirely on one strong perimeter firewall and removes other controls to save cost"], 3, "Defense in depth, also called layered defense, uses multiple controls arranged in series across people, technology, and operations. A single control, however strong, is a single layer. The other scenarios stack several different types of control.", 4], ["A user cannot reach any website by name, though testing an address directly works. An administrator says 'the Domain Name Service is failing.' Which statement is most accurate?", ["The failure must be in the physical server, since the term refers only to hardware in the data center", "The failure must be in the service, since the term refers only to software running on a single host", "The failure must be in the protocol, since the term refers only to a rule set for communication", "The failure may be in the service, the physical server, or the protocol, since the term refers to all three"], 3, "Domain Name Service can refer to three interrelated elements: a service, a physical server, and a network protocol. Troubleshooting must determine which element is failing.", 4], ["Which finding would egress monitoring most likely reveal?", ["A failed login attempt arriving from an outside address against the remote access portal", "A workstation sending large volumes of data to an unknown outside address", "A scan probing many ports on the public web server from an address outside the company's network", "A flood of requests arriving at the public web server from many different outside addresses"], 1, "Egress monitoring is monitoring of outgoing network traffic, so unusual outbound transfers show up there. Probes, failed logins, and floods arriving from outside are seen through ingress monitoring, the monitoring of incoming traffic.", 4], ["Which statement correctly relates an exploit to a vulnerability?", ["An exploit is the weakness in a system, and a vulnerability is the attack that uses it", "An exploit is the primary action of malicious code, and a vulnerability is the delivery method", "An exploit is the means by which an attacker reaches a target, and a vulnerability is the attacker", "An exploit is a particular attack that takes advantage of a vulnerability, which is the weakness"], 3, "An exploit is a particular attack, named because it exploits system vulnerabilities. A vulnerability is the weakness. The primary action of malicious code is the payload, and the means of reaching a target is the threat vector.", 4], ["Why is a zero day particularly hard to defend against?", ["It is always delivered by an insider who already holds authorized access to the system and its administration tools", "It is previously unknown and does not fit recognized patterns, signatures, or methods, so detection and prevention may fail", "It is always a misconfiguration that auditors failed to include in a baseline during their last review", "It is always a flaw in the physical hardware that cannot be corrected by any software change or update"], 1, "A zero day is a previously unknown system vulnerability with the potential of exploitation without risk of detection or prevention because it does not generally fit recognized patterns, signatures, or methods. It need not involve insiders, hardware, or baselines.", 4], ["A contractor can upload files to the company's web host, but cannot send email from the same account. Which statement identifies what works and what is at issue?", ["File Transfer Protocol works; the problem lies with Simple Mail Transport Protocol", "Internet Control Message Protocol works; the problem lies with File Transfer Protocol", "File Transfer Protocol works; the problem lies with Internet Control Message Protocol", "Simple Mail Transport Protocol works; the problem lies with File Transfer Protocol"], 0, "File Transfer Protocol is used to transfer files between hosts, and Simple Mail Transport Protocol is the standard for sending and receiving email. Uploads working indicates the first, and failing email points to the second.", 4], ["Which action matches how a firewall enforces policy?", ["Recording every user activity in a log for later review by analysts", "Verifying each user's identity through a second authentication factor", "Comparing each incoming connection with configured rules and allowing or denying it", "Encrypting each connection from end to end between the two communicating hosts"], 2, "Firewalls are devices that enforce administrative security policies by filtering incoming traffic based on a set of rules. Encryption, authentication, and logging are other controls.", 4], ["A student reads a document that defines how Internet Protocol, Transport Control Protocol, and Domain Name Service work, produced by network designers, operators, vendors, and researchers through consensus. Which organization published it?", ["International Organization of Standards", "Institute of Electrical and Electronics Engineers", "National Institute of Standards and Technology", "Internet Engineering Task Force"], 3, "The Internet Engineering Task Force is the Internet standards organization of network designers, operators, vendors, and researchers that defines protocol standards through collaboration and consensus. The other organizations set standards in engineering, international, or federal contexts.", 4], ["A technician sends a test message to see whether a printer on another network answers. Which protocol is involved, and which organization standardized it?", ["Internet Control Message Protocol, standardized by the Internet Engineering Task Force in Request for Comments 792", "Internet Protocol, standardized by the National Institute of Standards and Technology in Request for Comments 792", "File Transfer Protocol, standardized by the Institute of Electrical and Electronics Engineers in Request for Comments 792", "Simple Mail Transport Protocol, standardized by the International Organization of Standards in Request for Comments 792"], 0, "The Internet Control Message Protocol is an Internet Protocol network protocol standardized by the Internet Engineering Task Force through Request for Comments 792 to determine whether a particular service or host is available.", 4], ["Two networks fail to exchange traffic. An engineer inspects the layer that provides network-to-network communication. Which pairing is correct?", ["The Application layer, where Internet Protocol delivers data directly to user programs on the host", "The Internet layer of the Transport Control Protocol/Internet Protocol model, where Internet Protocol operates", "The Transport layer, where Internet Protocol provides channels for connections between two hosts", "The Link layer, where Internet Protocol carries physical signals between neighboring devices on a cable"], 1, "The Internet layer provides network-to-network communication, and Internet Protocol is the standard for transmitting data from source to destinations across packet-switched networks. The Link layer is physical communications and the Transport layer provides channels between hosts.", 4], ["Which description of the attacker's position in a man-in-the-middle attack is accurate?", ["At the system's database, able to copy the stored backups made by the administrator only", "On the user's own device only, able to read the files that are stored there by the user", "Between the user and the system, able to intercept and alter data traveling between them", "On a separate network, able to flood the system with traffic until it can no longer respond"], 2, "In a man-in-the-middle attack, the adversary positions himself between the user and the system so he can intercept and alter data traveling between them. The other positions describe malware on a device, a data theft, or a flood.", 4], ["After a breach, investigators learn the company's network was one large zone, and attackers moved freely between servers. Which change best addresses that weakness?", ["Microsegmentation, breaking the network into very small zones with firewalls or similar controls", "Encapsulation, so that each message is wrapped in additional headers while moving across the network", "Broadcasting, so that every device can see all traffic and detect unusual movement quickly", "Spoofing, so that internal addresses are changed regularly to confuse any attackers inside the network"], 0, "Microsegmentation breaks networks into very small, highly localized zones, at the limit placing a firewall at every connection point, and is a tool of zero trust. It limits how far an attacker can move once inside.", 4], ["Which statement describes an oversized packet attack and distinguishes it from a fragment attack?", ["It floods the receiver with requests, whereas a fragment attack forges the sending address of each packet", "It sends a packet larger than expected or than the receiver can handle, whereas a fragment attack splits traffic so it cannot be reassembled", "It splits traffic so it cannot be reassembled, whereas a fragment attack sends a packet larger than the receiver can handle", "It forges the sending address of packets, whereas a fragment attack sends a packet larger than the receiver expects"], 1, "An oversized packet attack sends a packet larger than expected, or larger than the receiving system can handle, causing it to fail. A fragment attack fragments traffic so a system cannot put the data packets back together.", 4], ["Which statement is true of ransomware?", ["It forges the sending address of packets to gain entry into a secure system", "It quietly waits for commands from an attacker as part of a larger group of machines", "It splits traffic so that a system cannot reassemble it", "It locks the screen or files so that access is limited until money is paid"], 3, "Ransomware is a type of malicious software that locks the computer screen or files, preventing or limiting access to the system and data until money is paid. The other options describe a bot, spoofing, and a fragment attack.", 4], ["Why do two systems from different vendors need a shared protocol to communicate?", ["A protocol is a malicious program that opens a channel between the systems", "A protocol is a physical medium that carries signals between two systems", "A protocol is a hardware device that translates between different vendors' systems", "A protocol is a set of formats and procedures that controls communication between systems"], 3, "Protocols are sets of rules, including formats and procedures, to implement and control communication between systems. Without agreed rules, systems cannot interpret each other's messages.", 4], ["Which attack is whaling rather than generic social engineering?", ["A text message offers a gift card in exchange for the recipient's login credentials to the company portal", "A message impersonating the chief executive asks the chief financial officer for a large wire to a new payee", "A caller posing as technical support asks a clerk for a password in order to fix a problem on her account", "A visitor in a delivery uniform follows an employee through a secured door without presenting any badge"], 1, "Whaling attacks are phishing attacks aimed at highly placed officials or individuals with sizable assets to authorize large wire transfers to previously unknown entities. The other examples are broader social engineering tactics.", 4], ["Which statement is correct about spoofing?", ["It positions an adversary between user and system to intercept and alter the data traveling between them", "It fakes the sending address of a transmission to gain illegal entry into a secure system", "It splits traffic so that a system cannot reassemble the packets it receives from the sender", "It locks files until money is paid to the attacker who controls the encryption key"], 1, "Spoofing is faking the sending address of a transmission to gain illegal entry. The other options describe a fragment attack, a man-in-the-middle attack, and ransomware.", 4], ["A group takes over accounts by guessing a weak password on an exposed remote login. Which pairing is correct?", ["The exposed remote login is the payload; the group is the exploit", "The exposed remote login is the threat vector; the group is the threat actor", "The exposed remote login is the threat actor; the group is the threat vector", "The exposed remote login is the exploit; the group is the vulnerability"], 1, "A threat actor is an individual or group that attempts to exploit vulnerabilities, and a threat vector is the means by which the actor carries out objectives. The weak login is the route, and the group is the party using it.", 4], ["Which pairing matches each technology to its main property?", ["Virtual local area network: logical grouping; virtual private network: radio-based network; wireless area network: secure transmission", "Virtual local area network: radio-based network; virtual private network: logical grouping; wireless area network: secure transmission", "Virtual local area network: secure transmission across networks; virtual private network: logical grouping; wireless area network: radio-based network", "Virtual local area network: logical grouping; virtual private network: secure transmission across networks; wireless area network: radio-based network"], 3, "A virtual local area network is a logical group of devices that appear on the same local network, a virtual private network provides a secure communications mechanism across networks, and a wireless area network is based on radio transmissions.", 4], ["Which action is an appropriate use of Zenmap?", ["Scanning a network you are authorized to assess to discover which devices are connected", "Scanning a partner's network to see what is connected, without telling the partner about the scan", "Filtering inbound connections according to a configured rule set at the edge of the corporate network", "Encrypting traffic between two remote offices of the company over the public internet each night"], 0, "Zenmap is the graphical interface for the Nmap Security Scanner, an application that scans networks to determine everything that is connected. Appropriate use requires authorization. Encrypting traffic and filtering connections are functions of other tools.", 4], ["Which statement reflects zero trust?", ["Trust is established once at login and is never reassessed afterward during the rest of the session", "Devices inside the perimeter are trusted until they behave suspiciously in the monitoring system", "The network has no trusted space, so security is managed at each level down to the most granular asset", "Only external users are verified, because internal users are employees who have already been vetted"], 2, "Zero trust removes the design belief that the network has any trusted space, managing security at each possible level, down to the most granular asset. Microsegmentation of workloads is a tool of the model.", 4], ["A team wants no responsibility for patching operating systems or runtime software but still wants to deploy its own code. Which model fits best?", ["Community cloud", "Platform as a Service", "Infrastructure as a Service", "Software as a Service"], 1, "Platform as a Service provides the application development middleware environment where applications are built before deployment. Infrastructure as a Service leaves the operating system to the customer, and Software as a Service delivers finished applications rather than a place to deploy code.", 4], ["A consortium of three universities with the same compliance duties wants its own shared cloud. Which model fits, and who may operate it?", ["Public cloud, which may be operated only by a third party on its own premises", "Community cloud, which may be operated by one or more members, a third party, or a combination", "Private cloud, which may be operated only inside one organization's own firewall", "Public cloud, which may be operated only by a business, academic, or government organization"], 1, "A community cloud is provisioned for exclusive use by a specific community with shared concerns and may be owned, managed, and operated by one or more of the organizations, a third party, or both, on or off premises. A private cloud serves one organization and a public cloud serves the general public.", 4], ["Which statement is accurate about a denial of service?", ["It prevents authorized access to resources or delays time-critical operations, measured in milliseconds or hours", "It intercepts data between a user and a system and alters it before the data is delivered onward", "It forges the identity of a senior executive to authorize a large transfer of funds to a new payee", "It exploits a previously unknown vulnerability that fits no recognized signature in the defenders' tools"], 0, "A denial of service prevents authorized access to resources or delays time-critical operations, with time-critical possibly meaning milliseconds or hours depending on the service. The other options describe a man-in-the-middle attack, whaling, and a zero day.", 4], ["Which feature identifies a public cloud?", ["It is provisioned only for a single consumer's workloads on dedicated hardware", "It is provisioned for exclusive use by organizations that share compliance concerns", "It is implemented within a corporate firewall under the control of one information technology department", "It is provisioned for open use by the general public and exists on the premises of the cloud provider"], 3, "A public cloud is infrastructure provisioned for open use by the general public, owned, managed, and operated by a business, academic, or government organization, and existing on the provider's premises. A community cloud serves a specific community, and a private cloud sits within the corporate firewall.", 4], ["Malware arrives by a phishing email, uses a flaw to run on a workstation, and then copies the files it finds to an outside server. A responder labels each step. Which label fits the copying of the files?", ["The threat vector, the means by which the actor carries out objectives", "The threat actor, the individual or group attempting to exploit weaknesses", "The exploit, the particular attack that takes advantage of a vulnerability", "The payload, the primary action of the malicious code attack"], 3, "The payload is the primary action of a malicious code attack, which here is copying the files out. The phishing email is the threat vector, the use of the flaw is the exploit, and the party behind the attack is the threat actor.", 4]], "5": [["A clinician's notes are readable on screen. A tool converts them into an unreadable form before they cross the network, and the receiving clinician's system converts them back. Which sequence names the data forms and operations correctly?", ["Plaintext, encryption into ciphertext, then decryption back into plaintext", "Plaintext, decryption into ciphertext, then encryption back into plaintext", "Ciphertext, decryption into plaintext, then encryption back into ciphertext", "Ciphertext, encryption into plaintext, then decryption back into ciphertext"], 0, "Plaintext is a message in its natural, readable form. To encrypt is to protect information by putting it into a form only permitted people can read, and encryption is the act of converting plaintext into ciphertext. Decryption is the reverse process, converting ciphertext back into plaintext with the appropriate key.", 5], ["Two branch offices share one secret key that both encrypts and decrypts their backups. A partner who has never met them sends a file protected with a key that only the branches' separate private key can open. Which pairing is correct?", ["Branch offices: symmetric encryption; partner: asymmetric encryption", "Branch offices: asymmetric encryption; partner: asymmetric encryption", "Branch offices: asymmetric encryption; partner: symmetric encryption", "Branch offices: symmetric encryption; partner: symmetric encryption"], 0, "Symmetric encryption uses the same key for encryption and decryption. Asymmetric encryption uses one key to encrypt and a different key to decrypt, which lets strangers send protected data without sharing a secret in advance.", 5], ["An assessor reports that a company's cipher is strong, but keys are kept on sticky notes and nobody owns the procedures for key changes. Which glossary concept explains why the assessor still rates the arrangement weak?", ["Message digest, a value that changes completely when even a single bit of the data changes", "Encryption system, the total set of algorithms, processes, hardware, software, and procedures providing encryption and decryption", "Plaintext handling, the practice of keeping messages in their natural readable format for staff", "Cryptography, the study of methods that secure or protect the meaning and content of messages"], 1, "An encryption system is the total set of algorithms, processes, hardware, software, and procedures that together provide an encryption and decryption capability. Weak key handling undermines the whole system even when the algorithm is strong.", 5], ["One researcher designs a new method that disguises the content of messages. Another studies it and finds that a library implements it with predictable keys. Which pairing is correct?", ["Designer's work: cryptanalysis; second researcher: cryptographer", "Designer's work: cryptography; second researcher: cryptanalyst", "Designer's work: encryption system; second researcher: threat actor", "Designer's work: cryptography; second researcher: auditor"], 1, "Cryptography is the study or application of methods to secure the meaning and content of information, usually by disguise or transformation. A cryptanalyst studies techniques to defeat cryptography, including errors or weaknesses in implementations of an algorithm.", 5], ["A backup tool computes a digit from a file's contents before and after copying to detect errors. A vendor publishes a value for its installer that would be completely different if even one bit changed. Which pairing is correct?", ["Both values are message digests used to encrypt the file", "The backup value is a checksum; the vendor's value is a message digest", "The backup value is a message digest; the vendor's value is a checksum", "Both values are checksums used to authenticate the sender"], 1, "A checksum is a digit representing the sum of the correct digits in data, compared later to detect errors. A message digest uniquely identifies data and changes completely if a single bit changes. Neither one authenticates a sender or encrypts content.", 5], ["A supplier signs a contract with a cryptographic transformation of its data. The buyer wants to know which services a properly implemented signature provides beyond showing the contract changed.", ["Data integrity, compression, and signer authorization", "Origin authentication, confidentiality, and signer anonymity", "Confidentiality, data integrity, and signer availability", "Origin authentication, data integrity, and signer non-repudiation"], 3, "A digital signature, when properly implemented, provides origin authentication, data integrity, and signer non-repudiation. It does not hide content or provide availability.", 5], ["A product roadmap is marked 'Secret' on every page. Its owner calls it extremely important to protect, and security determines how much harm would result if it reached a competitor. Which pairing is correct?", ["Marked 'Secret': classified or sensitive information; owner's judgment: sensitivity; harm assessment: classification", "Marked 'Secret': sensitivity; owner's judgment: classification; harm assessment: classified information", "Marked 'Secret': classification; owner's judgment: criticality; harm assessment: sensitivity", "Marked 'Secret': classified information; owner's judgment: classification; harm assessment: sensitivity"], 0, "Classified or sensitive information is determined to require protection and is marked with its level in documentary form. Sensitivity is the importance the owner assigns for protection, and classification identifies the degree of harm if it is divulged, focused on confidentiality.", 5], ["An employee tries to email a spreadsheet of customer card numbers to a personal address. The company's gateway recognizes the content and blocks the message. Which capability is this?", ["Logging, which only records user activities in a log for later review by analysts", "Egress monitoring, which only observes outgoing network traffic without blocking any of it", "Data loss prevention, which detects and prevents unauthorized use and transmission of information", "Audit, which independently reviews records and activities to assess adequacy of controls"], 2, "Data loss prevention is a set of system capabilities designed to detect and prevent the unauthorized use and transmission of information. Egress monitoring observes outgoing traffic, logging records events, and audit reviews them later.", 5], ["Before returning leased magnetic tapes, a company exposes them to a strong magnetic field. A buyer of old drives that were only deleted later recovers fragments. Which pairing names the technique and the leftover problem?", ["Degaussing; remanence", "Degaussing; classification", "Remanence; degaussing", "Encryption; remanence"], 0, "Degaussing erases disks or tapes so there is insufficient magnetic remanence to reconstruct data. Remanence is residual information remaining on storage media after clearing, which is why simply deleting files is not enough.", 5], ["A reviewer asks for evidence that quarterly access reviews happened. The team supplies signed review forms and system-generated reports, then a policy destroys them after seven years. Which pairing is correct?", ["The artifacts are baselines; keeping then destroying them is degaussing", "The artifacts are logs; keeping then destroying them is remanence", "The artifacts are records; keeping then destroying them is records retention", "The artifacts are payloads; keeping then destroying them is classification"], 2, "Records are recordings of evidence of activities performed or results achieved, such as forms, reports, and test results. Records retention is the practice of keeping records as long as necessary and then destroying them after the appropriate interval.", 5], ["A server records every login, file access, and configuration change. An analyst reviewing the entries notices an employee who works days logging in repeatedly at three in the morning. Which pairing is correct?", ["The collected entries come from logging; the irregularity is a log anomaly", "The collected entries come from a baseline; the irregularity is a state", "The collected entries come from a log anomaly; the irregularity is logging", "The collected entries come from records retention; the irregularity is remanence"], 0, "Logging is collecting and storing user activities in a log, a record of events in systems and networks. A log anomaly is a system irregularity identified when studying log entries that could represent events of interest for further surveillance.", 5], ["An analyst in a centralized team watches events on the network, notices repeated failed logins from an unfamiliar location, and blocks the source before an account is compromised. Which function is this?", ["Governance committee, which sets the roles and policies for security decisions in the organization", "Change advisory board, which approves requests for change before they are deployed to systems", "Security operations center, which monitors, detects, and analyzes events to resolve issues before disruption", "Records office, which retains and destroys records on a schedule set by policy"], 2, "A security operations center is a centralized function that monitors, detects, and analyzes events to prevent and resolve issues before they cause business disruption. The other bodies approve changes, manage records, or set policy.", 5], ["A vendor ships a small update that fixes a flaw in a program without changing the program's version number. The administrator tests it, deploys it across servers, and verifies installation. Which pairing is correct?", ["The update is a patch; the process is patch management", "The update is an exploit; the process is incident response", "The update is a baseline; the process is configuration management", "The update is a patch; the process is records retention"], 0, "A patch modifies files or settings of another software component without changing its version number. Patch management is the systematic notification, identification, deployment, installation, and verification of software code revisions.", 5], ["A server that falls below the
