p-by-step approach for categorizing systems, selecting controls, and monitoring them. That structured approach is a risk management framework.", 1], ["Risk Mitigation", "Putting security controls in place to reduce the possible impact and/or likelihood of a specific risk.", "After finding weak passwords, a company enables multi-factor authentication and account lockout. The controls reduce the likelihood of compromise, which is mitigation.", 1], ["Risk Tolerance", "The level of risk an entity is willing to assume in order to achieve a potential desired result.", "Executives say no single risk category may cost more than $50,000 per year. That ceiling expresses the organization's risk tolerance and guides which risks need treatment.", 1], ["Risk threshold, risk appetite and acceptable risk", "Are also terms used synonymously with risk tolerance.", "A board approves a statement of 'risk appetite' for cyber losses. Whether it's called appetite, threshold, or acceptable risk, it describes the same idea as risk tolerance.", 1], ["Risk Transference", "Paying an external party to accept the financial impact of a given risk.", "A merchant buys a cyber insurance policy that covers breach costs. The insurer bears the financial impact, but the merchant must still manage the underlying risk.", 1], ["Risk Treatment", "The determination of the best way to address an identified risk.", "After assessing a risk, the team compares mitigating it, transferring it, avoiding it, or accepting it, and picks the best response. That decision-making is risk treatment.", 1], ["Role-Based Access Control", "An access control system that sets up user permissions based on roles.", "When a nurse is promoted to supervisor, an administrator moves her to the Supervisor group and her permissions change automatically. Access follows the role, not individual settings.", 3], ["Rule", "An instruction developed to allow or deny access to a system by comparing the validated identity of the subject to an access control list.", "An access control list says only members of Finance may open the budget file. The rule compares each requester's validated identity against that list and allows or denies access.", 3], ["Security Controls", "The management, operational and technical controls (that is, safeguards or countermeasures) prescribed for an information system to protect the confidentiality, integrity and availability of the system and its information. Source: Federal Information Processing Standards Publication 199", "An organization's control catalog includes policies, guard procedures, firewalls, and encryption. Together these safeguards protect confidentiality, integrity, and availability.", 1], ["Security Governance", "The entirety of the policies, roles and processes the organization uses to make security decisions in an organization.", "An organization defines who may accept security risk, how policies are approved, and who is responsible for incidents. These structures are its security governance.", 1], ["Security Operations Center", "A centralized organizational function fulfilled by an information security team that monitors, detects and analyzes events on the network or system to prevent and resolve issues before they result in business disruptions.", "An analyst in the security operations center sees repeated failed logins from an unfamiliar country, investigates, and blocks the source before an account is compromised. Centralized monitoring and analysis is the security operations center's role.", 5], ["Segregation of Duties", "The practice of ensuring that an organizational process cannot be completed by a single person; forces collusion as a means to reduce insider threats. Also commonly known as Separation of Duties.", "One employee can't both create and approve a vendor payment. A fraud would require two people to cooperate, which makes it harder and less likely.", 3], ["Sensitivity", "A measure of the importance assigned to information by its owner, for the purpose of denoting its need for protection. Source: National Institute of Standards and Technology Special Publication 800-60 Volume 1 Revision 1", "The owner of a product roadmap declares it highly sensitive because its release would hurt the company. That importance label guides how strongly it's protected.", 5], ["Simple Mail Transport Protocol", "The standard communication protocol for sending and receiving emails between senders and receivers.", "When you send an email, your mail server uses Simple Mail Transport Protocol to hand the message to the recipient's mail server. Without a common protocol like Simple Mail Transport Protocol, different mail systems couldn't exchange messages.", 4], ["Single-Factor Authentication", "Use of just one of the three available factors (something you know, something you have, something you are) to carry out the authentication process being requested.", "A system requires only a password. Even a very long password is one factor, so if it is stolen, an attacker can log in. Adding a token would make it multi-factor.", 1], ["Social Engineering", "Tactics to infiltrate systems via email, phone, text, or social media, often impersonating a person or agency in authority or offering a gift. A low-tech method would be simply following someone into a secure building.", "A caller says they're from information technology and asks an intern for her password to fix a problem. No technical exploit is needed; the attacker relies on manipulating the person.", 4], ["Software", "Computer programs and associated data that may be dynamically written or modified during execution. National Institute of Standards and Technology Special Publication 80-37 Revision 2", "A spreadsheet program and the files it creates change as people use it. The program and its associated data, which can be modified while running, are software.", 5], ["Software as a Service", "The cloud customer uses the cloud provider’s applications running within a cloud infrastructure. The applications are accessible from various client devices through either a thin client interface, such as a web browser or a program interface. The consumer does not manage or control the underlying cloud infrastructure including network, servers, operating systems, storage, or even individual application capabilities, with the possible exception of limited user-specific application configuration settings. Derived from National Institute of Standards and Technology 800-145", "A company uses a provider's web-based email. Employees adjust their own settings, but the provider operates and patches everything underneath.", 4], ["Spoofing", "Faking the sending address of a transmission to gain illegal entry into a secure system. Committee on National Security Systems Instruction 4009-2015", "An attacker sends packets whose source address appears to belong to a trusted internal host. The target accepts them because it believes they come from someone it trusts.", 4], ["State", "The condition an entity is in at a point in time.", "A forensic analyst records exactly what is running on a compromised server at 14:02 before shutting it down. That snapshot captures the system's state at that moment.", 5], ["Subject", "Generally an individual, process or device causing information to flow among objects or change to the system state. Source: National Institute of Standards and Technology Special Publication 800-53 Revision 4", "A user opens a spreadsheet. The user (or the program acting for them) is the subject, and the spreadsheet is the object being accessed.", 3], ["Symmetric Encryption", "An algorithm that uses the same key in both the encryption and the decryption processes.", "Two colleagues agree on a shared secret key and use it to encrypt and decrypt backup files. The challenge is getting that single key to both parties safely.", 5], ["System Integrity", "The quality that a system has when it performs its intended function in an unimpaired manner, free from unauthorized manipulation of the system, whether intentional or accidental. Source: National Institute of Standards and Technology Special Publication 800-27 Revision A", "Malware modifies an operating system so security tools report false results. The system no longer behaves as intended, so system integrity has been lost.", 1], ["Technical Controls", "The security controls (that is, safeguards or countermeasures) for an information system that are primarily implemented and executed by the information system through mechanisms contained in the hardware, software or firmware components of the system.", "Account lockout after five failed logins is enforced by the system itself, with no person involved. That system-executed protection is a technical control.", 1], ["Threat", "Any circumstance or event with the potential to adversely impact organizational operations (including mission, functions, image or reputation), organizational assets, individuals, other organizations or the nation through an information system via unauthorized access, destruction, disclosure, modification of information and/or denial of service. Source: National Institute of Standards and Technology Special Publication 800-30 Revision 1", "A forecast hurricane near a data center and a criminal group targeting a bank are both threats, because each is a circumstance with the potential to cause harm.", 1], ["Threat Actor", "An individual or a group that attempts to exploit vulnerabilities to cause or force a threat to occur.", "A criminal gang that sends phishing emails to steal credentials is a threat actor. It is the party trying to exploit weaknesses.", 4], ["Threat Vector", "The means by which a threat actor carries out their objectives.", "The gang's phishing email is the vector that delivers the malware. The gang is the actor and the email is how the attack reaches its target.", 4], ["Token", "A physical object a user possesses and controls that is used to authenticate the user’s identity. National Institute of Standards and Technology Interagency or Internal Report 7711", "An employee logs in with a password and a hardware key fob. The fob is a token, something the user has, which adds a second factor to the login.", 1], ["Transport Control Protocol/Internet Protocol Model", "Internet working protocol model created by the Internet Engineering Task Force, which specifies four layers of functionality: Link layer (physical communications), Internet Layer (network-to-network communication), Transport Layer (basic channels for connections and connectionless exchange of data between hosts), and Application Layer, where other protocols and user applications programs make use of network services.", "When a web page loads, the Application layer requests it, the Transport layer carries the conversation between hosts, the Internet layer routes packets between networks, and the Link layer moves bits across the local medium.", 4], ["Turnstile", "A one-way spinning door or barrier that allows only one person at a time to enter a building or pass through an area.", "A company lobby uses a rotating turnstile so each employee must badge in individually. Coworkers can't easily walk in together on one badge.", 3], ["Unix", "An operating system used in software development.", "A development team compiles and tests code on a Unix system. As with any operating system, it must be hardened and patched before holding sensitive work.", 5], ["User Provisioning", "The process of creating, maintaining and deactivating user identities on a system.", "Human resources approves a new hire, information technology creates accounts, permissions change when the employee moves departments, and accounts are disabled on departure. That whole lifecycle is user provisioning.", 3], ["Virtual Local Area Network", "A logical group of workstations, servers, and network devices that appear to be on the same local area network despite their geographical distribution.", "Staff in two buildings need to appear on one network, separate from the guest network. The administrator groups their devices into a virtual local area network, isolating them logically.", 4], ["Virtual Private Network", "A virtual private network, built on top of existing networks, that can provide a secure communications mechanism for transmission between networks.", "A remote employee connects from a coffee shop. The virtual private network creates an encrypted tunnel over the public internet to the company network, protecting data from eavesdroppers.", 4], ["Vulnerability", "Weakness in an information system, system security procedures, internal controls or implementation that could be exploited by a threat source. Source: National Institute of Standards and Technology Special Publication 800-128", "An administrator never wrote a process to remove vendor accounts after contracts end. That procedural gap is a vulnerability, just as an unpatched flaw would be.", 1], ["Web Server", "A computer that provides World Wide Web services on the Internet. It includes the hardware, operating system, Web server software, and Web site content (Web pages). If the Web server is used internally and not by the public, it may be known as an “intranet server.” National Institute of Standards and Technology Special Publication 800-44 Version 2", "A company's public website runs on a web server, while its internal human resources portal runs on a server only employees can reach. The second is an intranet server.", 4], ["Whaling Attack", "Phishing attacks that attempt to trick highly placed officials or private individuals with sizable assets into authorizing large fund wire transfers to previously unknown entities.", "The chief financial officer receives a convincing message that appears to come from the chief executive officer, demanding an urgent wire to a new vendor. Because the target is a senior official and the goal is a large transfer, it's whaling.", 4], ["Wireless Area Network", "A group of computers and devices that are located in the same vicinity, forming a network based on radio transmissions rather than wired connections. A Wi-Fi network is a type of Wireless Area Network.", "An office provides Wi-Fi so laptops and phones connect without cables. That radio-based local network is a Wireless Area Network, which needs strong encryption since signals can be intercepted.", 4], ["Zenmap", "The graphical user interface for the Nmap Security Scanner, an open-source application that scans networks to determine everything that is connected as well as other information.", "With permission, a network administrator uses Zenmap to scan the office subnet and discover every connected device, including an unknown device that shouldn't be there.", 4], ["Zero Day", "A previously unknown system vulnerability with the potential of exploitation without risk of detection or prevention because it does not, in general, fit recognized patterns, signatures or methods.", "Attackers exploit a flaw that the vendor hasn't discovered, so no patch or signature exists. Defenders rely on layered controls and monitoring until a fix is available.", 4], ["Zero Trust", "Removing the design belief that the network has any trusted space. Security is managed at each possible level, representing the most granular asset. Microsegmentation of workloads is a tool of the model.", "A company stops assuming internal devices are safe. Every request is verified and each workload sits in a micro-segment, so an attacker who gets inside can't roam freely.", 4]];
const app=document.getElementById("app");
const DN=["","Security Principles","Business Continuity, Disaster Recovery & Incident Response","Access Controls","Network Security","Security Operations"];
const WT=[0,.26,.10,.22,.24,.18];
let st=null,HIDE=false,MEM={},POOL=null,GL=null;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hk(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)}
function store(){try{const v=localStorage.getItem("ccr");return v?JSON.parse(v):MEM}catch(e){return MEM}}
function save(o){MEM=o;try{localStorage.setItem("ccr",JSON.stringify(o))}catch(e){}}
function rec(q,ok){if(!q[4])return;const o=store();o[hk(q[0])]=[ok?1:0,q[4],Date.now()];save(o)}
function pool(){if(POOL)return POOL;POOL={};["master","exam","hardexam","dq1","dq2","dq3","dq4","dq5"].forEach(k=>SETS[k].q.forEach(q=>{POOL[hk(q[0])]=q[4]}));return POOL}
function ready(){const P=pool(),o=store(),av=[0,0,0,0,0,0],an=[0,0,0,0,0,0],co=[0,0,0,0,0,0],ev=[];
Object.keys(P).forEach(k=>av[P[k]]++);
Object.keys(o).forEach(k=>{if(P[k]!==undefined){const d=P[k];an[d]++;co[d]+=o[k][0];ev.push(o[k])}});
ev.sort((a,b)=>a[2]-b[2]);
const acc=[null,null,null,null,null,null];let ws=0,sc=0,have=0;
for(let d=1;d<=5;d++){if(an[d]>=10){acc[d]=co[d]/an[d];ws+=WT[d];sc+=WT[d]*acc[d];have++}}
const tot=an.reduce((a,b)=>a+b,0),tav=av.reduce((a,b)=>a+b,0),rc=ev.slice(-30);
return{av,an,acc,have,overall:ws?sc/ws:null,cov:tav?tot/tav:0,tot,tav,recent:rc.length>=10?rc.reduce((a,e)=>a+e[0],0)/rc.length:null}}
function readyHTML(){const r=ready();
let head,label="";
if(r.overall===null){head='<b>Readiness:</b> not enough data yet';}
else{const p=r.overall*100;label=p>=75?"Exam ready":p>=65?"Almost ready":p>=55?"Building":"Not ready yet";
head=`<b>Readiness:</b> <span class="big">${Math.round(p)}%</span> ${label}`+(r.have<5?` (preliminary)`:"")}
let body='<p class="rn">Based on your most recent answer to each question across the Master set, both simulated exams, and the domain quizzes, weighted by the exam domain weights. These sets run harder than the real exam, so about 75 percent or more here is a good sign. This is an estimate, not a prediction of your real score.</p>';
if(r.overall===null)body+='<p>Answer at least 10 questions in a domain to see that domain\'s score and an overall estimate.</p>';
let weak=null;
for(let d=1;d<=5;d++){const a=r.acc[d];
body+=`<div>Domain ${d}: ${DN[d]} (${Math.round(WT[d]*100)}% of the exam)</div><div class="rbar"><i style="width:${a===null?0:Math.round(a*100)}%"></i></div><div class="rn" style="margin-top:-8px;margin-bottom:8px">${a===null?"Not enough data yet":Math.round(a*100)+"% correct"} &middot; answered ${r.an[d]} of ${r.av[d]} questions</div>`;
if(a!==null&&(weak===null||a<r.acc[weak]))weak=d}
if(weak!==null)body+=`<p><b>Weakest domain so far:</b> Domain ${weak}, ${DN[weak]}. Use its flashcards and domain quiz next.</p>`;
if(r.have&&r.have<5)body+='<p><b>Gaps:</b> some domains still need at least 10 answered questions before the estimate covers the whole exam.</p>';
body+=`<p class="rn">Coverage: ${r.tot} of ${r.tav} available questions answered (${Math.round(r.cov*100)}%)`+(r.recent!==null?`. Last 30 answers: ${Math.round(r.recent*100)}% correct`:"")+'.</p><button class="nx" id="rr">Reset progress</button>';
return `<details class="rd"><summary>${head}</summary>${body}</details>`}
function exBlock(q,j){const right=j===q[2];return `<div class="ex">${j==null?"":right?"<b>Correct.</b> ":"<b>Not quite.</b> You chose: "+q[1][j]+". "}<br><b>Correct answer:</b> ${q[1][q[2]]}<br><br><b>Why:</b> ${q[3]}</div>`}
function home(){st=null;
app.innerHTML='<h1>ISC2 Certified in Cybersecurity practice</h1><p class="s">Each answer comes with a detailed explanation of why it is right and why the other choices are not.</p>'+readyHTML()+'<label style="display:block;margin:10px 0"><input type="checkbox" id="hide" '+(HIDE?"checked":"")+'> Exam style: hide answers until the end</label>'+
'<button class="set" id="gl"><b>Glossary flashcards and domain quizzes</b>'+GLOSS.length+' terms with meanings and scenarios, sorted by domain, plus a hard quiz for each domain</button>'+
Object.keys(SETS).filter(k=>!SETS[k].dq).map(k=>`<button class="set" data-k="${k}"><b>${SETS[k].n}</b>${SETS[k].d}</button>`).join("");
document.getElementById("hide").onchange=e=>{HIDE=e.target.checked};
const rr=document.getElementById("rr");if(rr)rr.onclick=()=>{if(confirm("Reset all saved progress and the readiness estimate?")){save({});home()}};
document.getElementById("gl").onclick=gloss;app.querySelectorAll(".set[data-k]").forEach(b=>b.onclick=()=>start(b.dataset.k));}
function start(k){const S=SETS[k];st={k,qs:shuf(S.q),i:0,s:0,a:false,ans:[],hide:!!(S.exam&&HIDE&&!S.dq)};show();}
function back(){const S=SETS[st.k];if(S.dq)gloss();else home()}
function show(){const S=SETS[st.k],q=st.qs[st.i],X=st.hide,n=st.qs.length;
app.innerHTML=`<div class="top"><button id="h">${X?"Quit":S.dq?"Flashcards":"Sets"}</button><span>${S.dq?S.n+" &middot; ":""}${st.i+1} of ${n}${X?"":" &middot; score "+st.s}</span></div><div class="bar"><i style="width:${st.i/n*100}%"></i></div><div class="q">${q[0]}</div>`+
q[1].map((o,j)=>`<button class="o${X&&st.ans[st.i]===j?" sel":""}" data-j="${j}">${o}</button>`).join("")+'<div id="x">'+(X?`<button class="nx" id="p">Back</button> <button class="nx" id="n">${st.i+1===n?"Finish":"Next"}</button>`:"")+'</div>';
document.getElementById("h").onclick=()=>{if(!X||confirm("Quit the exam? Progress will be lost."))back()};
if(X){app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{st.ans[st.i]=+b.dataset.j;show()});
document.getElementById("p").onclick=()=>{if(st.i>0){st.i--;show()}};
document.getElementById("n").onclick=()=>{if(st.i+1===n){if(confirm("Finish and see your score?"))done()}else{st.i++;show()}};}
else app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.j));}
function pick(j){if(st.a)return;st.a=true;st.ans[st.i]=j;const q=st.qs[st.i];if(j===q[2])st.s++;rec(q,j===q[2]);
app.querySelectorAll(".o").forEach((b,n)=>{if(n===q[2])b.classList.add("ok");else if(n===j)b.classList.add("no");});
const last=st.i+1===st.qs.length;
document.getElementById("x").innerHTML=exBlock(q,j)+`<button class="nx" id="n">${last?"See score":"Next"}</button>`;
document.getElementById("n").scrollIntoView({block:"nearest"});
document.getElementById("n").onclick=()=>{st.a=false;st.i++;last?done():show();window.scrollTo(0,0)};}
function done(){const S=SETS[st.k],t=st.qs.length;
if(st.hide)st.qs.forEach((q,i)=>{if(st.ans[i]!=null)rec(q,st.ans[i]===q[2])});
let c=0,dm={};st.qs.forEach((q,i)=>{if(st.ans[i]===q[2])c++;if(q[4]){const d=q[4];dm[d]=dm[d]||[0,0];dm[d][1]++;if(st.ans[i]===q[2])dm[d][0]++}});
const p=Math.round(c/t*100);
let h=`<h1>${c} / ${t}</h1><p class="s">${p}%${S.dq?"":" &middot; about "+Math.round(c/t*1000)+" out of 1000 if scaled proportionally (the real exam uses its own scaling)"}.</p>`;
if(!S.dq)h+=Object.keys(dm).sort().map(d=>`<div>${DN[d]}: ${dm[d][0]}/${dm[d][1]}</div>`).join("");
h+=readyHTML();
const miss=st.qs.map((q,i)=>st.ans[i]===q[2]?"":`<div class="ex"><b>${q[0]}</b><br>${st.ans[i]==null?"You skipped this one.":"You chose: "+q[1][st.ans[i]]+"."}<br><b>Correct answer:</b> ${q[1][q[2]]}<br><br><b>Why:</b> ${q[3]}</div>`).join("");
if(miss)h+='<h2 style="font-size:1.1rem;margin-top:20px">Review missed or skipped</h2>'+miss;
h+='<button class="nx" id="r">Retake</button> <button class="nx" id="b">'+(S.dq?"Back to flashcards":"Back to sets")+'</button>';
app.innerHTML=h;document.getElementById("r").onclick=()=>start(st.k);document.getElementById("b").onclick=back;
const rr=document.getElementById("rr");if(rr)rr.onclick=()=>{if(confirm("Reset all saved progress and the readiness estimate?")){save({});done()}};window.scrollTo(0,0);}
function glBuild(){const t=GL.q,m=GL.mode;
let L=GLOSS.map((g,k)=>[g,k]).filter(([g])=>(/^[1-5]$/.test(m)?g[3]===+m:true)&&(g[0]+" "+g[1]).toLowerCase().includes(t));
if(m==="g")L.sort((x,y)=>x[0][3]-y[0][3]||x[1]-y[1]);
GL.list=L.map(x=>x[0]);GL.i=0;GL.flip=false;}
function gloss(){GL={mode:"a",q:"",list:[],i:0,flip:false};
const cnt=[0,0,0,0,0,0];GLOSS.forEach(g=>cnt[g[3]]++);
let opts='<option value="a">All terms, glossary order ('+GLOSS.length+')</option><option value="g">All terms, grouped by domain</option>';
let dqb='';
for(let d=1;d<=5;d++){opts+=`<option value="${d}">Domain ${d}: ${DN[d]} (${cnt[d]})</option>`;dqb+=`<button class="nx dqb" data-d="${d}">Domain ${d} quiz (${DQ[d].length})</button>`}
app.innerHTML=`<div class="top"><button id="h">Sets</button><span id="gn"></span></div><select id="gd" class="gs">${opts}</select><input id="gs" class="gs" placeholder="Search terms or meanings"><p class="rn">Domain quizzes: hard scenario questions that together cover every term in that domain.</p><div class="row">${dqb}</div><div id="gc"></div>`;
document.getElementById("h").onclick=home;
app.querySelectorAll(".dqb").forEach(b=>b.onclick=()=>start("dq"+b.dataset.d));
document.getElementById("gd").onchange=e=>{GL.mode=e.target.value;glBuild();card()};
const inp=document.getElementById("gs");
inp.oninput=()=>{GL.q=inp.value.toLowerCase();glBuild();card()};
glBuild();card();}
function card(){const L=GL.list,c=document.getElementById("gc");
document.getElementById("gn").textContent=L.length?(GL.i+1)+" of "+L.length:"0 results";
if(!L.length){c.innerHTML='<p class="s">No matching terms.</p>';return}
const g=L[GL.i],tag=`<div class="lb">Domain ${g[3]}: ${DN[g[3]]}</div>`;
c.innerHTML=`<div class="card" id="cd">`+(GL.flip?`${tag}<h2>${g[0]}</h2><div class="lb">Meaning</div><p>${g[1]}</p><div class="lb">Scenario</div><p>${g[2]}</p>`:`${tag}<h2>${g[0]}</h2><p class="hint">Tap the card to see the meaning and a scenario.</p>`)+`</div><div class="row"><button class="nx" id="gp">Back</button><button class="nx" id="gf">Flip</button><button class="nx" id="gnx">Next</button><button class="nx" id="gsh">Shuffle</button><button class="nx" id="gaz">Reset order</button></div>`;
const flip=()=>{GL.flip=!GL.flip;card()};
document.getElementById("cd").onclick=flip;document.getElementById("gf").onclick=flip;
document.getElementById("gp").onclick=()=>{GL.i=(GL.i-1+L.length)%L.length;GL.flip=false;card()};
document.getElementById("gnx").onclick=()=>{GL.i=(GL.i+1)%L.length;GL.flip=false;card()};
document.getElementById("gsh").onclick=()=>{GL.list=shuf(GL.list);GL.i=0;GL.flip=false;card()};
document.getElementById("gaz").onclick=()=>{glBuild();card()};}
home();
</script></body></html>
