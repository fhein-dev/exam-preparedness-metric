thentication token", "Defense in depth uses multiple controls across people, technology, and operations", "Depth means adding a mantrap at the main building entrance"], 2, "Defense in depth integrates people, technology, and operations capabilities into multiple layered controls. One firewall is a single layer, and a token or mantrap alone doesn't make depth.", 5], ["A web defacement, a flood, and unauthorized privilege use occur. Which statement is correct?", ["All are baselines of normal operations for a production system", "None are events until a breach has been confirmed by the chief information security officer", "All are adverse events; any may be a incident if confidentiality, integrity, and availability is jeopardized", "All are breaches by the glossary definition of that term"], 2, "A defacement, a flood, and unauthorized privilege use are events with negative consequences, so they're adverse events, and any may be a incident if they jeopardize confidentiality, integrity, or availability. They aren't baselines, and they aren't automatically breaches.", 5], ["A team states Domain Name Service, File Transfer Protocol, Simple Mail Transport Protocol, and Internet Control Message Protocol are protocols and that Domain Name Service also names a server. Which statement matches the glossary?", ["All four are protocols; Domain Name Service can also name a service and a server", "Domain Name Service is never a protocol; it names only a physical server", "Internet Control Message Protocol is a server product rather than a protocol standard", "Only File Transfer Protocol is a protocol; the other three are hosted services"], 0, "Domain Name Service, File Transfer Protocol, Simple Mail Transport Protocol, and Internet Control Message Protocol are all protocols, and Domain Name Service can also refer to a service and a physical server. The other statements deny that Domain Name Service or Internet Control Message Protocol are protocols or misclassify File Transfer Protocol, Simple Mail Transport Protocol, and Internet Control Message Protocol.", 5], ["Which is the best statement of the security operations center's role?", ["Set organization-wide security policy", "Approve changes to production before deployment", "Retain and destroy records on schedule", "Monitor, detect, and analyze events to resolve issues early"], 3, "A security operations center is a centralized function that monitors, detects, and analyzes events to prevent and resolve issues before they disrupt business. Setting policy is governance, approving changes is change management, and retaining records is records management.", 5]];
const EXAM=[["An attacker alters product prices in a database. Nothing is stolen, and the site stays online. Which objective was compromised?", ["Integrity", "Availability", "Non-repudiation", "Confidentiality"], 0, "Integrity means data is accurate and changed only by authorized parties. Altering prices is unauthorized modification, even though nothing leaked and the site stayed up. That rules out confidentiality (no disclosure) and availability (the site is reachable). Non-repudiation is about denying actions, which isn't the issue here.", 1], ["A shop's checkout is unreachable for hours because its payment gateway certificate expired. Which objective failed?", ["Confidentiality", "Authenticity", "Integrity", "Availability"], 3, "Availability means authorized users get timely, reliable access. An expired certificate made checkout unreachable, so access failed. No data was disclosed (confidentiality) or altered (integrity), and 'authenticity' isn't one of the three core objectives, so it can't be the best answer.", 1], ["A firm stops operating in one country because the legal exposure outweighs the revenue there. Which risk treatment is this?", ["Mitigation", "Transference", "Acceptance", "Avoidance"], 3, "Avoidance means not doing the activity because the risk outweighs the benefit. Leaving the country removes the exposure entirely. Mitigation would reduce the risk while still operating, transference would shift the cost to someone else, and acceptance would mean continuing as-is.", 1], ["A merchant outsources card processing to a provider that contractually assumes breach liability. Which treatment is primary?", ["Acceptance", "Transference", "Mitigation", "Avoidance"], 1, "Transference shifts the financial impact of a risk to a third party, here through the provider's contractual liability. It doesn't remove the risk, so it isn't avoidance, and nothing is being reduced by a control, so it isn't mitigation. Acceptance would mean bearing the loss yourself.", 1], ["Executives state that no single risk category may cost more than $50,000 a year. What have they defined?", ["Risk acceptance", "Risk tolerance", "Risk assessment", "Risk treatment"], 1, "Risk tolerance is the level of risk an organization is willing to assume. A $50,000 yearly ceiling is exactly that kind of threshold. Risk acceptance is a decision to proceed with a specific risk, assessment is analyzing risks, and treatment is choosing how to respond.", 1], ["A sign reading 'Premises monitored by closed-circuit television' is posted at a warehouse gate. Which control type is it most directly?", ["Corrective", "Detective", "Deterrent", "Preventive"], 2, "A deterrent discourages bad behavior by making people expect consequences; a sign does not physically stop anyone or record anything. Preventive controls block the action, detective controls identify it, and corrective controls repair damage afterward. The sign works only through the threat of being seen.", 1], ["A weekly review of firewall logs finds a blocked scan from one address. Which control type is the review?", ["Deterrent", "Detective", "Preventive", "Corrective"], 1, "Reviewing logs finds activity that has already happened, which is what detective controls do. It doesn't block the scan (preventive), discourage anyone (deterrent), or fix anything (corrective). The scan was already blocked by something else; the review only discovers it.", 1], ["A team quarantines an infected workstation and removes the malware. Which control type is this?", ["Preventive", "Detective", "Corrective", "Deterrent"], 2, "Corrective controls limit damage and restore normal state after an event. Quarantining and cleaning an infected machine fits. Preventive controls would have stopped the infection, and detective controls would have only found it. The action happens after the problem occurred.", 1], ["A developer's production access is granted for a four-hour change window and then removed. Which principle is applied?", ["Least privilege", "Accountability", "Defense in depth", "Segregation of duties"], 0, "Least privilege gives only the access needed, including for only as long as needed. A four-hour window that is then removed limits both scope and duration. Segregation of duties splits conflicting tasks among people, and defense in depth layers different controls; neither describes time-limited access.", 1], ["Policy states that the engineer who writes code cannot deploy it to production. Which principle is this?", ["Non-repudiation", "Defense in depth", "Segregation of duties", "Least privilege"], 2, "Segregation of duties keeps a single person from completing an entire sensitive process, so the person who writes code can't also release it. Least privilege is about minimum access, not splitting conflicting roles. Non-repudiation is about proving who did something.", 1], ["After a lateral-movement incident, a firm that relied on a perimeter firewall adds endpoint protection, multi-factor authentication, and monitoring. Which strategy is this?", ["Risk acceptance", "Fail-safe design", "Redundancy", "Defense in depth"], 3, "Defense in depth uses multiple layered controls so that one failure doesn't expose the asset. Adding endpoint protection, multi-factor authentication, and monitoring on top of the firewall is that approach. Redundancy duplicates the same function, and fail-safe design is about failing into a secure state.", 1], ["Mandatory annual awareness training is best categorized as which kind of control?", ["Physical", "Environmental", "Administrative", "Technical"], 2, "Training is delivered through policy and procedure aimed at people, which makes it an administrative control. Technical controls are implemented by systems, physical controls are tangible barriers, and 'environmental' controls concern conditions like power or fire suppression.", 1], ["Which is an example of a technical control?", ["Visitor sign-in sheet", "Fire suppression in the server room", "Account lockout after five failed logins", "Background checks before hiring"], 2, "Account lockout is implemented by the system itself, so it's a technical control. A visitor sheet is a procedure, background checks are administrative, and fire suppression is a physical or environmental safeguard.", 1], ["Which is an example of a physical control?", ["Intrusion prevention rule set", "Anti-ram bollards at the lobby entrance", "Quarterly access review procedure", "Role-based access in the human resources system"], 1, "Bollards are tangible barriers, so they are a physical control. An intrusion prevention system rule set and role-based access are technical, and an access review is an administrative procedure.", 1], ["A security professional's employer asks them to hide a defect that endangers the public. Under the ISC2 Code of Ethics, which canon prevails?", ["Act honorably and legally toward principals", "Protect society and the common good", "Provide diligent and competent service", "Advance and protect the profession"], 1, "The ISC2 Code of Ethics canons are ordered, and protecting society, the common good, and the public trust comes first. When an employer's wishes conflict with public safety, the first canon wins. Duty to principals, competent service, and the profession all rank below it.", 1], ["Which activity is a governance function rather than a management or operational one?", ["Rebuilding a failed file server", "Approving the enterprise security policy", "Applying weekly operating system patches", "Reviewing firewall logs each morning"], 1, "Governance sets direction, policy, and decision rights, so approving the enterprise security policy is governance. Patching, log review, and rebuilding servers are management or operational activities that carry out those decisions.", 1], ["A document states that all passwords must be at least 14 characters long. Which kind of document is it?", ["Procedure", "Standard", "Guideline", "Policy"], 1, "A standard states specific mandatory requirements, such as a minimum password length. A policy states high-level intent, a procedure gives step-by-step instructions, and a guideline offers optional recommendations. A fixed 14-character minimum is a mandatory specific rule.", 1], ["An approver cannot later claim they never approved a purchase because the system bound the approval to them cryptographically. Which concept applies?", ["Authorization", "Non-repudiation", "Authentication", "Integrity"], 1, "Non-repudiation means an actor cannot credibly deny having performed an action, typically through digital signatures and protected logs. Authentication proves identity at login, authorization grants permissions, and integrity shows data wasn't altered. Only non-repudiation addresses denial.", 1], ["After login, an application hides the Administration menu from a standard user. Which concept is being enforced?", ["Accounting", "Authentication", "Authorization", "Identification"], 2, "Authorization decides what an already-identified user is allowed to do. Hiding the Administration menu is a permission decision. Identification is claiming an identity, authentication is proving it, and accounting is recording activity.", 1], ["A hospital billing office stores patient names with diagnosis codes. Which data category is most precise?", ["Protected health information", "Classified information", "Personally identifiable information only", "Payment card data"], 0, "Names combined with diagnosis codes describe health status tied to individuals, which is protected health information. The data is also personally identifiable information, but protected health information is the more precise category because it concerns health information. It isn't payment card data or classified government information.", 1], ["Alice encrypts a message with Bob's public key. Who can decrypt it?", ["Alice, using her own private key", "Alice, using Bob's public key", "Only Bob, using his private key", "Anyone holding Bob's public key"], 2, "With asymmetric encryption, a message encrypted with Bob's public key can only be decrypted with Bob's private key. Alice's own private key and Bob's public key can't reverse it, and having the public key doesn't help because the public key only encrypts.", 1], ["Which mechanism provides integrity but, by itself, neither confidentiality nor proof of who created the data?", ["A digital signature", "A bare hash", "Symmetric encryption", "Asymmetric encryption"], 1, "A hash can show that data hasn't changed, but anyone can compute it, so it provides neither secrecy nor proof of who created it. A digital signature adds origin authentication and non-repudiation, and encryption provides confidentiality.", 1], ["A team estimates loss by multiplying asset value, exposure factor, and annual rate of occurrence. Which approach is this?", ["Risk transference", "Risk monitoring", "Qualitative risk analysis", "Quantitative risk analysis"], 3, "Using asset value, exposure factor, and annual rate of occurrence produces a monetary loss figure, which is quantitative analysis. Qualitative analysis uses descriptors like high, medium, and low. Transference and monitoring are risk responses, not analysis methods.", 1], ["An unpatched virtual private network appliance with a known flaw is best described as a:", ["Exploit", "Vulnerability", "Threat", "Threat actor"], 1, "A vulnerability is a weakness that can be exploited, such as an unpatched flaw. A threat is something that could exploit it, a threat actor is the party doing so, and an exploit is the technique or code used. The appliance itself has only the weakness.", 1], ["Which two factors most directly determine the level of an information security risk?", ["Likelihood and impact", "Asset age and location", "Cost and complexity", "Vendor and version"], 0, "Risk is a function of how likely a harmful event is and how much damage it would cause. Age, cost, vendor, and version may influence those factors indirectly, but they don't define the risk level.", 1], ["Leadership requires the order system to be restored within four hours of an outage. Which measure is this?", ["Mean time between failures", "Business impact analysis", "Recovery point objective", "Recovery time objective"], 3, "Recovery time objective is the target time to restore service after an outage, here four hours. Recovery point objective is about acceptable data loss, business impact analysis is the analysis that helps set these targets, and mean time between failures measures reliability between failures.", 2], ["A company can lose no more than 15 minutes of committed transactions after a failure. Which measure is this?", ["Business impact analysis", "Recovery point objective", "Mean time between failures", "Recovery time objective"], 1, "Recovery point objective defines how much data loss, measured in time, is acceptable. Losing at most 15 minutes of transactions means backups or replication must be that frequent. Recovery time objective is about time to restore, and mean time between failures and business impact analysis are not loss tolerances.", 2], ["An alternate site has installed hardware, but data must be restored from backups within a day or two. Which site type is this?", ["Cold site", "Hot site", "Mobile site", "Warm site"], 3, "A warm site has hardware in place but needs data restored, so recovery takes a day or two. A hot site would be nearly ready to run immediately, while a cold site has space and utilities but little or no equipment.", 2], ["An analyst has just been alerted to possible ransomware on one server. Which step comes before eradicating the malware?", ["Confirm and scope the incident", "Restore from backup", "Decommission the server", "Publish a lessons-learned report"], 0, "Before eradication you must confirm that the alert is real and understand its scope; otherwise you may miss infected hosts or destroy evidence. Restoring, decommissioning, and lessons-learned reviews come later in the response lifecycle.", 2], ["During a data center outage, staff will process orders on paper forms at a secondary office while servers are rebuilt. Which plan covers the paper process?", ["Business impact analysis", "Business continuity plan", "Disaster recovery plan", "Incident response plan"], 1, "Business continuity keeps critical functions running during a disruption, such as using paper at a secondary office. Disaster recovery restores information technology systems, and incident response handles security events. A business impact analysis is analysis, not a plan.", 2], ["A business impact analysis's primary output is best described as:", ["Schedule of recurring penetration tests", "Ranked recovery priorities with dependencies", "Prioritized list of likely threat actors", "Inventory of installed software by owner"], 1, "A business impact analysis identifies critical functions, their dependencies, and recovery priorities. It doesn't list threat actors, inventory software, or schedule penetration tests; those belong to other activities.", 2], ["A single failed login by a valid user is best classified as:", ["A incident", "A breach", "An event", "An intrusion"], 2, "An event is any observable occurrence. One valid user's failed login doesn't threaten confidentiality, integrity, or availability, so it isn't a incident, breach, or intrusion. It could become part of one only if other evidence appears.", 2], ["Backups are stored on the same storage array as production data. What is the main weakness?", ["One failure can destroy both copies", "Restore operations will run much slower", "License costs rise with each copy", "The backup files cannot be encrypted"], 0, "Backups on the same array share a single failure domain, so one hardware failure or attack can destroy both production and backup data. Speed, cost, and encryption are secondary issues; the core purpose of a backup would be defeated.", 2], ["During a incident, who should authorize statements to the press?", ["A designated communications lead", "Any available department manager", "The affected software vendor", "The on-call security analyst"], 0, "A designated communications lead ensures consistent, accurate messaging and limits accidental disclosure. Analysts, random managers, or vendors speaking publicly could reveal sensitive details or contradict the official account.", 2], ["Which scenario is best classified as a disaster rather than a incident?", ["A laptop is infected and reimaged", "A web page is defaced and restored within an hour", "A phishing email harvests one password", "Flooding makes the primary data center unusable for a week"], 3, "A disaster is an event that prevents critical functions from being performed acceptably for a significant period, such as a week-long data center loss. A phishing password, a brief defacement, or one infected laptop are incidents that normal response can handle.", 2], ["A user logs in with a password and then answers a security question. Which statement is correct?", ["This is multi-factor authentication", "This is biometric authentication", "This is single-factor authentication", "This uses something you have"], 2, "A password and a security question are both something you know, so they're two instances of the same factor. Multi-factor authentication requires different factor types, such as knowledge plus possession or inherence.", 3], ["A user enters a password and approves a prompt on an enrolled phone. Which factors are combined?", ["Something you know and something you have", "Two instances of something you know", "Something you have and something you are", "Something you know and something you are"], 0, "The password is something you know and the enrolled phone is something you have. Biometrics would be 'something you are,' which isn't involved. Two factors of different types are combined.", 3], ["A document's owner decides who else may read or edit it. Which model is this?", ["Mandatory access control", "Role-based access control", "Discretionary access control", "Rule-based access control"], 2, "In discretionary access control, the owner decides who may access the object. In mandatory access control the system enforces policy, in role-based access control permissions come from roles, and rule-based control applies preset rules regardless of the owner.", 3], ["A system labels files and blocks users from sharing them beyond their clearance, even if the owner wants to. Which model is this?", ["Attribute-based access", "Discretionary access control", "Role-based access control", "Mandatory access control"], 3, "Mandatory access control uses system-enforced labels and clearances that owners cannot override. In discretionary access control the owner decides, role-based access control is role-based, and attribute-based control evaluates user and resource attributes, which isn't described here.", 3], ["When a nurse is promoted to supervisor, an administrator changes her group and her permissions change with it. Which model is this?", ["Mandatory access control", "Discretionary access control", "Rule-based access control", "Role-based access control"], 3, "Role-based access control assigns permissions to roles, so changing a person's role changes their permissions. Discretionary access control depends on owner choices, and mandatory access control depends on labels and clearances.", 3], ["An employee resigns on Friday. Which action best reduces risk?", ["Disable the account at separation", "Review the account next quarter", "Reduce the account's password length", "Move the account to a shared group"], 0, "When employment ends, accounts should be disabled promptly so former staff can't use them. Waiting until a quarterly review leaves a window of exposure, and shortening a password length or moving the account to a shared group makes things worse or does nothing.", 3], ["A sysadmin browses the web and reads email using a domain-admin account. Which fix best addresses this?", ["Disable logging on the admin account", "Add the account to additional groups", "Use a standard account for routine work", "Lengthen the admin account password"], 2, "Least privilege means using elevated rights only when needed. A standard account for email and browsing limits exposure if the account is phished. A longer password or extra groups doesn't reduce what compromised rights can do, and disabling logging removes visibility.", 3], ["A site wants a passage where only one door opens at a time to stop piggybacking. Which control is this?", ["Bollard", "Mantrap", "Turnstile", "Fence"], 1, "A mantrap uses two doors with only one open at a time to control passage and stop piggybacking. A turnstile admits one person at a time but isn't a two-door enclosure, while bollards and fences are barriers.", 3], ["Which control is most effective against tailgating at a staffed lobby?", ["Weekly antivirus signature updates", "A turnstile or mantrap with guard oversight", "Full-disk encryption on every workstation", "Longer password requirements for badges"], 1, "Physical controls that restrict passage, such as turnstiles or mantraps with guard oversight, stop unauthorized people from following others in. Antivirus, encryption, and password length do nothing about physical entry.", 3], ["A security camera at the server room door records entries. Which control type is it most directly?", ["Preventive", "Corrective", "Detective", "Compensating"], 2, "A camera that records entries is a detective control because it identifies and records after or during an event. It doesn't physically block entry (preventive), repair damage (corrective), or substitute for a missing control (compensating).", 3], ["Managers review all user permissions each quarter and remove what is no longer needed. Which practice is this?", ["Data classification", "Access recertification", "Penetration testing", "Change management"], 1, "Access recertification periodically reviews permissions and removes those no longer needed, enforcing least privilege. Data classification, penetration testing, and change management are different activities.", 3], ["Unlocking a laptop with a fingerprint is an example of which factor?", ["Somewhere you are", "Something you have", "Something you know", "Something you are"], 3, "A fingerprint is a biological characteristic, which is 'something you are.' A password or personal identification number is something you know, and a card or token is something you have. Location can also be a factor but isn't involved here.", 3], ["A user taps a smart card and types a personal identification number. Which statement is correct?", ["This combines possession and inherence", "This combines possession and knowledge", "This is authorization, not authentication", "This is single-factor authentication"], 1, "A smart card is something you have and a personal identification number is something you know, so possession plus knowledge. Inherence would be a biometric. It's authentication, not authorization, and uses two factor types, so it's not single-factor.", 3], ["A process reads a customer file. Which statement uses subject and object correctly?", ["Process is the subject; file is the object", "Both are subjects", "Process is the object; file is the subject", "Both are objects"], 0, "A subject is the active entity that acts, such as a process, and an object is the passive resource it accesses, such as a file. The reverse labeling or calling both the same type is incorrect.", 3], ["Lighting and open sight lines are redesigned to reduce hiding places around a building. Which concept is this?", ["Crime Prevention through Environmental Design", "Segregation of duties among guards", "Defense in depth for physical sites", "Microsegmentation of building networks"], 0, "Crime Prevention through Environmental Design uses environmental design such as lighting and sight lines to reduce opportunities for crime. Segregation of duties, defense in depth, and microsegmentation are security concepts unrelated to building design.", 3], ["A badge system logs each entry to the server room with the person's identity. Which property does the log most directly support?", ["Confidentiality", "Accountability", "Availability", "Redundancy"], 1, "Logs that tie actions to identified people support accountability, meaning individuals can be held responsible for what they do. They don't by themselves protect confidentiality, ensure availability, or add redundancy.", 3], ["A contractor needs two weeks of access. Which approach is best?", ["A permanent administrator-level account", "An anonymous guest login with no logging", "A copy of an employee's shared login", "A time-limited account with minimum rights"], 3, "A time-limited account with minimum rights follows least privilege and ensures access ends when the work does. Permanent admin rights, shared accounts, or anonymous logins weaken control and accountability.", 3], ["Which describes a logical access control rather than a physical one?", ["A locked steel cage around the servers", "A system that validates a personal identification number and assigns role-based privileges", "A guard who checks badges at the lobby", "A perimeter fence around the parking lot"], 1, "Logical access control restricts access to computer resources through authentication and authorization, as when a system validates a personal identification number and assigns role-based privileges. Cages, guards, and fences are physical controls.", 3], ["An access control list entry denies one user access to a file. In the glossary's terms, that entry is a:", ["Payload", "Baseline", "Token", "Rule"], 3, "In the glossary, a rule allows or denies access by comparing an identity to an access control list, so an access control list deny entry is a rule. A payload is malicious code's action, a baseline is a minimum configuration, and a token is a possessed authenticator.", 3], ["Employees can only read the data needed for their own job functions. Which concept limits access this way?", ["Defense in depth", "Non-repudiation", "Need-to-know", "Redundancy"], 2, "Need-to-know limits access to information required for a person's job. Defense in depth, non-repudiation, and redundancy are different concepts and don't restrict data access by job function.", 3], ["Which password change most improves resistance to online guessing?", ["Allow shared service passwords", "Print hints on login screens", "Force daily password changes", "Add multi-factor authentication"], 3, "Multi-factor authentication blocks attackers who guess or steal a password alone, so it most improves resistance to online guessing. Shared passwords and printed hints weaken security, and forced daily changes tend to cause weak, predictable choices.", 3], ["A guard checks identification cards and issues temporary badges to visitors. This is best classified as which control?", ["Physical", "Compensating", "Technical", "Administrative only"], 0, "A guard checking identification cards and issuing badges is a physical (personnel-based) control. It isn't technical or purely administrative, and compensating controls are alternatives used when a primary control can't be implemented.", 3], ["At which Open Systems Interconnection layer do packets exist?", ["Layer 4 (Transport)", "Layer 3 (Network)", "Layer 1 (Physical)", "Layer 2 (Data Link)"], 1, "Packets exist at Layer 3, the network layer, where Internet Protocol addressing and routing occur. Bits are Layer 1, frames Layer 2, and segments Layer 4.", 4], ["Which port does Hypertext Transfer Protocol Secure normally use?", ["22", "25", "80", "443"], 3, "Hypertext Transfer Protocol Secure uses Transport Control Protocol port 443. Port 80 is Hypertext Transfer Protocol, 25 is Simple Mail Transport Protocol, and 22 is Secure Shell.", 4], ["A sensor alerts on suspicious traffic but cannot block it. Which device is it?", ["Intrusion detection system", "Intrusion prevention system", "Proxy server", "Stateful firewall"], 0, "An intrusion detection system observes traffic and alerts but does not block it. An intrusion prevention system sits inline and can drop traffic. A stateful firewall and a proxy filter or mediate traffic rather than only alerting.", 4], ["An inline device drops traffic that matches an attack signature. Which device is it?", ["Intrusion prevention system", "Network tap", "Intrusion detection system", "Layer 2 switch"], 0, "An inline device that drops traffic matching attack signatures is an intrusion prevention system. A tap only copies traffic, an intrusion detection system only alerts, and a switch forwards frames.", 4], ["A firewall allows inbound web traffic to a public server and denies other inbound traffic. Which principle is shown?", ["Filtering by rule set", "Password hashing", "Encryption in transit", "Multi-factor authentication"], 0, "A firewall filtering traffic by rules, allowing web traffic and denying the rest, illustrates rule-based filtering. Encryption, multi-factor authentication, and password hashing are unrelated to traffic filtering.", 4], ["Remote staff need a secure channel to the corporate network over the internet. Which technology fits best?", ["Demilitarized zone", "Virtual private network", "Virtual local area network", "Proxy"], 1, "A virtual private network creates an encrypted tunnel over the internet for secure remote access. A demilitarized zone isolates public servers, a virtual local area network groups hosts logically, and a proxy mediates requests without securing the whole connection.", 4], ["Departments in two buildings must act as one local area network, isolated from other departments. Which technology fits?", ["Virtual local area network", "Demilitarized zone", "Virtual private network", "Proxy"], 0, "A virtual local area network logically groups devices into one local area network regardless of location while isolating other groups. A virtual private network tunnels traffic, a demilitarized zone separates public services, and a proxy mediates requests.", 4], ["Public web servers are placed in a separate zone between the internet and the internal network. What is the zone called?", ["Extranet", "Demilitarized zone", "Intranet", "Virtual local area network"], 1, "A demilitarized zone is a separate zone between the internet and the internal network that hosts public-facing services. An intranet is internal only, an extranet is shared with partners, and a virtual local area network is a logical group.", 4], ["A network is split into very small zones with firewalls between them to stop lateral movement. Which technique is this?", ["Microsegmentation", "Broadcast filtering", "Port mirroring", "Virtual local area network tagging"], 0, "Microsegmentation divides networks into very small zones with policy between them to limit lateral movement. Virtual local area network tagging is coarser, mirroring copies traffic for monitoring, and broadcast filtering reduces noise.", 4], ["A design assumes no device or user is trusted merely for being inside the network. Which model is this?", ["Perimeter defense", "Zero trust", "Air gapping", "Defense in depth only"], 1, "Zero trust assumes no implicit trust based on network location and verifies each request. Perimeter defense trusts the inside, air gapping isolates systems, and defense in depth is layering rather than removing implicit trust.", 4], ["Many hosts flood a site with traffic so legitimate users cannot reach it. Which attack is this?", ["Spoofing", "Man-in-the-middle", "Denial of service", "Zero-day exploit"], 2, "Denial of service makes a service unavailable by overwhelming it. Man-in-the-middle intercepts messages, spoofing forges addresses, and a zero-day is an unknown vulnerability, not a flood.", 4], ["An attacker positioned between a user and a site reads and changes messages. Which attack is this?", ["Man-in-the-middle", "Denial of service", "Fragmentation", "Whaling"], 0, "A man-in-the-middle attack positions the attacker between two parties to read and alter messages. Denial of service floods, whaling targets executives by deception, and fragmentation splits packets.", 4], ["Packets carry a forged source address so they appear to come from a trusted host. Which attack is this?", ["Fragmentation", "Replay", "Whaling", "Spoofing"], 3, "Spoofing forges the source address to appear trusted. Fragmentation splits packets, replay re-sends captured traffic, and whaling is a targeted phishing attack.", 4], ["An email impersonating the chief executive officer urges the chief financial officer to wire money to a new vendor. Which attack is this?", ["Spoofing only", "Whaling", "Smishing", "Vishing"], 1, "Whaling is phishing aimed at senior executives or those with authority over money, here impersonating the chief executive officer to the chief financial officer. Smishing uses text messages and vishing uses voice calls. Spoofing alone doesn't describe the targeted fraud.", 4], ["Software encrypts a company's files and demands payment for the key. Which malware type is this?", ["Rootkit", "Ransomware", "Worm", "Bot"], 1, "Ransomware locks or encrypts data and demands payment. A bot takes remote commands, a worm self-replicates, and a rootkit hides malicious access.", 4], ["A compromised host awaits commands from an attacker alongside many other infected hosts. Which term fits?", ["Trojan", "Ransomware", "Worm", "Bot"], 3, "A bot is a compromised host controlled remotely by an attacker, often as part of a botnet. A trojan is disguised malware, a worm spreads on its own, and ransomware demands payment.", 4], ["A startup rents virtual machines and installs its own operating system and applications. Which service model is this?", ["Function as a Service", "Software as a Service", "Infrastructure as a Service", "Platform as a Service"], 2, "Infrastructure as a Service rents virtual machines where the customer installs and manages its own operating system and applications. Platform as a Service provides a platform for apps, Software as a Service provides finished applications, and Function as a Service runs functions without servers.", 4], ["A company uses a provider's web-based email and can change only a few user settings. Which model is this?", ["Platform as a Service", "Private cloud", "Infrastructure as a Service", "Software as a Service"], 3, "Software as a Service delivers a finished application managed by the provider, with customers adjusting only limited settings. Platform as a Service and Infrastructure as a Service give more control, and private cloud is a deployment model.", 4], ["A hospital runs cloud services inside its own firewall under information technology control. Which deployment model is this?", ["Public cloud", "Community cloud", "Private cloud", "Hybrid cloud"], 2, "A private cloud runs inside the organization's own firewall under its information technology control. Public clouds are open to the general public, community clouds serve groups with shared concerns, and hybrid clouds mix models.", 4], ["Several agencies with shared compliance requirements jointly use a cloud provisioned for them alone. Which model is this?", ["Community cloud", "Private cloud", "Public cloud", "Hybrid cloud"], 0, "A community cloud is provisioned for a group of organizations with shared concerns such as compliance. Private is for one organization, public is open to all, and hybrid combines models.", 4], ["As data moves down the network stack, each layer adds its own header. What is this called?", ["Fragmentation", "Encapsulation", "Segmentation", "Multiplexing"], 1, "Encapsulation wraps data in headers (and trailers) as it moves down the stack. Fragmentation splits packets, segmentation divides data into segments, and multiplexing combines streams.", 4], ["Under the Infrastructure as a Service shared responsibility model, who patches the guest operating system?", ["The hypervisor vendor", "The network carrier", "The customer", "The provider"], 2, "In Infrastructure as a Service, the provider manages the underlying infrastructure and the customer manages the guest operating system, including patching it. The hypervisor vendor and carrier aren't responsible for the customer's guest operating system.", 4], ["Which statement about File Transfer Protocol is most accurate?", ["It encrypts every session by default", "It resolves host names to addresses", "It relays email between mail servers", "It transfers files between hosts, unencrypted by default"], 3, "File Transfer Protocol transfers files between hosts, and standard File Transfer Protocol sends data and credentials unencrypted. It doesn't resolve names, relay email, or encrypt by default (unlike Secure File Transfer Protocol or File Transfer Protocol Secure).", 4], ["An attacker splits traffic so the target cannot reassemble the packets. Which attack is this?", ["Broadcast storm", "Fragment attack", "Oversized packet attack", "Spoofing"], 1, "A fragment attack splits traffic so the target can't reassemble the packets. An oversized packet attack sends a packet too large to handle, spoofing forges addresses, and a broadcast storm floods with broadcasts.", 4], ["A company labels documents Public, Internal, or Confidential and applies handling rules accordingly. What is the primary goal?", ["Remove the need for encryption keys", "Reduce backup time for large files", "Protect data according to sensitivity", "Cut bandwidth used by internal traffic"], 2, "Classification matches protection and handling to data sensitivity. It doesn't remove encryption needs, speed backups, or reduce bandwidth.", 5], ["Data is encrypted on a laptop's disk and again while crossing a virtual private network. Which two states are protected?", ["Hashed and signed", "Deleted and indexed", "In use and archived", "At rest and in transit"], 3, "Disk encryption protects data at rest, and a virtual private network protects data in transit. In use refers to data being processed in memory, and hashing or signing aren't states of data.", 5], ["Which statement distinguishes hashing from encryption?", ["Both require two distinct keys to operate", "Hashing is one-way; encryption is reversible with a key", "Hashing is reversible with a key; encryption is one-way", "Both are reversible when the key is known"], 1, "Hashing is one-way, so you can't recover the original data from a hash, while encryption is reversible with the right key. Reversing those statements or saying both need two keys is wrong.", 5], ["A team collects records of logins, file access, and configuration changes for later review. Which practice is this?", ["Logging", "Hardening", "Provisioning", "Segmentation"], 0, "Logging collects and stores records of activity for later review. Hardening reduces attack surface, provisioning creates accounts, and segmentation divides networks.", 5], ["A weekly process identifies, tests, deploys, and verifies operating system updates across servers. Which practice is this?", ["Configuration management", "Records retention", "Patch management", "Vulnerability disclosure"], 2, "Patch management is a systematic process of identifying, testing, deploying, and verifying updates. Configuration management controls changes broadly, records retention concerns keeping data, and vulnerability disclosure is a reporting process.", 5], ["A server must meet the minimum documented secure configuration before deployment. What is that minimum called?", ["Baseline", "Standard operating procedure", "Playbook", "Baseline risk"], 0, "A baseline is the minimum secure configuration. A standard operating procedure describes steps, a playbook guides responses, and 'baseline risk' isn't the configuration minimum.", 5], ["An admin wants to change a production firewall rule. What should happen first under change management?", ["Suspend logging during the change", "Remove the old firewall rule first", "Submit and approve a request for change", "Schedule an overnight deployment window"], 2, "Change management begins with a request for change so the change can be reviewed, approved, and tracked. Deploying first, removing the rule, or suspending logging skips control.", 5], ["Short recurring sessions teach staff to recognize phishing. Which control type is this?", ["Technical", "Administrative", "Detective", "Physical"], 1, "Training is delivered through policy and procedure, making it an administrative control. It doesn't directly detect events, restrict access technically, or physically block anything.", 5], ["Before returning leased magnetic drives, a company exposes them to a strong magnetic field so data cannot be rebuilt. Which technique is this?", ["Overwriting", "Hashing", "Degaussing", "Shredding"], 2, "Degaussing exposes magnetic media to a strong field so data can't be reconstructed. Overwriting rewrites data, shredding physically destroys, and hashing isn't an erasure method.", 5], ["Policy requires invoices to be kept seven years and then securely destroyed. Which practice is this?", ["Records retention", "Baseline management", "Configuration management", "Remanence testing"], 0, "Records retention keeps records as long as needed and then destroys them. Baseline and configuration management concern system settings, and remanence testing checks for leftover data.", 5], ["A team monitors, detects, and analyzes network events to resolve issues before business disruption. Which function is this?", ["Records office", "Security operations center", "Change advisory board", "Governance committee"], 1, "A security operations center monitors, detects, and analyzes events to resolve issues before they disrupt the business. A records office, change board, and governance committee have different roles.", 5], ["A tool scans systems for missing patches and misconfigurations. Which activity is this?", ["Vulnerability scanning", "Incident response", "Penetration testing", "Business impact analysis"], 0, "Vulnerability scanning identifies missing patches and misconfigurations. Penetration testing attempts exploitation, incident response handles events, and a business impact analysis analyzes business impact.", 5], ["A system blocks an email containing unencrypted card numbers from leaving. Which capability is this?", ["Patch management", "Data loss prevention", "Intrusion detection", "Egress filtering only"], 1, "Data loss prevention detects and prevents unauthorized transmission of sensitive data, such as card numbers in email. Intrusion detection watches for attacks, patching fixes software, and egress filtering alone doesn't inspect content.", 5], ["Why keep a backup copy at an offsite location?", ["It survives a disaster at the primary site", "It makes daily backups run faster", "It removes the need for restore testing", "It lowers software licensing costs"], 0, "An offsite copy survives a disaster that destroys the primary site. Offsite storage doesn't speed backups, remove testing needs, or lower license costs.", 5], ["An independent party examines records and activities to determine whether controls meet policy. Which activity is this?", ["Audit", "Packet capture", "Provisioning", "Patching"], 0, "An audit is an independent examination of records and activities to assess control compliance. Packet capture, provisioning, and patching are operational tasks.", 5], ["Logs show repeated 3 in the morning logins by an employee who works days. How should this be described?", ["A false positive from the day shift", "A confirmed breach of the account", "A baseline deviation safe to ignore", "A log anomaly requiring investigation"], 3, "Repeated 3 in the morning logins by a daytime employee are an unusual pattern, a log anomaly that warrants investigation. It isn't yet a confirmed breach, and treating it as safe or a false positive would be unjustified.", 5], ["Which practice most directly reduces human risk from phishing?", ["Business impact analysis", "Security awareness training", "Network segmentation", "Disk encryption"], 1, "Security awareness training teaches people to recognize and report phishing, reducing human risk. Business impact analysis, segmentation, and disk encryption don't change user behavior.", 5], ["A company's asset register lists servers and buildings but omits its patented algorithm. What is the problem?", ["Patents are liabilities rather than assets", "Only tangible items belong in a register", "Intellectual property is also an asset", "Algorithms are records, not assets"], 2, "Assets include both tangible items and intangible ones such as intellectual property. A patented algorithm has value to the organization and belongs in the asset register.", 1], ["A server drifted from its secure configuration after an unapproved change. Which discipline would most directly have prevented this?", ["Vulnerability scanning", "Patch management", "Configuration management", "Records retention"], 2, "Configuration management ensures only authorized and validated changes reach systems, so an unapproved change would have been blocked or flagged. Scanning finds issues afterward, patching updates software, and retention concerns records.", 5]];
const HARDEXAM=[["A bank encrypts its backup tapes but stores the decryption keys in the same tape rack. Which objective is MOST at risk despite the encryption?", ["Confidentiality", "Availability", "Non-repudiation", "Integrity"], 0, "Encryption only protects confidentiality if the key stays secret. Storing the keys beside the tapes means anyone who obtains the rack gets both ciphertext and keys, so disclosure becomes trivial. Integrity (unaltered data), availability (access when needed), and non-repudiation (denial of actions) aren't what this mistake primarily undermines.", 1], ["A database admin quietly rounds each transaction down by a cent and diverts the difference. Customers can still log in and no data leaks. Which objective is violated?", ["Privacy", "Integrity", "Confidentiality", "Availability"], 1, "Integrity means data changes only through authorized, accurate processes. Rounding amounts and skimming the difference is unauthorized modification of data. Nothing was disclosed (confidentiality) and users still have access (availability); 'privacy' concerns individuals' control over their personal data, which isn't the issue.", 1], ["A firm wants one control that stops a laptop theft and another that records it. Which pairing maps preventive and detective, in that order?", ["Closed-circuit television; cable lock", "Cable lock; closed-circuit television", "Warning sign; cable lock", "Cable lock; warning sign"], 1, "A cable lock physically stops the theft, which makes it preventive. Closed-circuit television records what happens, which makes it detective. The reversed orders swap those roles, and a warning sign is a deterrent, not a preventive or detective control.", 1], ["A firm replaces a legacy payment module with a vendor service whose contract covers breach costs. Regulators still hold the firm accountable. Which statement is MOST accurate?", ["The risk was mitigated to zero by the new service", "The risk was avoided because the module was replaced", "Financial impact was transferred but accountability remains", "The vendor now bears all regulatory accountability"], 2, "Transference shifts financial impact to a third party, but it can't hand away the organization's accountability to regulators. The risk isn't reduced to zero or avoided, because the firm still processes payments, and regulators don't release the firm just because a vendor assumed costs.", 1], ["After controls lower a risk, some exposure remains. What is that remainder called?", ["Residual risk", "Inherent risk", "Secondary risk", "Acceptable risk"], 0, "Residual risk is the exposure that remains after controls are applied. Inherent risk is the level before controls, acceptable risk is the level management will tolerate, and 'secondary risk' refers to new risks created by a response. Only residual risk describes what's left.", 1], ["One threat has high likelihood but trivial impact; another has low likelihood but catastrophic impact. Which statement is MOST defensible?", ["The high-likelihood risk should always be treated first", "The catastrophic-impact risk should always be treated first", "Both rank identically because each has one high factor", "Neither ranks higher without weighing both factors together"], 3, "Risk depends on both likelihood and impact, so ranking requires considering them together; frequent trivial events and rare catastrophic ones can't be ordered by one factor alone. 'Always treat X first' ignores the other factor, and equal ranking isn't justified either.", 1], ["A team lacks reliable loss data and rates each risk on a five-by-five heat map. Which approach is this?", ["Risk avoidance review", "Qualitative risk analysis", "Risk transference review", "Quantitative risk analysis"], 1, "Rating risks on a heat map using levels like low, medium, and high is qualitative analysis, appropriate when reliable numeric loss data is missing. Quantitative analysis would require monetary values and probabilities. Avoidance and transference reviews are risk responses, not analysis methods.", 1], ["An analyst's clearance would allow access to every project file, but access is limited to the one project she works on. Which principle is applied?", ["Need-to-know", "Segregation of duties", "Defense in depth", "Non-repudiation"], 0, "Need-to-know restricts access to information required for a person's job, even when clearance would permit more. Segregation of duties splits conflicting tasks, defense in depth layers controls, and non-repudiation prevents denial. Only need-to-know matches limiting access despite higher clearance.", 1], ["Preparer and approver of journal entries are different people but share one login. What is the MOST accurate assessment?", ["Least privilege is satisfied by the separate duties", "Segregation is satisfied because the roles are different", "Shared credentials defeat the segregation in practice", "Non-repudiation is strengthened by the approvals"], 2, "Segregation of duties works only if each person's actions are distinct and attributable. A shared login means either person could act as the other, so the separation exists on paper only. The other statements wrongly claim the control is satisfied or that non-repudiation improves, when shared credentials destroy accountability.", 1], ["A mandatory two-week vacation policy for finance staff is intended to surface hidden fraud. How is it BEST classified?", ["Technical, preventive", "Administrative, detective", "Physical, deterrent", "Administrative, preventive"], 1, "Mandatory vacations let someone else take over duties and notice irregularities, so the policy detects fraud. It is created through policy, making it administrative. It doesn't stop fraud in advance (preventive), isn't a system mechanism (technical), and isn't physical.", 1], ["A legacy system cannot support multi-factor authentication, so the team adds network isolation and enhanced monitoring. What are these additions called?", ["Corrective controls", "Recovery controls", "Compensating controls", "Deterrent controls"], 2, "Compensating controls are alternatives that reduce risk when the preferred control, here multi-factor authentication, can't be implemented. Isolation and monitoring offset the weakness. Corrective controls repair damage, recovery controls restore operations, and deterrent controls discourage actions.", 1], ["An ISC2 member learns a colleague cheated to obtain a certification. Which canon BEST supports reporting it?", ["Provide diligent and competent service", "Act honorably, honestly, justly, and legally", "Protect society and the common good", "Advance and protect the profession"], 3, "The canon on advancing and protecting the profession covers actions like reporting cheating that undermines the integrity of certification. Competent service concerns work quality, acting honorably concerns the member's own conduct, and protecting society takes precedence when public safety is at stake, which isn't the case here.", 1], ["Who is ultimately accountable for accepting an organization's security risk?", ["The internal audit group", "The security operations team", "Senior executive leadership", "The system administrators"], 2, "Senior executive leadership holds ultimate accountability for risk acceptance because they own the organization's objectives and consequences. Auditors assess, operations teams execute controls, and administrators implement, but none of them can accept risk on behalf of the enterprise.", 1], ["A document lists optional recommended practices that staff may adapt to their situation. What is it?", ["Procedure", "Guideline", "Standard", "Policy"], 1, "A guideline gives optional recommendations that people may adapt. A policy states mandatory intent, a standard states mandatory specific requirements, and a procedure gives required steps. The word 'optional' points to a guideline.", 1], ["A page gives numbered steps for revoking access when an employee is terminated. What is it?", ["Guideline", "Procedure", "Standard", "Policy"], 1, "A procedure provides detailed, numbered steps to carry out a task, such as revoking access. Guidelines are optional, standards are mandatory requirements, and policies are high-level statements of intent.", 1], ["Which scenario uses hashing for integrity rather than confidentiality?", ["Encrypting a laptop's disk with a passphrase", "Protecting a virtual private network session with a pre-shared key", "Comparing a downloaded file's hash with the published hash", "Hiding a database column with column-level encryption"], 2, "Comparing a computed hash with a published one checks that the file wasn't altered, so it's an integrity use. The other options protect secrecy: disk encryption, a virtual private network pre-shared key, and column encryption all aim at confidentiality.", 1], ["Which key does a sender use to digitally sign a document so others can verify it?", ["The recipient's public key", "The recipient's private key", "The sender's private key", "The sender's public key"], 2, "A sender signs with their private key, and anyone can verify with the sender's public key. The recipient's keys aren't involved in signing, and using the sender's public key to sign wouldn't prove who signed because anyone has it.", 1], ["Why is key distribution the main drawback of symmetric encryption?", ["Keys must be published in a public directory first", "Each message needs its own unique public key pair", "Keys expire after a single message and must be reissued", "Both parties must securely share the same secret key"], 3, "Symmetric encryption uses one shared secret, so both parties must get that key securely before communicating, which is hard at scale. The other statements describe public-key concepts or invented key behavior that isn't how symmetric systems work.", 1], ["A user types a username into a login box. What has the user done?", ["Authorization", "Authentication", "Identification", "Accounting"], 2, "Typing a username claims an identity, which is identification. Authentication verifies the claim, authorization grants permissions, and accounting records activity. The claim isn't proven yet.", 1], ["Which combination BEST supports non-repudiation?", ["Unique user identifiers, signed transactions, protected audit logs", "Role groups, patch cycles, antivirus scans", "Shared accounts, daily backups, firewall rules", "Strong passwords, account lockout, screen savers"], 0, "Non-repudiation needs actions tied to a specific person and preserved: unique identifiers, signed transactions, and protected logs. Shared accounts make attribution impossible, and passwords, patching, or antivirus don't create proof of who did what.", 1], ["Which item, on its own, is MOST likely to be personally identifiable information?", ["A driver's license number", "A server hostname", "The company's mailing address", "A public product catalog"], 0, "A driver's license number uniquely identifies an individual, so it's personally identifiable information. A hostname identifies a system, a business address is not about a person, and a public catalog contains no personal data.", 1], ["Who normally assigns the classification level of a data set?", ["The data owner", "The system administrator", "The data custodian", "The security analyst"], 0, "The data owner decides classification because they understand the business value and risk of the data. Custodians and administrators implement protections, and analysts advise but don't set classification.", 1], ["Who implements technical controls on classified data according to the owner's requirements?", ["The external auditor", "The data custodian", "The data owner", "The end user"], 1, "The data custodian implements and maintains technical controls according to the owner's requirements. The owner sets requirements, auditors assess, and end users simply use the data.", 1], ["In a risk assessment, a higher asset value MOST directly increases which factor?", ["Vulnerability", "Likelihood", "Threat", "Impact"], 3, "A more valuable asset causes greater harm when compromised, so impact rises. Likelihood depends on threats and vulnerabilities, not on asset value; value doesn't change a vulnerability or create a threat.", 1], ["Which statement about a risk register is MOST accurate?", ["It stores the incident tickets opened by the help desk", "It documents the compliance findings raised by auditors", "It lists the technical vulnerabilities found by scanners", "It records identified risks with owners and treatment decisions"], 3, "A risk register records identified risks along with owners, ratings, and treatment decisions. It's broader than scan results, incident tickets, or audit findings, which may feed into it but aren't what it is.", 1], ["A security professional is asked to certify a control they never tested. Which response BEST fits professional ethics?", ["Decline until it has been tested", "Delegate certification to a junior colleague", "Certify it with a footnote", "Certify it on the manager's word"], 0, "Professional ethics require honest, competent service, so you shouldn't certify something untested. Certifying on someone's word, adding a footnote, or delegating the problem to a junior person all still assert something you haven't verified.", 1], ["A system's maximum tolerable downtime is 8 hours. Which recovery time objective is consistent with that?", ["10 hours", "12 hours", "24 hours", "3 hours"], 3, "Recovery time objective must be shorter than the maximum tolerable downtime so recovery completes before harm becomes unacceptable. Only 3 hours fits within 8; 10, 12, and 24 exceed the maximum tolerable downtime.", 2], ["A system has a recovery point objective of one hour. Which design satisfies it?", ["Replication or backups at least hourly", "A monthly offsite tape rotation", "A nightly full backup", "A weekly full plus daily incrementals"], 0, "A recovery point objective of one hour allows at most an hour of data loss, so data must be copied at least hourly. Nightly, weekly, or monthly backups would lose far more than an hour.", 2], ["A business needs to resume within minutes of a site loss. Which alternate site type fits?", ["Warm site", "Reciprocal agreement", "Hot site", "Cold site"], 2, "A hot site is equipped and running with current data, enabling recovery in minutes. Warm sites need data restoration, cold sites need equipment, and a reciprocal agreement depends on another organization's capacity.", 2], ["After malware is eradicated from affected servers, which incident response phase follows?", ["Preparation", "Detection", "Recovery", "Containment"], 2, "The incident response lifecycle flows from detection to containment to eradication to recovery. After eradication, systems are restored to normal operation. Preparation comes first and detection and containment come earlier.", 2], ["A review is held after recovery to examine what went well and what failed. What is its main purpose?", ["To restore the systems", "To improve future response", "To assign legal blame", "To recover lost data"], 1, "The post-incident review exists to learn what worked and what didn't so future response improves. It doesn't restore systems, recover lost data, or assign legal blame.", 2], ["Responders copy a compromised disk before analysis and work on the copy. Which principle does this protect?", ["System availability", "Data classification", "User privacy", "Evidence integrity"], 3, "Working on a copy preserves the original as untouched evidence, protecting its integrity for forensics and legal use. It doesn't relate to availability, classification, or user privacy.", 2], ["Which item is MORE a business continuity plan concern than a disaster recovery plan concern?", ["Restoring the production database from last night's backup", "Rebuilding the core network after the hardware failure", "Where staff will work if the office is unusable", "Re-addressing the failover servers at the alternate site"], 2, "Business continuity concerns keeping operations going, including where staff will work. Restoring databases, rebuilding networks, and re-addressing failover servers are technical recovery tasks under the disaster recovery plan.", 2], ["A group walks through a disaster scenario discussing roles and decisions without touching any systems. What is this?", ["Tabletop exercise", "Penetration test", "Full interruption test", "Parallel test"], 0, "A tabletop exercise is a discussion-based walkthrough of a scenario with no system changes. A penetration test attacks systems, a parallel test runs recovery systems alongside production, and a full interruption test actually disrupts operations.", 2], ["Who typically declares a disaster and activates the disaster recovery plan?", ["The external auditor reviewing continuity controls", "The software vendor supporting the main application", "Designated senior management", "The first help desk agent who sees the outage"], 2, "The plan assigns disaster declaration to designated senior management because it triggers major resource and business decisions. Help desk agents, vendors, and auditors lack that authority.", 2], ["Which of these is MOST clearly a incident?", ["A firewall logs a blocked scan", "A scheduled backup completes", "A user locks themselves out", "Ransomware executes on a file server"], 3, "Ransomware executing on a server actually jeopardizes availability and integrity, making it a incident. A blocked scan, a completed backup, and a user lockout are normal or minor events.", 2], ["A vault opens only when two employees each enter their own code at the same time. Which principle is this?", ["Job rotation", "Least privilege", "Dual control", "Need-to-know"], 2, "Dual control requires two people to act together to complete a sensitive action. Job rotation moves staff between roles, least privilege limits access, and need-to-know limits information.", 3], ["Staff are moved between roles periodically so hidden fraud is more likely to surface. What is this practice?", ["Need-to-know", "Least privilege", "Dual control", "Job rotation"], 3, "Job rotation moves people between roles so irregularities are likely to be discovered by their successors. Dual control needs two people at once, least privilege limits access, and need-to-know limits information.", 3], ["Why is discretionary access control weaker for confidentiality than mandatory access control?", ["The system enforces classification labels automatically", "Access depends only on a user's clearance level", "Administrators assign all roles centrally", "Owners can share objects beyond organizational policy"], 3, "In discretionary access control, owners decide who gets access and can share objects beyond organizational policy, weakening confidentiality. Mandatory access control enforces policy via labels so owners can't override it. The other statements describe mandatory access control or unrelated features.", 3], ["A user is placed in both the Finance and Auditors roles. Which concern does this raise?", ["The roles have not been authenticated by the system", "Conflicting roles undermine segregation of duties", "The roles will expire sooner than expected", "The user lacks enough privilege to perform either job"], 1, "Finance and Auditors are conflicting roles, since the same person could perform and then audit transactions, defeating segregation of duties. The other options describe authentication, expiration, or lack of privilege, which the scenario doesn't suggest.", 3], ["Which pair is NOT multi-factor authentication?", ["A password and a hardware token", "A personal identification number and a password", "A password and a phone push approval", "A fingerprint and a smart card"], 1, "A personal identification number and a password are both something you know, so they are one factor type. Password plus token or phone, and fingerprint plus smart card, each combine two different factor types.", 3], ["Which biometric error occurs when an unauthorized person is accepted as valid?", ["False acceptance", "Template aging", "Enrollment failure", "False rejection"], 0, "False acceptance means the system accepts an unauthorized person. False rejection blocks authorized people, enrollment failure is inability to register, and template aging is change over time.", 3], ["A new hire requests access to the payroll system. Which step should come FIRST?", ["Granting temporary administrator rights", "A quarterly review of existing access", "Account creation by the information technology service desk", "Manager approval of the access request"], 3, "Access should be approved by the requester's manager before information technology creates the account, because authorization precedes provisioning. Creating accounts first, granting admin rights, or waiting for a review skips proper control.", 3], ["Which practice BEST reduces risk from a shared administrator password?", ["Rotate the shared password yearly", "Store the password in the policy document", "Individual named admin accounts with logging", "Email the password to each admin"], 2, "Individual named accounts with logging create accountability and let you revoke one person's access. Rotating a shared password yearly, storing it in a document, or emailing it spreads it further and loses attribution.", 3], ["Which measure BEST prevents piggybacking at a busy lobby?", ["Quarterly audits of issued badges", "Monthly review of visitor logs by the guard supervisor", "A turnstile or mantrap with guard oversight", "Awareness posters placed near the lobby door"], 2, "Physical controls that admit one person at a time, such as turnstiles or mantraps with guards, directly stop piggybacking. Log reviews, audits, and posters only detect or discourage after the fact.", 3], ["Which measure BEST deters a casual intruder from approaching a facility?", ["Visible fencing and lighting", "Offsite backups of critical data", "Full-disk encryption on every laptop", "Account lockout after failed logins"], 0, "Visible fencing and lighting signal that the facility is protected and discourage casual intruders. Backups, laptop encryption, and account lockout protect data and accounts, not physical approach.", 3], ["Which is a logical access control?", ["A guard desk at reception", "A cable lock on a laptop", "File permissions on a shared drive", "A keycard reader at the server room door"], 2, "File permissions are enforced by a system, so they are a logical control. A guard desk, cable lock, and keycard reader are physical controls, even though a reader is electronic.", 3], ["A user opens a spreadsheet. Which labeling is correct?", ["Both are objects", "User: subject; spreadsheet: object", "Both are subjects", "User: object; spreadsheet: subject"], 1, "A user is the subject performing the action, and the spreadsheet is the object being accessed. The reversed or same-type labels are incorrect.", 3], ["An access control list lists a deny rule for Bob first and an allow rule for the Finance group second. Bob is in Finance. With first-match processing, what happens?", ["Bob is allowed", "Bob is denied", "Bob is prompted for approval", "Bob is allowed read-only"], 1, "With first-match processing, the first rule that applies to Bob, the deny, takes effect and later rules are not evaluated. Group membership in Finance doesn't override it.", 3], ["A technician needs administrator rights for 30 minutes to install software. Which approach is BEST?", ["Disabling the install prompt", "Sharing the admin password", "A permanent admin account", "Temporary elevation with logging"], 3, "Temporary elevation limits administrator rights to the needed time and records activity. A permanent admin account, shared password, or disabled prompts violate least privilege and accountability.", 3], ["Which control MOST directly mitigates online password guessing?", ["Account lockout or throttling", "A login security banner on each system", "Password expiration every 30 days", "Password history that blocks reuse of old passwords"], 0, "Lockout or throttling limits the number of guesses an attacker can make. Banners, expiration, and password history don't stop guessing attempts.", 3], ["Which finding from an access review MOST indicates privilege creep?", ["A long-tenured employee holds permissions from three past roles", "A new hire who has no access yet", "A contractor whose access expires on schedule", "An administrator who uses a dedicated admin account"], 0, "Privilege creep is the accumulation of permissions over time, such as an employee holding access from three past roles. The other items describe normal or proper states.", 3], ["A terminated employee's virtual private network token still works two weeks later. Which process failed?", ["Data classification", "Encryption", "Deprovisioning", "Identification"], 2, "If a terminated employee's token still works, the deprovisioning process failed to remove access at separation. It's not an identification, classification, or encryption problem.", 3], ["Which sequence correctly describes a file access?", ["Authenticate, account, authorize, identify", "Account, identify, authorize, authenticate", "Authorize, identify, authenticate, account", "Identify, authenticate, authorize, account"], 3, "Access control follows identification (claim), authentication (proof), authorization (permissions), and then accounting (recording). The other sequences put steps out of order.", 3], ["Under mandatory access control, a user with Secret clearance tries to read a Top Secret file. What happens?", ["Access depends on the file owner", "Access is granted with logging", "Access is denied", "Access is granted read-only"], 2, "Mandatory access control enforces clearance against classification, so Secret clearance can't read Top Secret regardless of owner or logging. Logging or read-only access doesn't override the policy.", 3], ["Which is a Crime Prevention through Environmental Design measure?", ["Deploying data loss prevention at the gateway", "Enforcing dual control for the vault", "Trimming shrubs to improve sight lines", "Installing a lock on a server rack"], 2, "Crime Prevention through Environmental Design uses environmental design such as trimming shrubs to improve visibility. Data loss prevention, dual control, and rack locks are technical, administrative, or physical controls unrelated to environmental design.", 3], ["Which visitor control is BEST?", ["A badge that never expires", "A paper sign-in sheet alone", "Escort and a visible badge that expires", "Verbal permission from reception"], 2, "Escorting visitors and giving visible, expiring badges controls who is on site and for how long. A non-expiring badge, a paper sheet alone, or verbal permission leave gaps.", 3], ["What is a drawback of single sign-on?", ["One compromised credential can reach many systems", "Authentication becomes slower for every login", "Users must remember many more passwords", "Systems can no longer be audited"], 0, "Single sign-on concentrates risk: one stolen credential can open many systems. It generally reduces the number of passwords and doesn't prevent auditing or necessarily slow authentication.", 3], ["A switch forwards frames based on media access control addresses. At which Open Systems Interconnection layer does it operate?", ["Layer 4", "Layer 2", "Layer 3", "Layer 1"], 1, "A switch forwards frames using media access control addresses at Layer 2, the data link layer. Routers use Internet Protocol at Layer 3, Layer 4 handles transport, and Layer 1 is physical.", 4], ["What is the data unit at the transport layer called?", ["Frame", "Bit", "Segment", "Packet"], 2, "At the transport layer, the data unit is a segment (or datagram for User Datagram Protocol). Packets belong to the network layer, frames to the data link layer, and bits to the physical layer.", 4], ["Which pairing of protocol and default port is correct?", ["Secure Shell: 22; Hypertext Transfer Protocol Secure: 443; Domain Name Service: 110", "Secure Shell: 22; Hypertext Transfer Protocol Secure: 443; Domain Name Service: 53", "Secure Shell: 22; Hypertext Transfer Protocol Secure: 80; Domain Name Service: 25", "Secure Shell: 23; Hypertext Transfer Protocol Secure: 443; Domain Name Service: 53"], 1, "Secure Shell uses 22, Hypertext Transfer Protocol Secure uses 443, and Domain Name Service uses 53. The other choices contain an incorrect port such as 23 for Secure Shell, 80 for Hypertext Transfer Protocol Secure, or 110 or 25 for Domain Name Service.", 4], ["Which protocol should replace Telnet for secure remote administration?", ["Hypertext Transfer Protocol", "File Transfer Protocol", "Simple Network Management Protocol version 1", "Secure Shell"], 3, "Secure Shell encrypts remote administration sessions, unlike Telnet which sends everything in cleartext. Hypertext Transfer Protocol and File Transfer Protocol are also unencrypted, and Simple Network Management Protocol version 1 is a management protocol, not remote access.", 4], ["Live video streaming tolerates some loss and prefers low overhead. Which transport protocol is typical?", ["Internet Control Message Protocol", "Transport Control Protocol", "User Datagram Protocol", "Address Resolution Protocol"], 2, "User Datagram Protocol is connectionless with low overhead and tolerates loss, which suits live streaming. Transport Control Protocol adds reliability and delay, while Internet Control Message Protocol and Address Resolution Protocol serve different functions.", 4], ["Which service automatically assigns Internet Protocol addresses to hosts?", ["Network address translation", "Dynamic Host Configuration Protocol", "Address Resolution Protocol", "Domain Name Service"], 1, "Dynamic Host Configuration Protocol automatically assigns Internet Protocol addresses. Domain Name Service resolves names, Address Resolution Protocol maps Internet Protocol to media access control addresses, and network address translation translates addresses.", 4], ["Which technology lets many private hosts share one public Internet Protocol address?", ["Network address translation", "Virtual local area network", "Virtual private network", "Demilitarized zone"], 0, "Network address translation translates private addresses to a public one so many hosts share it. Virtual local area networks group hosts, virtual private networks tunnel traffic, and a demilitarized zone hosts public services.", 4], ["A firewall tracks connection state to decide whether returning traffic is legitimate. Which type is this?", ["Application proxy only", "Stateless packet filter", "Web application firewall", "Stateful inspection firewall"], 3, "A stateful inspection firewall tracks connection state to judge whether returning traffic belongs to an established session. A stateless filter checks packets individually, a proxy mediates at the application level, and a web application firewall protects web applications.", 4], ["Which is a drawback of an inline intrusion prevention system?", ["A false positive can block legitimate traffic", "It only alerts after the traffic has passed", "It requires no tuning once it is installed", "It cannot detect any attacks without a security information and event management"], 0, "An inline intrusion prevention system can mistakenly block legitimate traffic if rules produce false positives. The other options contradict how intrusion prevention system works: it actively blocks, needs tuning, and detects attacks on its own.", 4], ["Which property of a virtual private network protects traffic on a hostile hotel network?", ["A static Internet Protocol address assigned to the laptop", "An encrypted tunnel to the corporate network", "Faster routing across the hotel network", "Domain Name Service caching on the local resolver"], 1, "A virtual private network's encrypted tunnel protects traffic from interception on an untrusted network. A static Internet Protocol, faster routing, or Domain Name Service caching don't provide confide
