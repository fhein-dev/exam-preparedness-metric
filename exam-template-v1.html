ntiality.", 4], ["Which statement BEST describes a benefit of virtual local area networks?", ["They assign Internet Protocol addresses to hosts", "They encrypt all traffic between hosts automatically", "They replace the need for firewalls", "They logically group hosts and limit broadcast domains"], 3, "Virtual local area networks logically group hosts and limit broadcast domains. They don't assign addresses, don't encrypt traffic, and don't replace firewalls.", 4], ["Where should an externally reachable mail gateway be placed?", ["On the management network", "In a demilitarized zone", "On the internal server virtual local area network", "On the guest Wi-Fi network"], 1, "A mail gateway reachable from outside belongs in a demilitarized zone so compromise doesn't expose the internal network. Internal, management, or guest networks are poor locations.", 4], ["Which statement BEST contrasts microsegmentation with a typical virtual local area network design?", ["Microsegmentation is used only for wireless networks", "Microsegmentation encrypts the trunks between virtual local area networks", "Microsegmentation replaces Internet Protocol addressing in the data center", "Microsegmentation applies policy to very small zones, down to workloads"], 3, "Microsegmentation applies policy to very small zones, down to individual workloads, while virtual local area networks segment more broadly. It isn't wireless-only, doesn't encrypt trunks, and doesn't replace Internet Protocol addressing.", 4], ["Which statement reflects zero trust?", ["Trust hosts that pass an initial perimeter scan", "Verify every request regardless of network location", "Trust requests that come from administrators", "Trust internal hosts by default inside the perimeter"], 1, "Zero trust verifies every request regardless of location, with no implicit trust for internal hosts, scanned hosts, or administrators.", 4], ["Which mitigation BEST addresses a volumetric flood of traffic?", ["Upstream scrubbing or content delivery network absorption", "Enforcing stronger passwords for all users", "Enabling account lockout on the login page", "Encrypting the disks on the web servers"], 0, "Volumetric floods are best handled upstream by scrubbing or content delivery networks that absorb traffic before it reaches your servers. Passwords, lockout, and disk encryption don't address bandwidth exhaustion.", 4], ["Which control BEST protects web sessions from man-in-the-middle attacks?", ["Longer passwords for every web account", "A stricter inbound firewall rule set", "Antivirus software on the web server", "Transport Layer Security with certificate validation"], 3, "Transport Layer Security with certificate validation encrypts and authenticates the connection, defeating an interceptor. Passwords, firewalls, and antivirus don't stop a man-in-the-middle.", 4], ["A malicious link arrives in a text message. What is this attack called?", ["Vishing", "Smishing", "Whaling", "Pharming"], 1, "Smishing is phishing via short message service text. Vishing uses voice calls, whaling targets executives, and pharming redirects users to fake sites via Domain Name Service manipulation.", 4], ["A phishing email is crafted for one finance manager using the names of her real colleagues. What is it called?", ["Spear phishing", "Smishing", "Whaling", "Pharming"], 0, "Spear phishing is targeted at a specific individual using personal details. Whaling targets senior executives, smishing uses texts, and pharming redirects traffic.", 4], ["Malware that replicates across networks without user action is a:", ["Trojan", "Bot", "Worm", "Ransomware"], 2, "A worm self-replicates across networks without user action. Trojans disguise themselves, bots take remote commands, and ransomware demands payment.", 4], ["Malware disguised as a useful program is a:", ["Rootkit", "Worm", "Bot", "Trojan"], 3, "A trojan masquerades as legitimate software. Worms self-spread, bots are remotely controlled, and rootkits hide malicious access.", 4], ["In a Software as a Service arrangement, who is responsible for patching the application?", ["Both equally in every case", "The customer", "The independent auditor", "The provider"], 3, "In Software as a Service, the provider runs and patches the application and infrastructure. Customers manage only limited settings, and auditors don't patch.", 4], ["Developers want to deploy code without managing operating system patching. Which model fits?", ["Platform as a Service", "Infrastructure as a Service", "Software as a Service", "Community cloud"], 0, "Platform as a Service lets developers deploy code while the provider manages the operating system and patching. Infrastructure as a Service leaves operating system management to the customer, Software as a Service provides finished applications, and community cloud is a deployment model.", 4], ["Which Wi-Fi security choice is the BEST?", ["Wi-Fi Protected Access with Temporal Key Integrity Protocol encryption", "Wired Equivalent Privacy with a long key", "Wi-Fi Protected Access 3 with strong credentials", "Hiding the service set identifier and filtering media access control addresses"], 2, "Wi-Fi Protected Access 3 provides the strongest current Wi-Fi security. Wired Equivalent Privacy and Wi-Fi Protected Access with Temporal Key Integrity Protocol are weak, and hiding the service set identifier or filtering media access control addresses doesn't provide meaningful protection.", 4], ["How long is an Internet Protocol version 6 address?", ["128 bits", "64 bits", "32 bits", "256 bits"], 0, "Internet Protocol version 6 addresses are 128 bits long. Internet Protocol version 4 uses 32 bits, and 64 or 256 bits aren't the address length.", 4], ["Data being processed in an application's memory is in which state?", ["Archived", "In use", "In transit", "At rest"], 1, "Data being processed in memory is data in use. At rest means stored, in transit means moving across a network, and archived means long-term storage.", 5], ["Which data state does Transport Layer Security primarily protect?", ["In use", "Archived", "At rest", "In transit"], 3, "Transport Layer Security protects data while it's moving across a network, which is data in transit. Data in use, at rest, or archived aren't what Transport Layer Security secures.", 5], ["Salting passwords before hashing mainly defends against:", ["Structured Query Language injection against the login form", "Precomputed rainbow-table attacks", "Man-in-the-middle attacks on login traffic", "Denial of service against the login server"], 1, "Salting adds unique random data to each password before hashing, defeating precomputed rainbow tables and making identical passwords hash differently. It doesn't address Structured Query Language injection, man-in-the-middle, or denial of service.", 5], ["Which practice BEST protects logs from tampering by an attacker with local admin rights?", ["Forward them to a remote write-once log server", "Compress them each night to save space", "Rename the log files so they are harder to find", "Store them in the same folder as the application"], 0, "Forwarding logs to a remote write-once server keeps an attacker with local admin from altering or deleting them. Compressing, renaming, or storing logs locally leaves them vulnerable.", 5], ["A critical patch is released. What should happen first?", ["Test in staging, then deploy via change control", "Wait for the next annual maintenance window", "Apply it only on the test systems and stop there", "Deploy it to every system the moment it is released"], 0, "A critical patch should be tested in staging and deployed through change control so it doesn't break production. Deploying instantly is risky, waiting a year leaves exposure, and patching only test systems doesn't fix production.", 5], ["Disabling unused services and default accounts on a new server is called:", ["Hardening", "Segmentation", "Patching", "Tokenization"], 0, "Hardening removes unnecessary services, accounts, and settings to reduce attack surface. Patching updates software, segmentation divides networks, and tokenization replaces sensitive data.", 5], ["How should an emergency change be handled?", ["Make it permanent without any later review", "Skip documentation because the situation is urgent", "Delay it until the next scheduled window", "Implement quickly but document and review it afterward"], 3, "Emergency changes may be implemented quickly but must still be documented and reviewed afterward. Skipping documentation, delaying, or making them permanent without review undermines control.", 5], ["Which measure BEST evaluates the effectiveness of phishing awareness training?", ["Phishing simulation results over time", "Tracking employee attendance at each session", "Counting the firewall rules added this quarter", "Counting the slides included in the training deck"], 0, "Phishing simulations measure behavior change over time, which shows whether training worked. Attendance, slide counts, and firewall rule counts don't measure effectiveness.", 5], ["Which is MOST reliable before disposing of a solid-state drive?", ["Deleting the files from the drive", "Running a quick format on the drive", "Cryptographic erase or physical destruction", "Degaussing the drive with a strong magnet"], 2, "For solid-state drives, cryptographic erase or physical destruction is reliable because degaussing doesn't work on flash storage, and deleting files or quick formatting leaves recoverable data.", 5], ["Retaining data longer than legally required MOST increases which risk?", ["More frequent password reuse", "Added network latency on every transfer", "More failed patch deployments", "Exposure if the data is breached or subpoenaed"], 3, "Keeping unneeded data increases exposure if it's breached or subpoenaed. It doesn't cause password reuse, latency, or patch failures.", 5], ["What is the core value of a security information and event management?", ["Correlating logs from many sources to detect patterns", "Encrypting stored logs at rest", "Blocking malicious traffic inline on the network", "Assigning user permissions across systems"], 0, "A security information and event management collects and correlates logs from many sources to detect patterns. It doesn't encrypt logs, block traffic inline, or assign permissions.", 5], ["Which activity attempts to exploit weaknesses to demonstrate real impact?", ["Security audit", "Vulnerability scan", "Risk assessment", "Penetration test"], 3, "A penetration test attempts to exploit weaknesses to demonstrate real impact. Scans identify weaknesses, audits assess compliance, and risk assessments analyze risk.", 5], ["A acceptable use policy primarily:", ["Sets expectations for how staff may use company systems", "Assigns data classifications to documents", "Lists the firewall rules for the perimeter", "Defines the recovery time objective for key systems"], 0, "A acceptable use policy sets expectations for how staff may use company systems. It doesn't assign classifications, list firewall rules, or define recovery objectives.", 5], ["Which backup type copies only data changed since the last full backup?", ["Incremental", "Differential", "Snapshot", "Mirror"], 1, "A differential backup copies data changed since the last full backup. An incremental copies changes since the last backup of any type, a snapshot is a point-in-time image, and a mirror is a live copy.", 5], ["Which audit is MOST independent?", ["One run by the information technology manager", "One run by the internal security team", "One run by an external third-party auditor", "One run by the system owner"], 2, "An external third-party auditor is the most independent because they have no stake in the results. Information technology managers, security staff, and system owners are assessing their own area.", 5], ["Which tool BEST detects unauthorized changes compared to a known-good state?", ["File integrity monitoring", "Data loss prevention", "Password manager", "Network tap"], 0, "File integrity monitoring compares files to a known-good baseline and alerts on unauthorized changes. Data loss prevention watches data movement, password managers store credentials, and taps copy traffic.", 5], ["Which log pattern MOST suggests credential stuffing?", ["A single account lockout for one user", "Many failed logins across many accounts from one source", "Successful logins at the start of each shift", "One failed login per user each day"], 1, "Credential stuffing tries leaked credentials against many accounts, producing many failed logins across accounts from one source. A single lockout, normal shift logins, or one failed login per user doesn't show that pattern.", 5], ["Which document specifies what categories of data are kept and for how long?", ["Records retention schedule", "Security baseline", "Incident response plan", "Acceptable use policy"], 0, "A records retention schedule states which data is kept and for how long. A baseline sets minimum configurations, a incident response plan guides response, and a acceptable use policy defines permitted use.", 5]];
const DQ={"1": [["A regional hospital and a small public library both ask their boards to approve the same security spending level, reasoning that each only needs 'adequate security.' Which critique best applies the Office of Management and Budget Circular A-130 idea of adequate security?", ["Protection should be limited to controls whose results auditors can measure, so identical spending is perfectly acceptable", "Protection should be scaled to the risk and the magnitude of potential harm, so identical spending ignores different stakes", "Protection should follow the lowest baseline used by peer organizations, so identical spending is the safest common choice", "Protection should be maximized first and justified afterward, so identical spending is too low for either organization"], 1, "Adequate security is security commensurate with the risk and the magnitude of harm from loss, misuse, unauthorized access, or modification. A hospital's potential harm to patients is larger than a library's, so one flat budget fits neither. Peer baselines, unlimited maximization, and 'whatever auditors can measure' are not the standard, because none of them ties protection to potential harm.", 1], ["A software firm lists servers and buildings in its asset register but omits its proprietary source code, reasoning that code is not physical. Later, the firm estimates the harm from a compromise of the code repository. Which statement is correct?", ["The source code is a record rather than an asset, and its value sets the classification but does not affect impact", "The source code is an asset only if it is registered as a trademark, and its value lowers the impact of a compromise", "The source code is an intangible asset, and its high value raises the impact of a compromise rather than its likelihood", "The source code becomes an asset only once it is sold, and its value raises the likelihood of a compromise rather than its impact"], 2, "Assets include intangible items such as intellectual property, so the code belongs in the register. Impact is the magnitude of harm if a threat exercises a vulnerability, and a more valuable asset means larger harm. Asset value does not change how likely an attack is, and neither trademark registration nor the word 'record' decides whether something is an asset.", 1], ["A courier loses a box of unencrypted backup tapes. The tapes are later found unopened, nothing on them was altered, and the company's systems stayed online throughout. Which objective was most directly put at risk?", ["Privacy, because the tapes left the building without a recorded individual owner", "Confidentiality, because unauthorized parties could have read the contents", "Integrity, because the tapes were outside the company's control for a period of time", "Availability, because the tapes were temporarily not accessible to the company's staff"], 1, "Confidentiality is the property that information is not made available or disclosed to unauthorized persons or processes. Readable tapes in unknown hands put exactly that at risk. Nothing was changed (integrity), the systems remained usable (availability), and privacy concerns an individual's control over distribution of information about themselves.", 1], ["A hospital's medication-dispensing system returns correct dose data every time, but a failing database makes each response take about forty seconds during emergencies. No one altered or viewed the data. Which objective is failing?", ["Non-repudiation, since late responses cannot be tied to the user who requested them", "Availability, since access must be timely and reliable for authorized users", "Confidentiality, since slow responses give more observers a chance to see the data", "Integrity, since correct data delivered late is no longer accurate for its stated purpose"], 1, "Availability means timely and reliable access to and use of information by authorized users, and forty-second delays during emergencies defeat 'timely.' The data remains accurate and complete, so integrity is intact, and nothing was disclosed or disputed, which rules out confidentiality and non-repudiation.", 1], ["An attacker alters an invoice total while it crosses the network. Separately, an unauthorized firmware change causes a server's logging agent to stop reporting without any error. Which pairing is correct?", ["Invoice change: confidentiality; firmware change: system integrity", "Invoice change: system integrity; firmware change: data integrity", "Invoice change: data integrity; firmware change: system integrity", "Invoice change: data integrity; firmware change: availability only"], 2, "Data integrity covers data in storage, processing, and transit, so an altered invoice in transit violates it. System integrity means the system performs its intended function unimpaired and free from unauthorized manipulation, which the firmware change breaks. Neither event is chiefly about disclosure, and the firmware problem is more than a simple availability loss.", 1], ["After a database import, the customer table has half its expected rows, and some addresses no longer match their accounts. No one attacked the system. Which property of information is most directly lacking?", ["Non-repudiation, because the import cannot be tied to one named operator who performed it", "Confidentiality, because incomplete records may be exposed to staff who should not see them", "Integrity, because the information is no longer complete, accurate, and internally consistent", "Availability, because the information can no longer be reached by authorized staff in a timely way"], 2, "Integrity means information is recorded, used, and maintained so that it stays complete, accurate, internally consistent, and useful for its stated purpose. Missing rows and mismatched addresses break completeness and consistency even without malice. The other properties concern access, denial of actions, or disclosure, none of which describes this failure.", 1], ["A contractor disputes an emergency spending approval, saying a colleague used their shared login. The company has only timestamps from the shared account. Which property, if present, would have prevented the dispute?", ["Non-repudiation, achieved by tying each action to a unique, verifiable identity with protected records", "Confidentiality, achieved by encrypting the approval records at rest in the company's database", "Data integrity, achieved by hashing the approval records on a nightly schedule for later comparison", "Availability, achieved by keeping the approval system online and responsive during every emergency"], 0, "Non-repudiation is the inability to deny taking an action such as approving information. It depends on unique identities and protected records, so one person cannot blame another. Encryption, hashing, and uptime protect other properties but would not show who performed the approval.", 1], ["A United States retailer ships to customers in Germany and stores their purchase histories securely. It then shares those histories with an advertising partner without telling the customers. Which statement best captures the problem?", ["Integrity is violated because the shared copy may differ from the original, and the regulation covers only payment data", "Confidentiality alone is violated because the histories were stored securely, and the regulation applies only inside Europe", "Availability is violated because customers lost access to their histories, and the regulation covers only health data", "Privacy is violated because customers lost control of distribution, a right the General Data Protection Regulation protects"], 3, "Privacy is an individual's right to control the distribution of information about themselves, and the General Data Protection Regulation treats personal privacy as an individual human right. Secure storage does not cure sharing without the customer's control. The regulation is not limited to Europe-based firms, payment data, or health data.", 1], ["A clinic stores patient names with diagnosis codes and also keeps a list of its employees' home addresses and birth dates. Which classification of the two data sets is most precise?", ["Patient records: personally identifiable information only; employee list: protected health information", "Both data sets: protected health information, because the clinic is a healthcare organization", "Patient records: protected health information; employee list: personally identifiable information", "Both data sets: payment card data, because the clinic bills for its services"], 2, "Protected health information concerns health status, provision of healthcare, or payment for healthcare. Employee addresses and birth dates distinguish or trace identity but are not health information, so they are personally identifiable information. Patient records are also identifiable, but the more precise category is protected health information.", 1], ["A bakery's online store keeps customers' card numbers in a spreadsheet and has never been assessed. Which standard governs how merchants and service providers must protect such data, and who administers it?", ["The National Institute of Standards and Technology guidance, published by the Department of Commerce", "The Health Insurance Portability and Accountability Act, administered by the federal department of health", "The Payment Card Industry Data Security Standard, administered by the Payment Card Industry Security Standards Council", "The General Data Protection Regulation, administered by the data protection authorities of the European Union"], 2, "The Payment Card Industry Data Security Standard applies to merchants and service providers who process credit or debit card transactions and is administered by the Payment Card Industry Security Standards Council. The other options govern personal privacy, health information, or general federal guidance rather than cardholder data.", 1], ["A vendor calls its login multi-factor because users enter a password and then the name of their first pet. A second system requires a password plus a code from an app on the user's enrolled phone. Which assessment is correct?", ["The first is single-factor because both items are something you know; the second combines knowledge and possession", "Neither counts, because multi-factor authentication requires a biometric to be one of the factors", "Both are multi-factor because each requires two separate pieces of evidence from the user", "The first is multi-factor because two secrets are required; the second is single-factor because software generates the code"], 0, "Multi-factor authentication uses two or more distinct instances of the three factors: something you know, have, and are. A password and a pet name are both knowledge, so that is single-factor. A password plus a phone-generated code adds possession. Biometrics are not required.", 1], ["A secure lab admits staff with a key fob and then confirms the person by iris pattern. An auditor asks what each element represents and what the overall act is called. Which answer is correct?", ["Fob: biometric, something you are; iris: token, something you have; the act is authorization", "Fob: token, something you know; iris: biometric, something you have; the act is identification", "Fob: biometric, something you have; iris: token, something you are; the act is accounting", "Fob: token, something you have; iris: biometric, something you are; the act is authentication"], 3, "A token is a physical object the user possesses and controls to authenticate identity, and a biometric is a biological characteristic such as an iris pattern. Verifying that the person is who they claim is authentication. Authorization would decide what they may then do.", 1], ["A manufacturer's board decides who may approve exceptions to security policy and how new policies are ratified, while the plant manager schedules which shifts patch which machines. Which labeling is correct?", ["Both sets are security governance because each involves security, and governance covers only financial reporting", "Neither is governance, because governance requires an outside auditor to set the organization's policies", "The board's decisions are security governance, a subset of governance; the plant manager's scheduling is operational management", "The plant manager's scheduling is governance, and the board's decisions are operational management"], 2, "Governance is how an organization is managed, including how decisions are made through policies, roles, and procedures. Security governance is the policies, roles, and processes used to make security decisions. Deciding who approves exceptions is governance; scheduling patch work carries decisions out.", 1], ["A catalog lists a rule that two managers must jointly approve large transfers, an account lockout after repeated failed logins, and a category that groups management, operational, and technical safeguards. Which labels are correct, in that order?", ["Technical control; administrative control; security controls", "Administrative control; technical control; baseline", "Administrative control; technical control; security controls", "Physical control; technical control; governance"], 2, "Joint approval is set by policy and procedure, so it is administrative. Account lockout is executed by the system, so it is technical. The collection of management, operational, and technical safeguards prescribed to protect confidentiality, integrity, and availability is called security controls.", 1], ["A coastal data center has an unprotected generator fuel line. A forecast storm could cut utility power, and no criminal group has shown interest in the site. Which statement is most accurate?", ["Neither is a threat because threats require a human actor; likelihood stays at zero until someone attacks it", "The storm is a threat and the fuel line is a vulnerability; likelihood depends on the storm exercising that weakness in its threat environment", "The storm is a vulnerability and the fuel line is a threat; likelihood depends on the skill of whoever might attack it", "The storm is an impact and the fuel line is a threat; likelihood depends on the value of the backup generator"], 1, "A threat is any circumstance or event with the potential to adversely affect operations or assets, which includes a storm. A vulnerability is a weakness that could be exploited, such as the exposed fuel line. Likelihood is the probability that a potential vulnerability may be exercised within the threat environment.", 1], ["A workshop facilitator asks experts to rate, from their own judgment on a five-point scale, how capable a threat is of exploiting a known weakness. Another analyst cites the chance that the same threat exploits it. Which pairing names the two?", ["Probability is the weighted, subjective rating; likelihood of occurrence is the chance of exploitation", "Likelihood of occurrence is the weighted, subjective rating; probability is the chance of exploitation", "Probability is the magnitude of harm; likelihood of occurrence is the weighted rating", "Likelihood of occurrence is the harm if exploited; probability is the experts' rating"], 1, "Likelihood of occurrence is a weighted factor based on a subjective analysis of the probability that a threat can exploit a vulnerability. Probability is the chance that a given threat is capable of exploiting a vulnerability. Neither one is the magnitude of harm, which is impact.", 1], ["A power utility's board says information security risk concerns only the utility's own servers. Which broader view matches the glossary definition?", ["The potential adverse impacts extend to shareholders, insurers, and regulators who hold a financial interest", "The potential adverse impacts extend to operations, assets, individuals, other organizations, and even the nation", "The potential adverse impacts extend to the organization's operations and reputation but not beyond its boundaries", "The potential adverse impacts extend to hardware and software but not to the information they hold"], 1, "Information security risk is defined by potential adverse impacts to an organization's operations, assets, individuals, other organizations, and even the nation. For a utility, harm can reach customers and national safety, so limiting the view to servers or to the organization itself is too narrow.", 1], ["One team lists threats and vulnerabilities for a new application but ignores existing controls. Another team also considers controls already in place or planned. Which statement best evaluates the two?", ["The second team follows risk assessment because it considers mitigations in place or planned; risk measures how threatened an entity is", "Neither follows risk assessment because it requires a quantitative result; risk measures the number of incidents", "Both follow risk assessment because it only requires listing threats; risk measures the cost of controls", "The first team follows risk assessment because controls are considered only during risk treatment; risk measures the value of assets"], 0, "Risk assessment identifies and analyzes risks while incorporating threat and vulnerability analyses and considering mitigations provided by security controls planned or in place. Risk is a measure of the extent to which an entity is threatened by a potential circumstance or event.", 1], ["An organization frames its context, assesses risks, selects responses, and reviews quarterly whether those responses still work. Which statement names the phases correctly?", ["Assessment, treatment, monitoring, and transference; choosing the best response to an identified risk is risk acceptance", "Context, assessment, treatment, and monitoring; choosing the best response to an identified risk is risk treatment", "Context, avoidance, mitigation, and monitoring; choosing the best response to an identified risk is risk assessment", "Assessment, context, auditing, and monitoring; choosing the best response to an identified risk is risk tolerance"], 1, "Risk management covers risk context (framing), risk assessment, risk treatment, and risk monitoring. Risk treatment is the determination of the best way to address an identified risk, choosing among options such as mitigation, transference, avoidance, and acceptance.", 1], ["A federal agency wants a documented, structured approach that guides how it oversees and manages risk across the enterprise, rather than a single analysis technique. Which term describes this approach?", ["Risk assessment methodology", "Risk treatment plan", "Risk management framework", "Risk tolerance statement"], 2, "A risk management framework is a structured approach used to oversee and manage risk for an enterprise. A risk assessment methodology covers only the analysis step, a treatment plan covers responses, and a tolerance statement only states the level of risk the organization will assume.", 1], ["A bank assigns a statistical yearly chance and a dollar loss to each fraud type, while a nonprofit labels its risks low, medium, or high because it lacks reliable loss data. Which pairing is correct?", ["Bank: quantitative risk analysis; nonprofit: risk transference", "Bank: risk assessment only; nonprofit: risk treatment only", "Bank: qualitative risk analysis; nonprofit: quantitative risk analysis", "Bank: quantitative risk analysis; nonprofit: qualitative risk analysis"], 3, "Quantitative risk analysis assigns numerical values to impact and likelihood based on statistical probabilities and monetarized loss. Qualitative risk analysis assigns descriptors such as low, medium, or high. Transference, assessment, and treatment are not analysis methods in that sense.", 1], ["A board states it will not carry more than $200,000 a year of loss from any category, and later chooses to carry a $30,000 exposure without adding controls. Which labels apply?", ["Ceiling: risk treatment (also called threshold); carrying the $30,000: risk mitigation", "Ceiling: risk tolerance (also appetite or threshold); carrying the $30,000: risk acceptance", "Ceiling: risk acceptance (also appetite or threshold); carrying the $30,000: risk tolerance", "Ceiling: risk transference (also called appetite); carrying the $30,000: risk avoidance"], 1, "Risk tolerance is the level of risk an entity is willing to assume, and risk threshold, risk appetite, and acceptable risk are used synonymously with it. Risk acceptance is the decision to perform the business function with no other action because the benefits outweigh the risk.", 1], ["A company discontinues one product line, buys insurance for another, and adds multi-factor authentication to a third to address the same type of threat. Which pairing is correct?", ["Discontinuing: avoidance; insurance: transference; multi-factor authentication: mitigation", "Discontinuing: transference; insurance: avoidance; multi-factor authentication: mitigation", "Discontinuing: mitigation; insurance: transference; multi-factor authentication: avoidance", "Discontinuing: avoidance; insurance: mitigation; multi-factor authentication: transference"], 0, "Risk avoidance means not performing the function because the risk outweighs the benefit. Risk transference means paying an external party to accept financial impact. Risk mitigation means putting controls in place to reduce impact or likelihood, which is what multi-factor authentication does.", 1], ["A contractor needs security guidance from the federal organization within the Department of Commerce that measures science and technology, and also wants voluntary international standards developed with the International Electro-technical Commission and the International Telecommunication Union. Which pairing is correct?", ["International Organization of Standards; Institute of Electrical and Electronics Engineers", "Institute of Electrical and Electronics Engineers; Internet Engineering Task Force", "Internet Engineering Task Force; National Institute of Standards and Technology", "National Institute of Standards and Technology; International Organization of Standards"], 3, "The National Institute of Standards and Technology is part of the United States Department of Commerce and publishes security guidance. The International Organization of Standards develops voluntary international standards with its partners the International Electro-technical Commission and the International Telecommunication Union. The other pairings assign these roles to bodies with different focuses.", 1], ["A pharmacy chain applies strong controls to its marketing website but leaves the prescription database on default settings. Which statement best shows why this fails the idea of adequate security?", ["Protection is excessive for the website, because marketing content should never receive any safeguards", "Protection is out of proportion to risk, because the asset whose compromise would cause the most harm has the weakest safeguards", "Protection is inconsistent only because the two systems use different vendors for their respective safeguards", "Protection is adequate because a strong control on any one system satisfies the requirement for the whole organization"], 1, "Adequate security is commensurate with the risk and the magnitude of harm that loss, misuse, unauthorized access, or modification could cause. A prescription database holds far more potential harm than marketing content, so leaving it weakest is a mismatch between protection and risk.", 1], ["A policy says new accounts require manager approval. The identity system refuses to create any account without a recorded approval. An auditor asks how to label the policy and the refusal. Which labeling is correct?", ["The policy is a technical control; the refusal is an administrative control that enforces it", "The policy is an administrative control; the refusal is a technical control that enforces it", "The policy is a physical control; the refusal is a technical control that enforces it", "The policy is an administrative control; the refusal is a physical control that enforces it"], 1, "Administrative controls are implemented through policy and procedures and are often enforced in conjunction with physical or technical controls. The identity system executes the refusal by itself, which makes it a technical control. Nothing tangible like a lock or guard is involved.", 1], ["A new analyst values only hardware in an asset register because 'you cannot put a price on ideas.' The firm's brand-new proprietary pricing model is its main competitive advantage. Which correction fits the glossary?", ["Assets include only items with a purchase price, so the pricing model is excluded until it has been sold to a customer", "Assets include only physical property and information systems, so the model is a record held by the firm instead", "Assets include tangible items and intangible ones such as intellectual property, so the pricing model belongs in the register", "Assets include intangible items only after they have been registered with a government office or standards body"], 2, "An asset is anything of value that is owned by an organization, and the glossary names both tangible assets, like information systems and physical property, and intangible assets, like intellectual property. Risk analysis that ignores the pricing model would understate potential harm.", 1], ["A factory's control gateway receives start commands that must be confirmed as truly coming from the central station and not forged by someone on the network. Which concept covers this confirmation?", ["Non-repudiation, which prevents the central station from denying that it sent commands", "Privacy, which lets the central station control the distribution of information about itself", "Authorization, which grants the central station the right to use gateway resources", "Authentication, which verifies the validity of a transmission, message, or originator"], 3, "Authentication is the act of identifying or verifying the eligibility of a station, originator, or individual, and typically protects against fraudulent transmissions by establishing the validity of a transmission or originator. Authorization concerns what the verified party may do afterward.", 1], ["Which situation is a loss of availability rather than a loss of integrity or confidentiality?", ["An attacker alters a supplier's invoice total before the payment is released to the vendor account", "A laptop holding unencrypted donor lists is left behind on a commuter train and never recovered", "A ransomware infection locks the shared drive, though the files are not changed or read by anyone", "An employee copies customer notes into a personal cloud account without permission from anyone"], 2, "Availability means timely and reliable access by authorized users, and ransomware that locks files removes that access while leaving contents unread and unaltered. Altered totals concern integrity, and lost or copied lists concern confidentiality.", 1], ["A bank wants an authentication factor that a teller cannot hand to a colleague the way a card or fob can be handed over. Which factor fits, and why?", ["A password, because it is a secret that only the user is expected to know and remember", "A token, because it is a physical object that the user possesses and controls for authentication", "A badge number, because it is an identifier printed on the user's card and shared with security staff", "A biometric, because it is a biological characteristic of the individual such as a fingerprint or iris pattern"], 3, "Biometrics are biological characteristics of an individual, such as a fingerprint, hand geometry, voice, or iris pattern, which makes them 'something you are' and not transferable like a token. A token is something you have, which can be lent or stolen.", 1], ["A law firm worries that a stolen laptop will reveal its case files. Which control choice is most directly aimed at confidentiality?", ["Encrypting the case files so unauthorized persons cannot read them", "Hashing the case files so that any later change would be detectable", "Adding redundant servers so the case files remain reachable during outages", "Signing the case files so their authors cannot deny having written them"], 0, "Confidentiality means information is not disclosed to unauthorized persons or processes, and encryption turns files into ciphertext that only permitted people can read. Redundancy supports availability, hashing supports integrity, and signing supports non-repudiation.", 1], ["Payment messages cross a partner's network, and the amounts must not be altered along the way. Which measure best preserves data integrity in transit?", ["Compressing each message so that it crosses the partner network faster than before it was sent", "Checking a digital signature or message digest on each message to detect any alteration", "Increasing the bandwidth of the link so that messages arrive without any noticeable delay at all", "Posting a banner on the partner network warning that tampering with messages is against the law"], 1, "Data integrity is the property that data has not been altered in an unauthorized manner, including in transit. A message digest changes completely if a single bit changes, and a digital signature adds origin authentication, so both reveal tampering. Compression, speed, and warnings do not.", 1], ["A counsel summarizes a law as 'comprehensive 2016 European Union legislation that treats personal privacy as an individual human right.' Which pairing of this law and a different standard it should not be confused with is correct?", ["General Data Protection Regulation, not to be confused with the Payment Card Industry Data Security Standard for card processors", "Health Insurance Portability and Accountability Act, not to be confused with the General Data Protection Regulation for card data", "General Data Protection Regulation, not to be confused with the health privacy rules that define protected health information in Europe", "Payment Card Industry Data Security Standard, not to be confused with the General Data Protection Regulation for health records"], 0, "The General Data Protection Regulation is the 2016 European Union legislation addressing personal privacy as an individual human right. The Payment Card Industry Data Security Standard is a separate industry standard for merchants and service providers that process card transactions.", 1], ["After an incident, a board member asks, 'Who decided exceptions to the patching policy would never be reviewed?' The records show nobody owned the question. Which concept failed?", ["Incident response, because detection and analysis of the problem were delayed for several days after it began", "Security governance, because the policies, roles, and processes for security decisions were not clearly assigned", "Configuration management, because changes were made to systems without any authorization or validation", "Risk acceptance, because the organization chose to carry a known exposure with no further action taken"], 1, "Governance is how an organization is managed, including how decisions are made through policies, roles, and procedures, and security governance is the entirety of the policies, roles, and processes used to make security decisions. A decision with no owner is a governance gap.", 1], ["Two analysts debate a lost laptop of customer data. One says the harm would be severe. The other says nobody is likely to find or open it. Which pairing names what each is discussing?", ["First: probability; second: classification", "First: criticality; second: sensitivity", "First: impact; second: likelihood", "First: likelihood; second: impact"], 2, "Impact is the magnitude of harm that could be caused if a threat exercises a vulnerability, and likelihood is the probability that a potential vulnerability may be exercised within the threat environment. Risk depends on weighing both, not on either one alone.", 1], ["A hospital supply-chain system is disrupted, delaying deliveries to three other hospitals and a regional ambulance service. Which description of information security risk fits best?", ["Potential adverse impacts reach operations, individuals, other organizations, and even the nation beyond the one owner", "Potential adverse impacts reach only the people employed by the hospital whose systems were disrupted that week", "Potential adverse impacts reach only the hospital's own servers and the data stored on those servers at that site", "Potential adverse impacts reach only the organization's financial results and its published reputation in the market"], 0, "The glossary defines information security risk by potential adverse impacts to operations, assets, individuals, other organizations, and even the nation. A disruption that delays other hospitals and ambulance services fits that broad reach.", 1], ["A reviewer states: 'Information integrity is about complete, accurate, consistent records, while system integrity is about a system working as intended without unauthorized manipulation.' Which example pair matches these two ideas?", ["A tape lost in transit and recovered unopened; a server that was taken offline for planned maintenance", "A report published too late; a server that was replaced with a faster model on the planned date", "A password written on a note; a server that was patched during an approved change window", "Records missing half their rows after an import; a server whose firmware was altered without approval"], 3, "Integrity of information means it is complete, accurate, and internally consistent, which missing rows violate. System integrity means the system performs its intended function unimpaired and free from unauthorized manipulation, which unapproved firmware changes violate. The other examples concern disclosure, approved changes, or timing.", 1], ["A report lists risk ratings of high, medium, and low that experts assigned by judgment, with no statistics or dollar values. Which two terms apply?", ["Qualitative risk analysis, using a subjective, weighted likelihood of occurrence", "Qualitative risk analysis, using a statistical measure of probability from loss data", "Quantitative risk analysis, using a subjective, weighted measure of impact only", "Quantitative risk analysis, using a statistical, monetarized likelihood of occurrence"], 0, "Qualitative risk analysis assigns descriptors such as low, medium, or high, and likelihood of occurrence is a weighted factor based on subjective analysis. Quantitative analysis would assign numerical and monetary values using statistical probabilities.", 1], ["Which scenario meets the definition of multi-factor authentication?", ["A password followed by answers to personal security questions", "A passphrase followed by a four-digit personal identification number", "A smart card touched to a reader followed by a fingerprint scan", "Two different passwords entered one after the other"], 2, "Multi-factor authentication uses two or more distinct instances of the three factors: something you know, something you have, and something you are. A smart card is something you have and a fingerprint is something you are. The other options use two items of the same type, something you know, so they remain single-factor.", 1], ["A company wants its purchasing system to give non-repudiation for approved orders. Which design best supports that goal?", ["Unique user identities, digitally signed approvals, and protected audit records", "Shared department accounts, encrypted backups, and daily approval summaries", "Strong passwords, mandatory vacations, and weekly reminders about policy", "Role-based groups, redundant servers, and a published acceptable-use policy"], 0, "Non-repudiation is the inability to deny taking an action such as approving information. It needs approvals tied to a specific verified identity through unique accounts, signatures, and records that cannot be altered. Shared accounts or generic controls leave room for denial.", 1], ["A neighborhood bakery takes card payments in store and online. Which statement about the Payment Card Industry Data Security Standard is correct?", ["It applies to merchants and service providers that process credit or debit card transactions", "It applies only to banks that issue credit cards to consumers and business customers", "It applies only to European Union firms that process personal data of their residents", "It applies only to healthcare organizations that store payment records for patient care"], 0, "The Payment Card Industry Data Security Standard is administered by the Payment Card Industry Security Standards Council and applies to merchants and service providers who process credit or debit card transactions, which includes a small bakery.", 1], ["Which of these data elements is most clearly personally identifiable information on its own?", ["A server hostname used by the information technology team internally", "A product code listed in a public online catalog", "A generic company mailing address printed on public marketing materials", "A date and place of birth combined with a mother's maiden name"], 3, "Personally identifiable information is any information that can distinguish or trace an individual's identity, such as name, Social Security number, date and place of birth, or mother's maiden name, plus information linked or linkable to an individual. Business addresses, hostnames, and catalog codes do not identify a person.", 1], ["A customer asks a company to stop sharing her purchase history with partners, though the history is stored securely. Which concept is she asserting?", ["Availability, the property that data is reachable by authorized users in a timely way", "Confidentiality, the property that data is not disclosed to unauthorized persons or processes", "Integrity, the property that data is complete, accurate, and internally consistent", "Privacy, the right of an individual to control the distribution of information about herself"], 3, "Privacy is the right of an individual to control the distribution of information about themselves. Her complaint is about who receives the data, not about whether hackers can read it, which is the separate question of confidentiality.", 1], ["Which item is protected health information as the glossary defines it?", ["A record of a patient's insurance payment for a clinic visit", "A vendor's published price list for medical supplies", "A public notice of the clinic's opening hours", "A clinic's list of employees' home addresses used for payroll"], 0, "Protected health information covers information regarding health status, the provision of healthcare, or payment for healthcare as defined in the Health Insurance Portability and Accountability Act. A patient's insurance payment for care qualifies. Employee addresses are personally identifiable information, not health information.", 1], ["A finance team multiplies a statistical yearly chance by an estimated dollar loss for each risk, and then compares results with the cost of controls. Another team ranks the same risks by judgment into three bands. Which pairing is correct?", ["First team: quantitative analysis; second team: qualitative analysis", "First team: risk tolerance; second team: risk acceptance", "First team: qualitative analysis; second team: quantitative analysis", "First team: risk assessment; second team: risk treatment"], 0, "Quantitative risk analysis assigns numerical values to impact and likelihood based on statistical probabilities and monetarized loss, and qualitative risk analysis assigns descriptors such as low, medium, or high.", 1], ["A manager says, 'We mitigated the exposure from our legacy product by shutting it down.' Which response is most accurate?", ["Shutting it down is risk avoidance, because the function is no longer performed; mitigation would add controls while continuing", "Shutting it down is risk mitigation, because any reduction of exposure counts as mitigation of that risk for the company", "Shutting it down is risk acceptance, because the company chose to live with the legacy product's weaknesses", "Shutting it down is risk transference, because the exposure moves away from the company's own systems and staff"], 0, "Risk avoidance is not performing the business function because the risk outweighs the benefit. Risk mitigation means putting security controls in place to reduce impact or likelihood while the function continues.", 1], ["A company buys a policy that reimburses breach costs and then tells its board, 'The risk has been removed.' Which statement best corrects this?", ["Transference is a form of mitigation, so the policy reduces the likelihood of any breach occurring at all", "Transference is a form of avoidance, so the activity creating the risk must stop immediately at once", "Transference pays an external party to accept financial impact; the underlying risk still has to be treated and managed", "Transference removes the vulnerability, so no further treatment of the underlying risk is required by anyone"], 2, "Risk transference is paying an external party to accept the financial impact of a given risk. It does not remove the vulnerability, and risk treatment, the choice of the best way to address a risk, still applies to the exposure that remains.", 1], ["Which activity is outside the four phases of risk management described in the glossary?", ["Framing the risk context for the organization before any analysis", "Monitoring whether treatment choices still work over time", "Assessing the risks to operations and assets of the organization", "Writing an incident response plan for a malicious cyberattack"], 3, "Risk management covers risk context, risk assessment, risk treatment, and risk monitoring. An incident response plan is a separate planning document, and the structured approach that organizes the phases for an enterprise is the risk management framework.", 1], ["A board says it will accept at most one significant loss event per year across all categories. Later it decides to proceed with a project whose remaining risk fits that limit and adds no more controls. Which labels apply?", ["The limit is risk treatment, also called risk threshold; proceeding with no further action is risk avoidance", "The limit is risk assessment, also called risk appetite; proceeding with no further action is risk transference", "The limit is risk acceptance, also called risk appetite; proceeding with no further action is risk tolerance", "The limit is risk tolerance, also called risk appetite; proceeding with no further action is risk acceptance"], 3, "Risk tolerance is the level of risk an entity is willing to assume, and risk threshold, risk appetite, and acceptable risk are used synonymously. Risk acceptance is determining that benefits outweigh the risk and performing the function with no other action.", 1], ["A framework groups safeguards into management, operational, and technical categories. A reviewer asks what the whole group is called and what a firewall rule belongs to. Which answer is correct?", ["The group is security controls; a firewall rule is a technical control", "The group is a risk register; a firewall rule is a managerial control", "The group is governance; a firewall rule is a physical control", "The group is a baseline; a firewall rule is an administrative control"], 0, "Security controls are the management, operational, and technical safeguards prescribed for a system to protect confidentiality, integrity, and availability. A firewall rule is executed by the system's hardware or software, so it is a technical control.", 1], ["Which statement identifies a vulnerability and not a threat?", ["A server has an unpatched flaw that attackers could exploit", "A disgruntled contractor is planning to delete files", "A criminal group is preparing to send phishing emails", "A severe storm is forecast to cut power to the data center"], 0, "A vulnerability is a weakness in a system, procedures, or controls that could be exploited, such as an unpatched flaw. A threat is any circumstance or event with the potential to adversely impact operations or assets, including a storm, a criminal group, or a contractor with intent.", 1], ["Which statement correctly relates the two standards organizations to their roles?", ["The National Institute of Standards and Technology issues security publications for federal use; the International Organization of Standards develops voluntary international standards", "Both organizations develop only protocol standards for the Internet through consensus among network designers", "Both organizations are professional societies that publish standards only for telecommunications engineering", "The International Organization of Standards issues security publications for federal use; the National Institute of Standards and Technology develops voluntary international standards"], 0, "The National Institute of Standards and Technology is part of the United States Department of Commerce and sets standards including information security. The International Organization of Standards develops voluntary international standards with the International Electro-technical Commission and the International Telecommunication Union.", 1], ["A manager defines risk as 'the fact that an attacker exists somewhere.' Which correction best fits the glossary?", ["Risk is a method that assigns descriptors such as low, medium, or high to potential events for later ranking", "Risk is the magnitude of harm caused by a threat's exercise of a vulnerability, with no weight given to its chance", "Risk is the level of exposure an organization is willing to assume in order to reach its goals, as set by the board", "Risk is a measure of how far an entity is threatened by a potential circumstance or event, not merely the existence of an attacker"], 3, "Risk is a measure of the extent to which an entity is threatened by a potential circumstance or event. Impact is the magnitude of harm, risk tolerance is the level willing to be assumed, and qualitative analysis is one method of assessing risk.", 1]], "2": [["One night a monitoring system records a user's normal login and a defacement of the public web page. Which classification is most accurate?", ["The login is an incident; the defacement is a breach because the page lists some customer names", "The login is an adverse event; the defacement is only an event because the server stayed online and reachable", "Both are incidents because any observable occurrence jeopardizes availability for the people watching", "The login is an event only; the defacement is an adverse event and an incident because integrity was jeopardized"], 3, "An event is any observable occurrence. Events with negative consequences, such as web page defacement, are adverse events. An event that actually or potentially jeopardizes confidentiality, integrity, or availability is an incident, which the defacement does. A routine login is an event but not adverse.", 2], ["An insurance employee with legitimate system access opens a neighbor's claim file out of curiosity, with no job purpose. The file contains personally identifiable information. Which statement matches the National Institute of Standards and Technology breach definition?", ["It becomes a breach only if the employee copies the file outside the company's own network", "It cannot be a breach because the employee already held authorized access to the claims system", "It is an intrusion because the employee gained access to the file without any real authorization", "It can be a breach because an authorized user accessed personally identifiable information without an authorized purpose"], 3, "A breach includes an authorized user accessing personally identifiable information for other than an authorized purpose. Holding system access does not excuse curiosity access, copying is not required, and an intrusion involves unauthorized access to the system, which this employee did not need.", 2], ["Over an hour, an outsider repeatedly guesses credentials against a file share and fails every time. Which term best fits an event or combination of events that is an incident in which someone gains or attempts to gain unauthorized access?", ["Payload", "Intrusion", "Breach", "Exploit"], 1, "An intrusion is a security event, or combination of events, that constitutes an incident in which an intruder gains or attempts to gain access to a system without authorization, so failed attempts still count. A breach concerns personally identifiable information, an exploit is a particular attack on a vulnerability, and a payload is the malicious action itself.", 2], ["A security team spots suspicious outbound traffic, confirms it, and isolates the host while following a pre-written set of steps. Which pairing names the activity and the document?", ["The activity is disaster recovery; the document is the incident response plan", "The activity is business continuity; the document is the disaster recovery plan", "The activity is incident response; the document is the business continuity plan", "The activity is incident response; the document is the incident response plan"], 3, "Incident response is the process of detecting and analyzing incidents to limit their effect, and the incident response plan is the documented set of predetermined steps for detecting, responding to, and limiting the consequences of a malicious cyberattack. Disaster recovery and business continuity address restoring technology and sustaining operations.", 2], ["During a long network outage, a call center moves staff to a backup site and uses paper forms, following a document written months earlier. Which pairing is correct?", ["Moving staff and using paper is disaster recovery; the earlier document is the disaster recovery plan", "Moving staff and using paper is business continuity; the earlier document is the business impact analysis", "Moving staff and using paper is incident response; the earlier document is the incident response plan", "Moving staff and using paper is business continuity; the earlier document is the business continuity plan"], 3, "Business continuity is the set of actions, processes, and tools that let critical operations continue during a contingency, and the business continuity plan documents the predetermined instructions. Disaster recovery would restore the network itself, and a business impact analysis ranks priorities rather than giving operating instructions.", 2], ["A retailer is deciding recovery order. Its order platform earns all revenue and depends on a payment gateway, while its staff intranet earns nothing. Which statement correctly links the concepts?", ["The risk assessment sets recovery order; the order platform's high sensitivity places it first", "The disaster recovery plan maps dependencies; the order platform's high likelihood places it first", "The business impact analysis maps dependencies and priorities; the order platform's high criticality places it first", "The business impact analysis lists threat actors; the order platform's high classification places it first"], 2, "A business impact analysis characterizes requirements, functions, and interdependencies to set contingency priorities. Criticality measures how much the mission depends on a system, which is what ranks the order platform first. Classification and sensitivity concern disclosure harm, and likelihood concerns the chance of exploitation.", 2], ["A fire destroys a server room. Technicians restore servers and network links by following written procedures in the order the business impact analysis set. Which statement is correct about the work and why the event qualifies?", ["Incident response restores information technology and communications, and this is a disaster because some data was lost permanently", "Disaster recovery sustains all mission processes, and this is a disaster because a security incident occurred on the company's premises", "Business continuity restores information technology and communications, and this is a disaster because any fire is a disaster by definition under the glossary", "Disaster recovery restores information technology and communications, and this is a disaster because a critical function cannot be performed acceptably in the set period"], 3, "Disaster recovery is the set of activities to restore information technology and communications services, and the disaster recovery plan documents them. A disaster exists when a critical business function cannot be performed at an acceptable level within a predetermined period after a disruption, not simply because a fire occurred.", 2], ["An analyst argues that every malware detection is automatically a breach. Which response is most accurate?", ["A detection is an incident only if the malware succeeds in running, and a breach means any unauthorized program executed on any system", "A detection is only an adverse event, and a breach means any incident that interrupts business operations for more than an hour", "A detection is a breach once a firewall logs it, and an incident requires a written report to the board of directors", "A detection is an incident if it actually or potentially jeopardizes confidentiality, integrity, or availability; a breach also involves personally identifiable information"], 3, "An incident actually or potentially jeopardizes confidentiality, integrity, or availability, even if the attack has not yet succeeded. A breach in the National Institute of Standards and Technology definition concerns unauthorized access to or misuse of personally identifiable information, so malware detection alone does not establish one.", 2], ["Ransomware encrypts file servers while the offline backups remain intact. Which ordering of documents is most appropriate?", ["Disaster recovery plan first, then the incident response plan, while the business impact analysis sustains critical work", "Incident response plan first, then the business impact analysis for restoration, while the disaster recovery plan sustains critical work", "Incident response plan first, then the disaster recovery plan for restoration, while the business continuity plan sustains critical work", "Business continuity plan first, then the business impact analysis, while the incident response plan restores servers"], 2, "The incident response plan guides detecting and containing the attack, the disaster recovery plan guides restoring information technology services, and the business continuity plan keeps critical operations running in the meantime. Restoring before containing risks reinfection, and a business impact analysis is an analysis, not an operating plan.", 2], ["In one hour a system records a scheduled backup, unauthorized use of a service account's privileges, and a packet flood absorbed by the firewall. Which statement is most accurate?", ["Only the flood is an event; the backup and the privilege use are both breaches of policy", "All three are adverse events because each of them changed the state of a system", "All three are events; the privilege use and the flood are adverse events; the backup is routine", "Only the privilege use is an event; the backup and the flood are both incidents requiring written reports"], 2, "An event is any observable occurrence. Adverse events are events with negative consequences, and the glossary lists unauthorized use of privileges and network packet floods among them. A scheduled backup is a normal event without negative consequences.", 2], ["Executives debate restoring the confidential merger database before the order system after a disaster. Which measure should rank the recovery order?", ["Classification, since recovery order follows how much harm disclosure would cause", "Sensitivity, since recovery order follows the importance the owner assigned to protecting the data", "Likelihood, since recovery order follows the chance that each system will fail again", "Criticality, since recovery order follows how much the mission depends on each system"], 3, "Criticality measures the degree to which an organization depends on a system for the success of a mission or business function, which is what should drive restoration order. Classification and sensitivity concern protecting information from disclosure, and likelihood concerns exploitation.", 2], ["Which scenario is business continuity rather than disaster recovery?", ["A team rebuilds the failed network core switch at the primary site using spare hardware on hand", "An engineer fails over the servers to the alternate data center after the primary site lost power", "A hospital switches to paper charting and diverts ambulances while its records system is rebuilt", "A technician restores the records database from last night's backup onto replacement storage hardware"], 2, "Business continuity is the set of actions, processes, and tools that let an organization continue critical operations during a contingency. Restoring databases, rebuilding switches, and failing over servers restore information technology and communications, which is disaster recovery.", 2], ["A manager says the business impact analysis will be used to choose the cheapest insurance policy. Which correction fits the glossary?", ["A business impact analysis characterizes requirements, functions, and interdependencies to set recovery priorities, not to choose insurance", "A business impact analysis lists the threat actors likely to attack, so it is the basis for choosing which insurance to buy", "A business impact analysis documents the step-by-step response to a cyberattack, so it replaces any insurance decision", "A business impact analysis decides who may approve policy exceptions, so insurance is chosen by the board afterward"], 0, "A business impact analysis examines an information system's requirements, functions, and interdependencies to characterize contingency requirements and priorities in a significant disruption. It sets what must be recovered first, and does not select financial transfer options.", 2], ["Which statement about a disaster recovery plan is accurate?", ["It prepares recovery of critical functions, technology, systems, and applications after a disaster, when a critical function cannot be performed acceptably in the set period", "It prepares instructions for detecting and limiting a malicious cyberattack against the organization's information systems and networks", "It prepares a ranking of systems by dependency so that executives can decide which insurance policy to buy next year", "It prepares for keeping every business process running unchanged through any disruption, however minor, so that no recovery is ever needed"], 0, "The disaster recovery plan covers processes, policies, and procedures for preparing for recovery or continuation of critical business functions, technology infrastructure, systems, and applications after a disaster. A disaster is when a critical function cannot be performed at an acceptable level within a predetermined period.", 2], ["A security analyst receives an alert about odd outbound traffic. Which sequence best reflects incident response as the glossary defines it?", ["Restore every service, rewrite the policy, and then review the logs", "Approve the change request, deploy the revision, and verify the installation", "Detect the suspicious activity, analyze its scope, and take steps to limit its effect", "Rank the systems, document their dependencies, and set the restoration order"], 2, "Incident handling or incident response is the process of detecting and analyzing incidents to limit the incident's effect. The other sequences describe restoration, change management, and business impact analysis activities.", 2], ["Which occurrence best qualifies as an intrusion?", ["An employee mistypes a password once and is allowed to retry immediately after the login screen reloads", "A scheduled vulnerability scan runs from the security team across the internal network overnight each week", "A server restarts normally after an approved maintenance window that was announced to all staff", "An outsider attempts, without success, to log in to an administration console using stolen credentials"], 3, "An intrusion is a security event, or combination of events, that constitutes an incident in which an intruder gains or attempts to gain access without authorization. A failed attempt with stolen credentials still counts. The other occurrences are routine events.", 2], ["Which situation is a breach as the glossary defines the term?", ["A phishing email is blocked by the mail filter before it reaches any recipient inside the company", "A vendor's invoice is paid twice because of a clerical mistake made by someone on the finance team", "A contractor with no job need opens employee medical files that contain personally identifiable information", "A server crashes during peak traffic and restarts automatically after a few minutes without losing data"], 2, "A breach is a loss of control, compromise, or unauthorized disclosure or acquisition where a person other than an authorized user accesses personally identifiable information, or an authorized user accesses it for other than an authorized purpose. A crash, a blocked email, and a clerical error do not involve such access.", 2], ["A fire forces a team to restore either the executive strategy archive, which is highly secret and rarely used, or the dispatch system, which is not secret but used constantly by emergency crews. Which should come first, and why?", ["The dispatch system, because the mission depends on it more, which is criticality rather than sensitivity", "The strategy archive, because it is more classified, and classification determines the recovery order", "The strategy archive, because it is more sensitive, and sensitivity determines the recovery order", "The dispatch system, because it is more likely to fail again, and likelihood determines the recovery order"], 0, "Criticality is the degree to which an organization depends on information or a system for its mission, and recovery priorities from the business impact analysis follow it. Sensitivity and classification concern protecting information from disclosure, which does not set restoration order.", 2], ["Which statement correctly orders event, adverse event, and incident?", ["Every adverse event is an incident, and an incident is an event only if it has been recorded in a log by the monitoring system", "Every event is an incident, and an incident is adverse only if it damages hardware owned by the organization or its vendors", "Every incident is an adverse event, and an adverse event is a breach only if it is reported to regulators within the required time", "Every adverse event is an event, and an event is an incident only if it actually or potentially jeopardizes confidentiality, integrity, or availability"], 3, "An event is any observable occurrence, an adverse event is an event with a negative consequence, and an incident is an event that actually or potentially jeopardizes confidentiality, integrity, or availability. Not every event is an incident, and incident status does not depend on logging or reporting.", 2], ["A planner needs to match three documents to three purposes: sustain mission processes during a disruption, restore information technology after a disaster, and handle a malicious cyberattack. Which pairing is correct, in that order?", ["Business continuity plan; incident response plan; disaster recovery plan", "Disaster recovery plan; business continuity plan; incident response plan", "Incident response plan; business continuity plan; disaster recovery plan", "Business continuity plan; disaster recovery plan; incident response plan"], 3, "The business continuity plan describes how mission processes are sustained, the disaster recovery plan covers recovery of technology and systems, and the incident response plan covers detecting, responding to, and limiting a malicious cyberattack.", 2], ["A new security manager asks what an incident response plan must provide. Which answer matches the glossary?", ["Predetermined instructions to restore information technology and communications after an outage", "Predetermined instructions to sustain mission processes during and after a significant disruption", "Predetermined instructions to rank systems by dependency for recovery after a disruption", "Predetermined instructions to detect, respond to, and limit the consequences of a malicious cyberattack"], 3, "The incident response plan is the documentation of predetermined instructions or procedures to detect, respond to, and limit consequences of a malicious cyberattack against an organization's information systems. The other descriptions fit the business continuity plan, the disaster recovery plan, and the business impact analysis.", 2]], "3": [["After a clerk logs in, the system lets her open payroll files but hides the administration menu from her. Which concept decides what she may do, and what does it rely on?", ["Authorization, the permission granted to her identity for specific system resources", "Authentication, the verification that her credentials belong to her claimed identity", "Non-repudiation, the inability of her to deny actions taken under her identity", "Availability, the guarantee that authorized users can reach the payroll files"], 0, "Authorization is the right or permission granted to a system entity to access a system resource, and it decides what a verified user may do. Authentication only established who she is. Non-repudiation and availability concern denial of actions and timely access, not which menus she may see.", 3], ["A project lead creates a shared folder and lets a delegate decide who else may edit it. A defense agency's system, by contrast, labels files and refuses sharing that violates p
